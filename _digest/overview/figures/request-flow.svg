<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1000" height="900" rx="12" fill="url(#bg)"/>

  <text x="500" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">请求数据流 — HTTP/SSE → Agent Runtime 完整路径</text>

  <!-- Column labels -->
  <text x="80" y="68" fill="#64748b" font-size="11">Client</text>
  <text x="240" y="68" fill="#64748b" font-size="11">Gateway</text>
  <text x="400" y="68" fill="#64748b" font-size="11">RunManager</text>
  <text x="560" y="68" fill="#64748b" font-size="11">make_lead_agent</text>
  <text x="720" y="68" fill="#64748b" font-size="11">LangGraph</text>
  <text x="880" y="68" fill="#64748b" font-size="11">Middleware/Tools</text>

  <!-- step 1 -->
  <rect x="20" y="80" width="130" height="44" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1"/>
  <text x="85" y="98" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">1. POST /stream</text>
  <text x="85" y="114" text-anchor="middle" fill="#94a3b8" font-size="9">{messages, configurable}</text>
  <line x1="150" y1="102" x2="210" y2="102" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- step 2 -->
  <rect x="215" y="80" width="150" height="44" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1"/>
  <text x="290" y="98" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">2. Router 匹配</text>
  <text x="290" y="114" text-anchor="middle" fill="#94a3b8" font-size="9">thread_runs.stream()</text>
  <line x1="365" y1="102" x2="420" y2="102" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- step 3 -->
  <rect x="425" y="80" width="150" height="44" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1"/>
  <text x="500" y="98" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">3. RunManager</text>
  <text x="500" y="114" text-anchor="middle" fill="#94a3b8" font-size="9">create_or_reject()</text>
  <line x1="575" y1="102" x2="630" y2="102" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- step 4 -->
  <rect x="635" y="80" width="150" height="44" rx="6" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="710" y="98" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">4. spawn Task</text>
  <text x="710" y="114" text-anchor="middle" fill="#94a3b8" font-size="9">asyncio.Task(run_agent)</text>
  <line x1="785" y1="102" x2="840" y2="102" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- step 4b: return SSE immediately -->
  <rect x="845" y="80" width="130" height="44" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1"/>
  <text x="910" y="98" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">4b. 返回 SSE</text>
  <text x="910" y="114" text-anchor="middle" fill="#94a3b8" font-size="9">StreamingResponse</text>

  <!-- step 5 -->
  <rect x="635" y="155" width="150" height="44" rx="6" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="710" y="173" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">5. RunContext</text>
  <text x="710" y="189" text-anchor="middle" fill="#94a3b8" font-size="9">checkpointer, stream_bridge</text>

  <!-- step 6 -->
  <rect x="425" y="230" width="180" height="80" rx="6" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="515" y="255" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">6. make_lead_agent(config)</text>
  <text x="515" y="275" text-anchor="middle" fill="#94a3b8" font-size="9">a) resolve model_name</text>
  <text x="515" y="290" text-anchor="middle" fill="#94a3b8" font-size="9">b) create_chat_model()</text>
  <text x="515" y="305" text-anchor="middle" fill="#94a3b8" font-size="9">c) get_available_tools()</text>

  <line x1="710" y1="199" x2="710" y2="215" stroke="#f59e0b" stroke-width="1"/>
  <line x1="710" y1="215" x2="515" y2="230" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- step 6 cont -->
  <rect x="260" y="335" width="180" height="45" rx="6" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="350" y="355" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">6d) apply_prompt_template()</text>
  <text x="350" y="372" text-anchor="middle" fill="#94a3b8" font-size="9">System Prompt (skills, memory, date)</text>

  <rect x="460" y="335" width="180" height="45" rx="6" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="550" y="355" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">6e) _build_middlewares()</text>
  <text x="550" y="372" text-anchor="middle" fill="#94a3b8" font-size="9">19 middlewares assembled</text>

  <rect x="660" y="335" width="180" height="45" rx="6" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="750" y="355" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">6f) create_agent()</text>
  <text x="750" y="372" text-anchor="middle" fill="#94a3b8" font-size="9">LangGraph StateGraph</text>

  <line x1="515" y1="310" x2="350" y2="335" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="515" y1="310" x2="550" y2="335" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="515" y1="310" x2="750" y2="335" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- step 7 -->
  <rect x="660" y="415" width="180" height="44" rx="6" fill="#1a2a1a" stroke="#10b981" stroke-width="1"/>
  <text x="750" y="433" text-anchor="middle" fill="#34d399" font-size="10" font-weight="bold">7. graph.astream()</text>
  <text x="750" y="449" text-anchor="middle" fill="#94a3b8" font-size="9">stream_mode=[values, updates,</text>

  <line x1="750" y1="380" x2="750" y2="415" stroke="#10b981" stroke-width="1"/>

  <!-- step 8: middleware execution -->
  <rect x="420" y="495" width="190" height="60" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1"/>
  <text x="515" y="515" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="bold">8. before_model Middleware</text>
  <text x="515" y="532" text-anchor="middle" fill="#94a3b8" font-size="9">DynamicContext · Summarization</text>
  <text x="515" y="547" text-anchor="middle" fill="#94a3b8" font-size="9">ViewImage · DeferredTools · ...</text>

  <line x1="750" y1="459" x2="750" y2="480" stroke="#10b981" stroke-width="1"/>
  <line x1="750" y1="480" x2="515" y2="495" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- step 9 -->
  <rect x="660" y="495" width="160" height="60" rx="6" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1"/>
  <text x="740" y="515" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">9. LLM Call</text>
  <text x="740" y="532" text-anchor="middle" fill="#94a3b8" font-size="9">model.invoke(messages)</text>
  <text x="740" y="547" text-anchor="middle" fill="#94a3b8" font-size="9">→ AIMessage (text or tool_calls)</text>

  <line x1="610" y1="525" x2="660" y2="525" stroke="#8b5cf6" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- step 10 -->
  <rect x="420" y="585" width="190" height="60" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1"/>
  <text x="515" y="605" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="bold">10. after_model Middleware</text>
  <text x="515" y="622" text-anchor="middle" fill="#94a3b8" font-size="9">DanglingToolCall · Guardrail</text>
  <text x="515" y="637" text-anchor="middle" fill="#94a3b8" font-size="9">LoopDetection · Clarification</text>

  <line x1="740" y1="555" x2="740" y2="570" stroke="#8b5cf6" stroke-width="1"/>
  <line x1="740" y1="570" x2="515" y2="585" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- step 11: tool exec -->
  <rect x="140" y="585" width="160" height="60" rx="6" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1"/>
  <text x="220" y="605" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">11. Tool Execution</text>
  <text x="220" y="622" text-anchor="middle" fill="#94a3b8" font-size="9">Sandbox/MCP/Builtin</text>
  <text x="220" y="637" text-anchor="middle" fill="#94a3b8" font-size="9">→ ToolMessage results</text>

  <line x1="420" y1="615" x2="300" y2="615" stroke="#8b5cf6" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- step 12: loop back -->
  <line x1="300" y1="615" x2="300" y2="660" stroke="#64748b" stroke-width="1"/>
  <line x1="300" y1="660" x2="660" y2="660" stroke="#64748b" stroke-width="1"/>
  <line x1="660" y1="660" x2="660" y2="555" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="490" y="675" text-anchor="middle" fill="#64748b" font-size="10">12. Loop: tool results → LLM → tools → ... until LLM produces text</text>

  <!-- step 13 -->
  <rect x="660" y="700" width="160" height="60" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="740" y="720" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">13. Finish</text>
  <text x="740" y="737" text-anchor="middle" fill="#94a3b8" font-size="9">emit "end" SSE event</text>
  <text x="740" y="752" text-anchor="middle" fill="#94a3b8" font-size="9">Title · Memory · TokenUsage</text>

  <line x1="740" y1="555" x2="740" y2="700" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- step 14 -->
  <rect x="420" y="700" width="160" height="60" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="500" y="720" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">14. after_step</text>
  <text x="500" y="737" text-anchor="middle" fill="#94a3b8" font-size="9">TitleMiddleware</text>
  <text x="500" y="752" text-anchor="middle" fill="#94a3b8" font-size="9">MemoryMiddleware</text>

  <line x1="660" y1="730" x2="580" y2="730" stroke="#ef4444" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- bottom: yield path -->
  <line x1="740" y1="760" x2="740" y2="790" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="740" y1="790" x2="85" y2="790" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="800" width="130" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="85" y="819" text-anchor="middle" fill="#94a3b8" font-size="10">SSE → Browser</text>

  <!-- yield line for each chunk -->
  <text x="400" y="813" fill="#64748b" font-size="9">每个 chunk: values / messages-tuple / custom → StreamBridge → SSE</text>

  <!-- timestamps on right side -->
  <rect x="845" y="150" width="130" height="44" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="910" y="168" text-anchor="middle" fill="#64748b" font-size="9">RunManager</text>
  <text x="910" y="184" text-anchor="middle" fill="#64748b" font-size="9">→ run_agent() Task</text>

  <rect x="845" y="230" width="130" height="44" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="910" y="248" text-anchor="middle" fill="#64748b" font-size="9">inject tracing</text>
  <text x="910" y="264" text-anchor="middle" fill="#64748b" font-size="9">LangSmith/Langfuse</text>

  <line x1="815" y1="270" x2="845" y2="250" stroke="#64748b" stroke-width="0.8" stroke-dasharray="4,3"/>
</svg>
