  <circle cx="450" cy="300" r="14" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="450" y="304" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">Sub</text>

  <circle cx="440" cy="380" r="14" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="440" y="384" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">Mem</text>

  <circle cx="370" cy="430" r="14" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="370" y="434" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">Sk</text>

  <circle cx="280" cy="420" r="14" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
