  <rect x="898" y="586" width="100" height="22" rx="4" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="948" y="601" text-anchor="middle" fill="#c4b5fd" font-size="9">Auth · CSRF</text>

  <text x="840" y="636" text-anchor="middle" fill="#64748b" font-size="8">POST /threads/{id}/runs/stream → Router → RunManager.create_or_reject()</text>

