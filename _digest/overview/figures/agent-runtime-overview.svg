  <text x="935" y="568" text-anchor="end" fill="#ddd6fe" font-size="9">挂入方式: HTTP → RunManager</text>

  <rect x="682" y="586" width="100" height="22" rx="4" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="732" y="601" text-anchor="middle" fill="#c4b5fd" font-size="9">FastAPI :8001</text>
  <rect x="790" y="586" width="100" height="22" rx="4" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="0.8"/>
