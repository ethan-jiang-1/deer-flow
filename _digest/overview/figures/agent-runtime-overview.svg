  <text x="175" y="455" text-anchor="middle" fill="#c4b5fd" font-size="9">Config · Deps</text>

  <!-- Ring 2 items (radius ~160) -->
  <rect x="210" y="210" width="100" height="22" rx="5" fill="#0f2744" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="260" y="225" text-anchor="middle" fill="#60a5fa" font-size="9">RunManager</text>

  <rect x="370" y="210" width="110" height="22" rx="5" fill="#0f2744" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="425" y="225" text-anchor="middle" fill="#60a5fa" font-size="9">make_lead_agent</text>

