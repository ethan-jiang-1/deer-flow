  <rect x="928" y="691" width="70" height="22" rx="4" fill="#04332b" stroke="#22c55e" stroke-width="0.8"/>
  <text x="963" y="706" text-anchor="middle" fill="#4ade80" font-size="9">IM ×7</text>

  <text x="840" y="740" text-anchor="middle" fill="#64748b" font-size="8">SDK 走虚线直入 Harness，绕开 HTTP 和 Gateway</text>

  <!-- ============================================================ -->
  <!-- BOTTOM: Key Constraints -->
  <!-- ============================================================ -->
  <rect x="670" y="765" width="340" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="840" y="788" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="bold">约束规则</text>
  <text x="840" y="805" text-anchor="middle" fill="#94a3b8" font-size="9">外层 import 内层 ✓ · 内层 import 外层 ✗ · CI 强制检查 · Harness 可独立 pip 发布</text>
  <text x="840" y="818" text-anchor="middle" fill="#94a3b8" font-size="9">LangGraph 不独立部署 — Gateway 内嵌 Runtime 进程</text>

  <!-- Arrows between cards showing inward dependency -->
  <line x1="840" y1="260" x2="840" y2="270" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrow-in)"/>
  <line x1="840" y1="400" x2="840" y2="410" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrow-in)"/>
