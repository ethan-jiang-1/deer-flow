  <text x="360" y="515" text-anchor="middle" fill="#60a5fa" font-size="9">Tracing · Guardrails</text>

  <!-- Ring 1 items (radius ~110) -->
  <circle cx="280" cy="260" r="14" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="280" y="264" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">SB</text>

  <circle cx="380" cy="260" r="14" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
