  <text x="455" y="415" text-anchor="middle" fill="#60a5fa" font-size="9">StreamBridge</text>

  <rect x="200" y="400" width="110" height="22" rx="5" fill="#0f2744" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="255" y="415" text-anchor="middle" fill="#60a5fa" font-size="9">Model Factory</text>

