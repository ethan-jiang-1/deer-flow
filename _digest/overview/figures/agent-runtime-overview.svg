  <text x="921" y="496" text-anchor="middle" fill="#60a5fa" font-size="9">Model Factory</text>

  <text x="840" y="532" text-anchor="middle" fill="#64748b" font-size="8">通过 make_lead_agent(config) 装配 Agent Loop 的 model + tools + prompt + middleware</text>

  <!-- === LAYER 3: Gateway === -->
  <rect x="670" y="550" width="340" height="95" rx="8" fill="#0f0520" stroke="#8b5cf6" stroke-width="1.2"/>
  <rect x="670" y="550" width="340" height="26" rx="8" fill="#7c3aed"/>
  <rect x="670" y="566" width="340" height="10" fill="#7c3aed"/>
