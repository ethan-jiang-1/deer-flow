  <rect x="670" y="655" width="340" height="95" rx="8" fill="#0a150a" stroke="#22c55e" stroke-width="1.2"/>
  <rect x="670" y="655" width="340" height="26" rx="8" fill="#15803d"/>
  <rect x="670" y="671" width="340" height="10" fill="#15803d"/>
  <text x="840" y="673" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Ring 4: External Access</text>
  <text x="935" y="673" text-anchor="end" fill="#bbf7d0" font-size="9">挂入方式: HTTP · SSE · SDK import</text>

  <rect x="682" y="691" width="75" height="22" rx="4" fill="#04332b" stroke="#22c55e" stroke-width="0.8"/>
  <text x="719" y="706" text-anchor="middle" fill="#4ade80" font-size="9">Browser</text>
  <rect x="764" y="691" width="75" height="22" rx="4" fill="#04332b" stroke="#22c55e" stroke-width="0.8"/>
  <text x="801" y="706" text-anchor="middle" fill="#4ade80" font-size="9">HTTP API</text>
