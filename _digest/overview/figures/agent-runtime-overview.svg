  <circle cx="360" cy="340" r="110" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="360" cy="340" r="91" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,6"/>

