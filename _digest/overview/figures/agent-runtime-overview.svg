  <!-- ============================================================ -->

  <!-- Card title -->
  <text x="840" y="75" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold">每层拆解 — 里面有什么 · 如何挂入核心</text>

  <!-- === LAYER 0: Agent Loop === -->
  <rect x="670" y="90" width="340" height="170" rx="8" fill="#1a0f00" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="670" y="90" width="340" height="26" rx="8" fill="#d97706"/>
  <rect x="670" y="106" width="340" height="10" fill="#d97706"/>
  <text x="840" y="108" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Center: Agent Loop (LangGraph 状态机)</text>

  <!-- Mini loop diagram -->
  <rect x="682" y="125" width="140" height="28" rx="4" fill="#2a1a00" stroke="#b45309" stroke-width="0.8"/>
  <text x="752" y="144" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">LLM (model.invoke)</text>

  <line x1="752" y1="153" x2="752" y2="160" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrow-in)"/>

