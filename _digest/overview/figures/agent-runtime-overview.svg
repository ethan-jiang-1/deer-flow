  <rect x="868" y="151" width="122" height="18" rx="3" fill="#1a1a2e"/>
  <text x="929" y="164" text-anchor="middle" fill="#a5b4fc" font-size="8">before_model ×6</text>
  <rect x="868" y="174" width="122" height="18" rx="3" fill="#1a1a2e"/>
  <text x="929" y="187" text-anchor="middle" fill="#a5b4fc" font-size="8">after_model ×4</text>
  <rect x="868" y="197" width="122" height="18" rx="3" fill="#04332b"/>
  <text x="929" y="210" text-anchor="middle" fill="#34d399" font-size="8">after_tool ×2</text>
  <rect x="868" y="220" width="122" height="18" rx="3" fill="#450a0a"/>
  <text x="929" y="233" text-anchor="middle" fill="#fca5a5" font-size="8">after_step ×2</text>

  <text x="682" y="254" fill="#64748b" font-size="8">ThreadState: messages / sandbox / artifacts / todos</text>

  <!-- === LAYER 1: Core Services === -->
