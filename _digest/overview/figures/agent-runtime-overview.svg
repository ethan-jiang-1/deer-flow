  <rect x="898" y="338" width="100" height="26" rx="4" fill="#2a1a00" stroke="#d97706" stroke-width="0.8"/>
  <text x="948" y="356" text-anchor="middle" fill="#fbbf24" font-size="9">Checkpointer</text>

  <text x="840" y="392" text-anchor="middle" fill="#64748b" font-size="8">Agent Loop 每一步都直接 await 这些服务，没有中间层</text>

  <!-- === LAYER 2: Harness === -->
  <rect x="670" y="410" width="340" height="130" rx="8" fill="#0a1628" stroke="#3b82f6" stroke-width="1.2"/>
