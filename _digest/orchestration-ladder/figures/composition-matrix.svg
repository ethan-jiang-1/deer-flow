<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="PingFang SC, sans-serif">
  <text x="490" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">组合冲突矩阵与收尾纪律（05 号）</text>
  <g font-size="11">
    <!-- composition matrix -->
    <text x="60" y="62" font-weight="700" fill="#0f172a" font-size="13">组合形态（A × B 的判定）</text>
    <rect x="60" y="74" width="8" height="26" fill="#dc2626"/><text x="80" y="92" fill="#7f1d1d" font-weight="600">结构性禁止</text>
    <rect x="220" y="74" width="8" height="26" fill="#f59e0b"/><text x="240" y="92" fill="#92400e" font-weight="600">运行期软化 / 收敛</text>
    <rect x="420" y="74" width="8" height="26" fill="#16a34a"/><text x="440" y="92" fill="#14532d" font-weight="600">自由（靠预算约束）</text>

    <g font-size="11">
      <rect x="60" y="108" width="440" height="30" rx="6" fill="#fef2f2"/><text x="75" y="128" fill="#7f1d1d">scheduler run × ask_clarification —— non_interactive 工具表剔除</text>
      <rect x="520" y="108" width="400" height="30" rx="6" fill="#fef2f2"/><text x="535" y="128" fill="#7f1d1d">子代理 × task/ask_clarification —— disallowed_tools 双保险</text>
      <rect x="60" y="146" width="440" height="30" rx="6" fill="#fffbeb"/><text x="75" y="166" fill="#92400e">IM 非交互通道 × ask_clarification —— disable_clarification 软化（保留兄弟调用）</text>
      <rect x="520" y="146" width="400" height="30" rx="6" fill="#fffbeb"/><text x="535" y="166" fill="#92400e">goal × ask_clarification —— needs_user_input 主动让位 stand down</text>
      <rect x="60" y="184" width="440" height="30" rx="6" fill="#f0fdf4"/><text x="75" y="204" fill="#14532d">scheduler × task/batch —— 自由（定时任务可扇出）</text>
      <rect x="520" y="184" width="400" height="30" rx="6" fill="#f0fdf4"/><text x="535" y="204" fill="#14532d">goal 续轮 × task —— 自由但预算同源（同 run_id 共享 6 次）</text>
      <rect x="60" y="222" width="440" height="30" rx="6" fill="#f0fdf4"/><text x="75" y="242" fill="#14532d">scheduler run × goal 续轮 —— 隐藏耦合：照样评估+注入</text>
      <rect x="520" y="222" width="400" height="30" rx="6" fill="#f0fdf4"/><text x="535" y="242" fill="#14532d">IM busy × 新消息 —— END 哨兵链式排空（≤10/批）</text>
    </g>
    <text x="60" y="278" fill="#475569" font-weight="600">纵深判断：禁止集中在 HITL 与委派再入，都用"工具不在表里"实现 —— 能力面剔除表达"不可能"，预算表达"太贵"，两者不混用</text>

    <!-- stop_reason two disciplines -->
    <text x="60" y="316" font-weight="700" fill="#0f172a" font-size="13">stop_reason：两套相反的聚合纪律</text>
    <rect x="60" y="330" width="440" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="80" y="352" fill="#0c4a6e" font-weight="600">lead run：单键后写者胜</text>
    <text x="80" y="370" fill="#075985">五 guard 共写 runtime.context["stop_reason"]</text>
    <text x="80" y="386" fill="#075985">唯一例外 model_length 先写者胜（自认设计债）</text>
    <text x="80" y="400" fill="#075985">stop_reason 只在首个用户 turn 前清除，续轮洗不掉</text>
    <rect x="520" y="330" width="400" height="76" rx="8" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="540" y="352" fill="#14532d" font-weight="600">子代理：consume_stop_reason 先到者胜</text>
    <text x="540" y="370" fill="#166534">per-run BoundedDict + 弹出式消费</text>
    <text x="540" y="386" fill="#166534">executor 鸭子类型收集所有实现方</text>
    <text x="540" y="400" fill="#b91c1c">反向约束：token_capped 直接触发 goal 续轮 stand down</text>

    <!-- notification channels -->
    <text x="60" y="438" font-weight="700" fill="#0f172a" font-size="13">通知三通道（无总线）</text>
    <g font-size="11">
      <rect x="60" y="452" width="280" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="200" y="474" text-anchor="middle" fill="#334155" font-weight="600">scheduler 专属 push 钩子</text>
      <text x="200" y="491" text-anchor="middle" fill="#475569">on_run_completed（END 之前）</text>
      <text x="200" y="507" text-anchor="middle" fill="#475569">丢失兜底 = 启动 sweep 降级记账</text>
      <rect x="360" y="452" width="280" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="500" y="474" text-anchor="middle" fill="#334155" font-weight="600">IM 流哨兵排空</text>
      <text x="500" y="491" text-anchor="middle" fill="#475569">END_SENTINEL 驱动 · 三层兜底</text>
      <text x="500" y="507" text-anchor="middle" fill="#475569">缓冲永不因失败丢（per-process 边界）</text>
      <rect x="660" y="452" width="260" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="790" y="474" text-anchor="middle" fill="#334155" font-weight="600">MCP 纯轮询</text>
      <text x="790" y="491" text-anchor="middle" fill="#475569">lease + 幂等 launch + dead-letter</text>
      <text x="790" y="507" text-anchor="middle" fill="#475569">delivered ≠ 用户已读</text>
    </g>
    <text x="60" y="545" fill="#94a3b8" font-size="10">_digest/orchestration-ladder/figures/composition-matrix.svg · 证据链见 05 号笔记（§1 组合清单 + §2 聚合纪律 + §3 收尾 + §4 通知）</text>
  </g>
</svg>
