<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="PingFang SC, sans-serif">
  <text x="490" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">图计算的本质：四个真实的图 + Agent 是原子（08 号）</text>
  <g font-size="11">
    <!-- four graphs -->
    <text x="60" y="60" font-weight="700" fill="#0f172a" font-size="13">编排里真实的图（而非外部叙事想象的一个 DAG）</text>
    <rect x="60" y="74" width="210" height="86" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="165" y="97" text-anchor="middle" fill="#4c1d95" font-weight="600">① checkpoint 谱系</text>
    <text x="165" y="115" text-anchor="middle" fill="#5b21b6">parent 链持久树</text>
    <text x="165" y="131" text-anchor="middle" fill="#5b21b6">delta 禁 fork → 线性覆写</text>
    <text x="165" y="149" text-anchor="middle" fill="#7c3aed" font-size="10">归 checkpointer + worker</text>
    <rect x="290" y="74" width="210" height="86" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="395" y="97" text-anchor="middle" fill="#14532d" font-weight="600">② react 元图</text>
    <text x="395" y="115" text-anchor="middle" fill="#166534">model / tools 两节点循环</text>
    <text x="395" y="131" text-anchor="middle" fill="#166534">工具并行 = 每 call 一个 Send</text>
    <text x="395" y="149" text-anchor="middle" fill="#16a34a" font-size="10">归 langgraph v2（吃默认）</text>
    <rect x="520" y="74" width="200" height="86" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="620" y="97" text-anchor="middle" fill="#713f12" font-weight="600">③ 委派账本</text>
    <text x="620" y="115" text-anchor="middle" fill="#854d0e">append-only ledger</text>
    <text x="620" y="131" text-anchor="middle" fill="#854d0e">记账的图 ≠ 执行的图</text>
    <text x="620" y="149" text-anchor="middle" fill="#a16207" font-size="10">归 ThreadState reducer</text>
    <rect x="740" y="74" width="180" height="86" rx="10" fill="#ffe4e6" stroke="#e11d48"/>
    <text x="830" y="97" text-anchor="middle" fill="#881337" font-weight="600">④ 预算归属链</text>
    <text x="830" y="115" text-anchor="middle" fill="#9f1239">run_id 为根的消耗树</text>
    <text x="830" y="131" text-anchor="middle" fill="#9f1239">goal 续轮共享根预算</text>
    <text x="830" y="149" text-anchor="middle" fill="#be123c" font-size="10">归各 middleware/服务</text>

    <!-- engine does/rejects -->
    <text x="60" y="192" font-weight="700" fill="#0f172a" font-size="13">引擎分界：确定性 vs 概率性</text>
    <rect x="60" y="206" width="420" height="88" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="80" y="228" fill="#14532d" font-weight="600">做的（机械保证）</text>
    <text x="80" y="246" fill="#166534" font-size="10.5">super-step 调度 · Send 派发 · checkpoint 持久化 · 六层预算闸门</text>
    <text x="80" y="262" fill="#166534" font-size="10.5">lease 双向围栏 · 原子准入（唯一索引）</text>
    <text x="80" y="282" fill="#15803d" font-size="10.5">确定性全部花在：准入 / 预算 / 收尾</text>
    <rect x="500" y="206" width="420" height="88" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="520" y="228" fill="#7f1d1d" font-weight="600">拒绝的（交给模型 / 运维）</text>
    <text x="520" y="246" fill="#991b1b" font-size="10.5">拓扑排序与派发（就绪≠启动）· 重规划（无改图原语）</text>
    <text x="520" y="262" fill="#991b1b" font-size="10.5">跨 run 执行恢复（标错对账 fail-closed）</text>
    <text x="520" y="282" fill="#b91c1c" font-size="10.5">比 DSH 更激进：连任务板都没有，语义判断 100% 归模型</text>

    <!-- agent as atom -->
    <text x="60" y="328" font-weight="700" fill="#0f172a" font-size="13">Agent 是原子（能力包络 = 智力 × 体力 × 许可）</text>
    <g font-size="10.5">
      <rect x="60" y="342" width="200" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="160" y="362" text-anchor="middle" fill="#0c4a6e" font-weight="600">task / batch</text><text x="160" y="378" text-anchor="middle" fill="#075985">体力=工具表（run 前定型）</text>
      <rect x="280" y="342" width="200" height="46" rx="8" fill="#ffe4e6" stroke="#e11d48"/><text x="380" y="362" text-anchor="middle" fill="#881337" font-weight="600">goal</text><text x="380" y="378" text-anchor="middle" fill="#9f1239">智力=评估器准入续轮</text>
      <rect x="500" y="342" width="200" height="46" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="600" y="362" text-anchor="middle" fill="#713f12" font-weight="600">scheduler / interrupt</text><text x="600" y="378" text-anchor="middle" fill="#854d0e">许可=预算链+信任边界键</text>
      <rect x="720" y="342" width="200" height="46" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="820" y="362" text-anchor="middle" fill="#334155" font-weight="600">ask_clarification</text><text x="820" y="378" text-anchor="middle" fill="#475569">回执可能改判 success</text>
    </g>

    <!-- copper/current inversion -->
    <rect x="60" y="408" width="860" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="80" y="432" fill="#713f12" font-weight="700">代码-语言倒置样本（DeerFlow 特有）</text>
    <text x="80" y="452" fill="#854d0e" font-size="10.5">"铜线是代码，电流是语言"——但 batch 的 at-least-once 契约写在 prompt 里（batch_service.py:243）：</text>
    <text x="80" y="468" fill="#854d0e" font-size="10.5">本该代码保证的幂等性，一半交给语言嘱咐模型。读编排代码时分清：哪些保证住在校验器里，哪些只住在 prompt 里。</text>
    <text x="60" y="510" fill="#475569" font-weight="600">收束：利用 DeerFlow = 接受三前提 —— 组合靠预算不靠规则 · 完成靠证据链不靠状态位 · 恢复靠重发不靠续传</text>
    <text x="60" y="530" fill="#94a3b8" font-size="10">_digest/orchestration-ladder/figures/graph-essence.svg · 证据链见 08 号（综合 01-07 锚点）</text>
  </g>
</svg>
