<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" font-family="PingFang SC, sans-serif">
  <text x="490" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">身份谱系与冷恢复（06 号）</text>
  <defs><marker id="h" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker></defs>
  <g font-size="11">
    <!-- lineage layers -->
    <text x="60" y="60" font-weight="700" fill="#0f172a" font-size="13">六层身份谱系</text>
    <rect x="60" y="74" width="150" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="135" y="96" text-anchor="middle" fill="#0c4a6e" font-weight="600">thread</text>
    <text x="135" y="112" text-anchor="middle" fill="#075985" font-size="10">caller-defined opaque</text>
    <rect x="240" y="74" width="150" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="315" y="96" text-anchor="middle" fill="#0c4a6e" font-weight="600">run</text>
    <text x="315" y="112" text-anchor="middle" fill="#075985" font-size="10">持久行 · occurrence 引用</text>
    <rect x="420" y="74" width="260" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="550" y="92" text-anchor="middle" fill="#14532d" font-weight="600">子代理双轨 id（关键分离）</text>
    <text x="550" y="107" text-anchor="middle" fill="#166534" font-size="10">execution_id=uuid4 → 注册表所有权键</text>
    <text x="550" y="120" text-anchor="middle" fill="#166534" font-size="10">tool_call_id → 关联键（跨 run 不唯一）</text>
    <rect x="710" y="74" width="210" height="52" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="815" y="92" text-anchor="middle" fill="#713f12" font-weight="600">batch item / occurrence / worker</text>
    <text x="815" y="107" text-anchor="middle" fill="#854d0e" font-size="10">item_key 持久 · worker 进程身份</text>
    <text x="815" y="120" text-anchor="middle" fill="#854d0e" font-size="10">_generate_worker_id()</text>
    <path d="M210,100 h22" stroke="#64748b" marker-end="url(#h)"/><path d="M390,100 h22" stroke="#64748b" marker-end="url(#h)"/><path d="M680,100 h22" stroke="#64748b" marker-end="url(#h)"/>
    <text x="640" y="146" fill="#b91c1c" font-weight="600">关联键 ≠ 所有权键 —— provider id 永不做注册表键；ExtensionData 的 or-回退是错位风险点</text>

    <!-- ownership fencing -->
    <text x="60" y="186" font-weight="700" fill="#0f172a" font-size="13">lease 心跳与双向围栏</text>
    <rect x="60" y="200" width="860" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <g font-size="11" fill="#334155">
      <text x="85" y="224">owner worker：start_heartbeat → 单飞续租（只续 owner_worker_id==自己 且未完成的活跃 run）</text>
      <text x="85" y="244">peer：lease 过期（lease_seconds + grace_seconds，grace=时钟偏差非执行时间）→ claim_for_takeover 原子认领 → 标 error</text>
      <text x="85" y="264" font-weight="600" fill="#b91c1c">活 owner 下一次心跳观察到被接管 → 自行镜像 error 收尾（双向收敛，不靠通知）</text>
      <text x="85" y="282">续租失败/成功无法持久确认 → ownership_lost 围栏：禁写 journal/回执/状态/checkpoint/钩子（peer 拥有终态回执）</text>
    </g>

    <!-- cold recovery order -->
    <text x="60" y="324" font-weight="700" fill="#0f172a" font-size="13">冷恢复时序（顺序是结构性的：先对账、后心跳）</text>
    <g font-size="11">
      <rect x="60" y="338" width="190" height="62" rx="8" fill="#fef2f2" stroke="#dc2626"/>
      <text x="155" y="360" text-anchor="middle" fill="#7f1d1d" font-weight="600">① orphan 对账</text>
      <text x="155" y="377" text-anchor="middle" fill="#991b1b" font-size="10">单 worker 收全部在途</text>
      <text x="155" y="391" text-anchor="middle" fill="#991b1b" font-size="10">多 worker 只收过期 lease</text>
      <rect x="275" y="338" width="190" height="62" rx="8" fill="#fff7ed" stroke="#ea580c"/>
      <text x="370" y="360" text-anchor="middle" fill="#7c2d12" font-weight="600">② terminalize</text>
      <text x="370" y="377" text-anchor="middle" fill="#9a3412" font-size="10">发布 END + 排流清理</text>
      <text x="370" y="391" text-anchor="middle" fill="#9a3412" font-size="10">（订阅者不能挂着）</text>
      <rect x="490" y="338" width="190" height="62" rx="8" fill="#fff7ed" stroke="#ea580c"/>
      <text x="585" y="360" text-anchor="middle" fill="#7c2d12" font-weight="600">③ thread error 投影</text>
      <text x="585" y="377" text-anchor="middle" fill="#9a3412" font-size="10">仅启动期做（周期恢复</text>
      <text x="585" y="391" text-anchor="middle" fill="#9a3412" font-size="10">刻意不做非原子投影）</text>
      <rect x="705" y="338" width="215" height="62" rx="8" fill="#dcfce7" stroke="#16a34a"/>
      <text x="812" y="360" text-anchor="middle" fill="#14532d" font-weight="600">④ start_heartbeat</text>
      <text x="812" y="377" text-anchor="middle" fill="#166534" font-size="10">对账完成后才发心跳</text>
      <text x="812" y="391" text-anchor="middle" fill="#166534" font-size="10">（避免给已判死 run 续命）</text>
      <path d="M250,369 h17" stroke="#64748b" marker-end="url(#h)"/><path d="M465,369 h17" stroke="#64748b" marker-end="url(#h)"/><path d="M680,369 h17" stroke="#64748b" marker-end="url(#h)"/>
    </g>

    <!-- breaks -->
    <text x="60" y="434" font-weight="700" fill="#0f172a" font-size="13">四类谱系断点</text>
    <g font-size="11">
      <rect x="60" y="448" width="205" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
      <text x="162" y="470" text-anchor="middle" fill="#334155" font-weight="600">thread 删除</text>
      <text x="162" y="487" text-anchor="middle" fill="#475569" font-size="10">清目录；incarnation 占位</text>
      <text x="162" y="500" text-anchor="middle" fill="#475569" font-size="10">不消费（复活窗口）</text>
      <rect x="285" y="448" width="205" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
      <text x="387" y="470" text-anchor="middle" fill="#334155" font-weight="600">delta 线性化</text>
      <text x="387" y="487" text-anchor="middle" fill="#475569" font-size="10">不 fork，覆写 head</text>
      <text x="387" y="500" text-anchor="middle" fill="#475569" font-size="10">弃 turn 留在 ancestry</text>
      <rect x="510" y="448" width="205" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
      <text x="612" y="470" text-anchor="middle" fill="#334155" font-weight="600">thread 分支</text>
      <text x="612" y="487" text-anchor="middle" fill="#475569" font-size="10">branch-seed 合成 run</text>
      <text x="612" y="500" text-anchor="middle" fill="#475569" font-size="10">run_id=turn 身份非溯源</text>
      <rect x="735" y="448" width="185" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
      <text x="827" y="470" text-anchor="middle" fill="#334155" font-weight="600">子代理即弃</text>
      <text x="827" y="487" text-anchor="middle" fill="#475569" font-size="10">checkpointer=False</text>
      <text x="827" y="500" text-anchor="middle" fill="#475569" font-size="10">证据进 run_events</text>
    </g>
    <text x="60" y="545" fill="#94a3b8" font-size="10">_digest/orchestration-ladder/figures/lineage-layers.svg · 证据链见 06 号笔记（父侧亲写，全锚点本会话核验）</text>
  </g>
</svg>
