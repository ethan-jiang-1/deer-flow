<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1040" height="780" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">依赖管理的真实形态 — 策略否决 + 共享沙箱</text>
  <text x="24" y="56" font-size="12" fill="#64748b">对应 05-delegation-mechanics.md §1/§4 · 两个最反直觉的修正：依赖不进数据结构；隔离单位是 thread 不是 worker</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
  </defs>

  <!-- ═══ TOP: routing decision tree ═══ -->
  <rect x="24" y="72" width="992" height="318" rx="8" fill="#fafaf9" stroke="#d6d3d1"/>
  <text x="40" y="98" font-size="14" font-weight="700" fill="#0f172a">上半 · benefit-based 路由决策树（lead prompt / task 工具描述 / 角色描述三处对齐，回归测试钉死）</text>

  <!-- root -->
  <rect x="64" y="130" width="180" height="56" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="154" y="154" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">复杂目标到达</text>
  <text x="154" y="172" font-size="11" fill="#4338ca" text-anchor="middle">lead agent 决策</text>

  <!-- default direct -->
  <path d="M 244 158 L 304 158" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="308" y="130" width="150" height="56" rx="6" fill="#f0fdf4" stroke="#059669"/>
  <text x="383" y="154" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">默认：直接执行</text>
  <text x="383" y="172" font-size="11" fill="#059669" text-anchor="middle">不委派（最常见路径）</text>

  <!-- benefit test -->
  <path d="M 154 186 L 154 216" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="44" y="220" width="220" height="76" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="154" y="242" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">收益测试</text>
  <text x="154" y="260" font-size="10.5" fill="#a16207" text-anchor="middle">并行延迟 / 专家能力 / 上下文隔离</text>
  <text x="154" y="274" font-size="10.5" fill="#a16207" text-anchor="middle">＞ 启动 / 重复发现 / 综合 / 状态冲突 / 副作用？</text>
  <text x="154" y="290" font-size="10.5" fill="#a16207" text-anchor="middle">后续每个 batch 重新评估</text>

  <!-- no -> direct -->
  <path d="M 264 258 L 383 258 L 383 186" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="300" y="252" font-size="10.5" fill="#64748b">否</text>

  <!-- yes -> dependency check -->
  <path d="M 154 296 L 154 326" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="164" y="316" font-size="10.5" fill="#64748b">是</text>
  <rect x="44" y="330" width="220" height="52" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="154" y="352" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">依赖检查</text>
  <text x="154" y="370" font-size="10.5" fill="#a16207" text-anchor="middle">任务间输出依赖？可变状态重叠？</text>

  <!-- hard veto -->
  <path d="M 264 356 L 374 356" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arv)"/>
  <defs><marker id="arv" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker></defs>
  <text x="286" y="350" font-size="10.5" fill="#dc2626" font-weight="700">是</text>
  <rect x="378" y="326" width="270" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="513" y="348" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">硬否决：禁止并行派发</text>
  <text x="513" y="366" font-size="11" fill="#7f1d1d" text-anchor="middle">顺序链并入单个子代理内部串行完成</text>

  <!-- parallel dispatch -->
  <path d="M 264 344 L 304 344 L 304 394 L 680 394 L 680 356 L 664 356" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arg)"/>
  <defs><marker id="arg" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker></defs>
  <text x="300" y="390" font-size="10.5" fill="#059669">否</text>
  <rect x="378" y="252" width="286" height="60" rx="6" fill="#f0fdf4" stroke="#059669"/>
  <text x="521" y="274" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">并行派发（独立、无重叠）</text>
  <text x="521" y="292" font-size="11" fill="#047857" text-anchor="middle">用最少的有用子代理 · 范围必须正交</text>

  <!-- right annotation -->
  <rect x="688" y="130" width="312" height="256" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="704" y="156" font-size="12.5" font-weight="700" fill="#0f172a">这就是 DeerFlow 的「依赖管理」</text>
  <g font-size="11.5" fill="#334155">
    <text x="704" y="180">不建数据结构 — 派发前用策略否决掉所有</text>
    <text x="704" y="196">需要依赖边的场景（依赖 → 串行或否决）</text>
    <text x="704" y="222" fill="#b45309">能力边界：</text>
    <text x="704" y="240">政策靠模型自觉遵守，没有机器校验；</text>
    <text x="704" y="256">模型忽略政策并行派发了有依赖的任务，</text>
    <text x="704" y="272">系统层面没有任何东西能拦住</text>
    <text x="704" y="298">没有静态校验器能拦住环状依赖 —</text>
    <text x="704" y="314">因为根本没有边</text>
    <text x="704" y="344" fill="#64748b">（09 的 task_dag 通道 + Kahn 校验</text>
    <text x="704" y="360" fill="#64748b">正是把这条政策变成机器规则）</text>
  </g>

  <!-- ═══ BOTTOM: shared sandbox ═══ -->
  <rect x="24" y="404" width="992" height="316" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="40" y="430" font-size="14" font-weight="700" fill="#0f172a">下半 · 共享线程沙箱（隔离单位 = thread，不是 worker）</text>

  <!-- big sandbox box -->
  <rect x="48" y="448" width="560" height="190" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="328" y="472" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="middle">thread 沙箱（每对话一个：文件系统 + Bash + 网络）</text>

  <!-- lead -->
  <rect x="72" y="488" width="140" height="60" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="142" y="510" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">Lead Agent</text>
  <text x="142" y="528" font-size="10.5" fill="#4338ca" text-anchor="middle">沙箱拥有者</text>

  <!-- subagents -->
  <g>
    <rect x="236" y="488" width="112" height="60" rx="6" fill="#f0fdf4" stroke="#059669"/>
    <text x="292" y="510" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Subagent A</text>
    <text x="292" y="528" font-size="10" fill="#047857" text-anchor="middle">lease_owner_id</text>
    <rect x="360" y="488" width="112" height="60" rx="6" fill="#f0fdf4" stroke="#059669"/>
    <text x="416" y="510" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Subagent B</text>
    <text x="416" y="528" font-size="10" fill="#047857" text-anchor="middle">lease_owner_id</text>
    <rect x="484" y="488" width="112" height="60" rx="6" fill="#f0fdf4" stroke="#059669"/>
    <text x="540" y="510" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Subagent C</text>
    <text x="540" y="528" font-size="10" fill="#047857" text-anchor="middle">lease_owner_id</text>
  </g>
  <!-- shared fs band -->
  <rect x="72" y="560" width="524" height="60" rx="6" fill="#f0f9ff" stroke="#38bdf8" stroke-dasharray="5 3"/>
  <text x="334" y="582" font-size="11.5" font-weight="700" fill="#0c4a6e" text-anchor="middle">共享文件系统（写冲突防线 = 上半的策略否决）</text>
  <text x="334" y="600" font-size="10.5" fill="#0369a1" text-anchor="middle">AIO：每子代理独立持久 shell session（命令隔离，文件仍共享）</text>
  <text x="72" y="634" font-size="11.5" fill="#0c4a6e">#5128 生命周期：一个子代理结束不能关闭沙箱（兄弟还在跑）→ 最终持有者执行释放</text>

  <!-- misconception box -->
  <rect x="640" y="448" width="360" height="190" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="820" y="476" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">✗ 常见误读（研究层已按此校准）</text>
  <g font-size="11.5" fill="#7f1d1d">
    <text x="820" y="502" text-anchor="middle">「每 worker 一个容器 / 物理文件隔离」</text>
    <text x="656" y="530">真实形态：</text>
    <text x="656" y="550">▪ 物理隔离做在 thread 级（每对话一个沙箱）</text>
    <text x="656" y="570">▪ worker 级写冲突交给路由策略硬否决（上半）</text>
    <text x="656" y="590">▪ 沙箱矩阵（七实现）服务执行环境多样性，</text>
    <text x="656" y="610">  不是多 worker 隔离</text>
    <text x="656" y="632" fill="#dc2626">→ 注入设计的唯一新物理需求：per-node worktree</text>
  </g>

  <text x="24" y="748" font-size="12" fill="#64748b">组合判读:DeerFlow 用「策略否决 + thread 级物理隔离」这对组合替代了「DAG 依赖边 + worker 级隔离」— 换来极简,付出机器校验的缺失。</text>
</svg>
