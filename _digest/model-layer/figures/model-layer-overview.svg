<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="headerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="factoryBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#c5cae9"/>
    </linearGradient>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arrowDown" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <polygon points="0 0, 6 0, 3 8" fill="#555"/>
    </marker>
  </defs>

  <rect width="1100" height="750" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <rect x="0" y="0" width="1100" height="44" fill="url(#headerBg)" rx="8"/>
  <rect x="0" y="28" width="1100" height="16" fill="url(#headerBg)"/>
  <text x="550" y="28" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Model Layer: create_chat_model() 工厂 + 8 个 Provider 适配器 + Thinking/Vision/Streaming</text>

  <!-- ===== LEFT: config.yaml ===== -->
  <rect x="30" y="58" width="240" height="250" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <rect x="30" y="58" width="240" height="26" rx="6" fill="#ff9800"/>
  <rect x="30" y="70" width="240" height="14" fill="#ff9800"/>
  <text x="150" y="76" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">config.yaml — models[]</text>

  <text x="48" y="106" font-size="10" fill="#555" font-family="monospace">name: claude-sonnet-4-6</text>
  <text x="48" y="122" font-size="10" fill="#555" font-family="monospace">use: langchain_anthropic:</text>
  <text x="56" y="136" font-size="10" fill="#555" font-family="monospace">ChatAnthropic</text>
  <text x="48" y="154" font-size="10" fill="#555" font-family="monospace">model: claude-sonnet-4-6</text>
  <text x="48" y="178" font-size="10" fill="#888" font-family="monospace">supports_thinking: true</text>
  <text x="48" y="194" font-size="10" fill="#888" font-family="monospace">supports_vision: true</text>
  <text x="48" y="218" font-size="10" fill="#888" font-family="monospace">when_thinking_enabled:</text>
  <text x="56" y="234" font-size="10" fill="#888" font-family="monospace">thinking:</text>
  <text x="64" y="250" font-size="10" fill="#888" font-family="monospace">type: enabled</text>
  <text x="64" y="266" font-size="10" fill="#888" font-family="monospace">budget_tokens: 12000</text>
  <text x="48" y="290" font-size="10" fill="#888" font-family="monospace">api_key: $ANTHROPIC_API_KEY</text>

  <!-- Arrow config → factory -->
  <line x1="270" y1="180" x2="330" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- ===== CENTER: Factory Pipeline ===== -->
  <rect x="340" y="58" width="420" height="250" rx="6" fill="url(#factoryBg)" stroke="#3f51b5" stroke-width="1.5"/>
  <rect x="340" y="58" width="420" height="26" rx="6" fill="#3f51b5"/>
  <rect x="340" y="70" width="420" height="14" fill="#3f51b5"/>
  <text x="550" y="76" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">create_chat_model(name, thinking_enabled) — 9 步解析</text>

  <!-- Steps -->
  <rect x="355" y="93" width="180" height="22" rx="3" fill="#e8eaf6" stroke="#9fa8da" stroke-width="0.5"/>
  <text x="365" y="108" font-size="9" fill="#333" font-family="monospace">① 查 ModelConfig by name</text>
  <rect x="545" y="93" width="200" height="22" rx="3" fill="#e8eaf6" stroke="#9fa8da" stroke-width="0.5"/>
  <text x="555" y="108" font-size="9" fill="#333" font-family="monospace">② resolve_class(use, BaseChatModel)</text>

  <rect x="355" y="120" width="180" height="22" rx="3" fill="#e8eaf6" stroke="#9fa8da" stroke-width="0.5"/>
  <text x="365" y="135" font-size="9" fill="#333" font-family="monospace">③ model_dump → provider kwargs</text>
  <rect x="545" y="120" width="200" height="22" rx="3" fill="#e8eaf6" stroke="#9fa8da" stroke-width="0.5"/>
  <text x="555" y="135" font-size="9" fill="#333" font-family="monospace">④ merge thinking 快捷方式</text>

  <rect x="355" y="147" width="180" height="22" rx="3" fill="#fff9c4" stroke="#fdd835" stroke-width="0.5"/>
  <text x="365" y="162" font-size="9" fill="#333" font-family="monospace">⑤ thinking 模式自动检测</text>
  <rect x="545" y="147" width="200" height="22" rx="3" fill="#fff9c4" stroke="#fdd835" stroke-width="0.5"/>
  <text x="555" y="162" font-size="9" fill="#333" font-family="monospace">Anthropic / OpenAI-gw / vLLM</text>

  <rect x="355" y="174" width="180" height="22" rx="3" fill="#e8eaf6" stroke="#9fa8da" stroke-width="0.5"/>
  <text x="365" y="189" font-size="9" fill="#333" font-family="monospace">⑥ inject enable/disable params</text>
  <rect x="545" y="174" width="200" height="22" rx="3" fill="#e8eaf6" stroke="#9fa8da" stroke-width="0.5"/>
  <text x="555" y="189" font-size="9" fill="#333" font-family="monospace">⑦ auto stream_usage (OpenAI gw)</text>

  <rect x="355" y="201" width="180" height="22" rx="3" fill="#e8eaf6" stroke="#9fa8da" stroke-width="0.5"/>
  <text x="365" y="216" font-size="9" fill="#333" font-family="monospace">⑧ per-provider 调整</text>
  <rect x="545" y="201" width="200" height="22" rx="3" fill="#e8eaf6" stroke="#9fa8da" stroke-width="0.5"/>
  <text x="555" y="216" font-size="9" fill="#333" font-family="monospace">Codex/max_tokens, MindIE/retry</text>

  <rect x="355" y="230" width="390" height="22" rx="3" fill="#c8e6c9" stroke="#66bb6a" stroke-width="0.5"/>
  <text x="550" y="245" text-anchor="middle" font-size="9" fill="#2e7d32" font-family="monospace">⑨ model_class(**kwargs, **model_settings) → BaseChatModel 实例</text>

  <rect x="355" y="262" width="390" height="22" rx="3" fill="#f3e5f5" stroke="#ab47bc" stroke-width="0.5"/>
  <text x="550" y="277" text-anchor="middle" font-size="9" fill="#6a1b9a" font-family="monospace">attach_tracing? → build_tracing_callbacks() → model.callbacks</text>

  <!-- ===== RIGHT: Output ===== -->
  <rect x="800" y="58" width="270" height="250" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <rect x="800" y="58" width="270" height="26" rx="6" fill="#4caf50"/>
  <rect x="800" y="70" width="270" height="14" fill="#4caf50"/>
  <text x="935" y="76" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">BaseChatModel 实例</text>

  <text x="818" y="108" font-size="10" fill="#333">两处消费：</text>
  <rect x="818" y="118" width="238" height="40" rx="4" fill="#fff" stroke="#a5d6a7" stroke-width="0.5"/>
  <text x="937" y="134" text-anchor="middle" font-size="9.5" fill="#333">Graph 内：attach_tracing=False</text>
  <text x="937" y="150" text-anchor="middle" font-size="9" fill="#888">tracing 由 graph root 统一管理</text>

  <rect x="818" y="166" width="238" height="40" rx="4" fill="#fff" stroke="#a5d6a7" stroke-width="0.5"/>
  <text x="937" y="182" text-anchor="middle" font-size="9.5" fill="#333">Graph 外：attach_tracing=True</text>
  <text x="937" y="198" text-anchor="middle" font-size="9" fill="#888">MemoryUpdater, Title model 独立调用</text>

  <rect x="818" y="218" width="238" height="40" rx="4" fill="#fff" stroke="#a5d6a7" stroke-width="0.5"/>
  <text x="937" y="234" text-anchor="middle" font-size="9.5" fill="#333">凭证自动发现</text>
  <text x="937" y="250" text-anchor="middle" font-size="9" fill="#888">OAuth, API key, env var, credential file</text>

  <!-- Arrow factory → output -->
  <line x1="760" y1="180" x2="800" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- ===== BOTTOM: Provider Adapters ===== -->
  <rect x="30" y="330" width="1040" height="195" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="30" y="330" width="280" height="28" rx="8" fill="#546e7a"/>
  <rect x="30" y="344" width="280" height="14" fill="#546e7a"/>
  <text x="170" y="349" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Provider 适配器（8 个）</text>
  <text x="330" y="349" font-size="9.5" fill="#444">每个 patch 类解决一类跨 provider 的不兼容问题</text>

  <!-- Row 1 -->
  <rect x="50" y="370" width="235" height="70" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="167" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">ClaudeChatModel</text>
  <text x="167" y="406" text-anchor="middle" font-size="8.5" fill="#555">基类 ChatAnthropic</text>
  <text x="167" y="420" text-anchor="middle" font-size="8.5" fill="#555">OAuth Bearer · prompt caching</text>
  <text x="167" y="434" text-anchor="middle" font-size="8.5" fill="#555">auto think budget 80% · retry</text>

  <rect x="300" y="370" width="235" height="70" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="417" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">CodexChatModel</text>
  <text x="417" y="406" text-anchor="middle" font-size="8.5" fill="#555">基类 BaseChatModel (从零实现)</text>
  <text x="417" y="420" text-anchor="middle" font-size="8.5" fill="#555">Responses API · SSE streaming</text>
  <text x="417" y="434" text-anchor="middle" font-size="8.5" fill="#555">Codex CLI OAuth · retry</text>

  <rect x="550" y="370" width="235" height="70" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="667" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">PatchedChatOpenAI</text>
  <text x="667" y="406" text-anchor="middle" font-size="8.5" fill="#555">基类 ChatOpenAI</text>
  <text x="667" y="420" text-anchor="middle" font-size="8.5" fill="#555">Gemini thought_signature 保持</text>
  <text x="667" y="434" text-anchor="middle" font-size="8.5" fill="#555">不回传 → HTTP 400</text>

  <rect x="800" y="370" width="250" height="70" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="925" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">PatchedChatDeepSeek</text>
  <text x="925" y="406" text-anchor="middle" font-size="8.5" fill="#555">基类 ChatDeepSeek</text>
  <text x="925" y="420" text-anchor="middle" font-size="8.5" fill="#555">reasoning_content 多 turn 保持</text>
  <text x="925" y="434" text-anchor="middle" font-size="8.5" fill="#555">不回传 → API 报错</text>

  <!-- Row 2 -->
  <rect x="50" y="448" width="235" height="68" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="167" y="468" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">PatchedChatMiniMax</text>
  <text x="167" y="484" text-anchor="middle" font-size="8.5" fill="#555">基类 ChatOpenAI</text>
  <text x="167" y="498" text-anchor="middle" font-size="8.5" fill="#555">reasoning_split · &lt;think&gt; 解析</text>
  <text x="167" y="512" text-anchor="middle" font-size="8.5" fill="#555">reasoning_details 提取</text>

  <rect x="300" y="448" width="235" height="68" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="417" y="468" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">VllmChatModel</text>
  <text x="417" y="484" text-anchor="middle" font-size="8.5" fill="#555">基类 ChatOpenAI</text>
  <text x="417" y="498" text-anchor="middle" font-size="8.5" fill="#555">reasoning 字段保持</text>
  <text x="417" y="512" text-anchor="middle" font-size="8.5" fill="#555">enable_thinking 归一化</text>

  <rect x="550" y="448" width="235" height="68" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="667" y="468" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">MindIEChatModel</text>
  <text x="667" y="484" text-anchor="middle" font-size="8.5" fill="#555">基类 ChatOpenAI</text>
  <text x="667" y="498" text-anchor="middle" font-size="8.5" fill="#555">XML tool-call 解析</text>
  <text x="667" y="512" text-anchor="middle" font-size="8.5" fill="#555">tool 时降级非流式 · 模拟 yield</text>

  <rect x="800" y="448" width="250" height="68" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="925" y="468" text-anchor="middle" font-size="10" font-weight="700" fill="#888">LangChain 原生</text>
  <text x="925" y="484" text-anchor="middle" font-size="8.5" fill="#555">ChatAnthropic / ChatOpenAI</text>
  <text x="925" y="498" text-anchor="middle" font-size="8.5" fill="#555">ChatDeepSeek / ChatOllama</text>
  <text x="925" y="512" text-anchor="middle" font-size="8.5" fill="#555">无需 patch，标准路径</text>

  <!-- ===== BOTTOM 2: Thinking/Vision/Streaming ===== -->
  <rect x="30" y="545" width="1040" height="95" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1"/>
  <rect x="30" y="545" width="280" height="28" rx="8" fill="#1e88e5"/>
  <rect x="30" y="559" width="280" height="14" fill="#1e88e5"/>
  <text x="170" y="564" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Thinking / Vision / Streaming</text>
  <text x="330" y="564" font-size="9.5" fill="#0d47a1">三种能力的启用和归一化链路</text>

  <rect x="50" y="582" width="310" height="50" rx="5" fill="#fff" stroke="#bbdefb" stroke-width="0.5"/>
  <text x="205" y="600" text-anchor="middle" font-size="10" font-weight="700" fill="#0d47a1">Thinking Mode</text>
  <text x="205" y="616" text-anchor="middle" font-size="8.5" fill="#555">3 种配置模式自动检测 → enable/disable 参数注入</text>
  <text x="205" y="630" text-anchor="middle" font-size="8.5" fill="#555">thinking 快捷方式 · reasoning_effort 分级</text>

  <rect x="380" y="582" width="310" height="50" rx="5" fill="#fff" stroke="#bbdefb" stroke-width="0.5"/>
  <text x="535" y="600" text-anchor="middle" font-size="10" font-weight="700" fill="#0d47a1">Vision</text>
  <text x="535" y="616" text-anchor="middle" font-size="8.5" fill="#555">supports_vision → ViewImageMiddleware + view_image tool</text>
  <text x="535" y="630" text-anchor="middle" font-size="8.5" fill="#555">before_model 注入 base64 data URI</text>

  <rect x="710" y="582" width="340" height="50" rx="5" fill="#fff" stroke="#bbdefb" stroke-width="0.5"/>
  <text x="880" y="600" text-anchor="middle" font-size="10" font-weight="700" fill="#0d47a1">Streaming</text>
  <text x="880" y="616" text-anchor="middle" font-size="8.5" fill="#555">传输层: StreamBridge pub/sub · SSE · heartbeat · 重连</text>
  <text x="880" y="630" text-anchor="middle" font-size="8.5" fill="#555">模型层: per-provider chunk → AIMessageChunk 归一化</text>

  <!-- ===== Bottom bar ===== -->
  <rect x="30" y="660" width="1040" height="72" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="550" y="684" text-anchor="middle" font-size="11" font-weight="700" fill="#333">核心设计决策</text>

  <rect x="50" y="696" width="310" height="28" rx="4" fill="#e8eaf6"/>
  <text x="205" y="714" text-anchor="middle" font-size="9.5" fill="#283593">config.yaml 是唯一真理源：换模型 = 改一行 use path</text>

  <rect x="380" y="696" width="310" height="28" rx="4" fill="#e8eaf6"/>
  <text x="535" y="714" text-anchor="middle" font-size="9.5" fill="#283593">thinking 模式自动检测：代码检测 config shape，不需显式声明</text>

  <rect x="710" y="696" width="340" height="28" rx="4" fill="#e8eaf6"/>
  <text x="880" y="714" text-anchor="middle" font-size="9.5" fill="#283593">extra="allow"：透传任意 provider 参数，不预先穷举</text>

</svg>
