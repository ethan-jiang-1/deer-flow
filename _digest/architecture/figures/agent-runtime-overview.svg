<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="runtimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="sandboxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="memoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- bg -->
  <rect width="1200" height="820" rx="12" fill="url(#bg)"/>

  <!-- === TITLE === -->
  <text x="600" y="38" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="bold">Agent Runtime 核心与外围 — 全景架构</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b" font-size="12">Agent Runtime 是引擎，外围是各种接入渠道和基础设施</text>

  <!-- ====== PERIPHERY (top & sides) ====== -->

  <!-- Browser / Frontend (top-left) -->
  <rect x="30" y="80" width="250" height="90" rx="10" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="155" y="108" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">🖥  Frontend (Next.js :3000)</text>
  <text x="155" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">React 19 / TypeScript / Tailwind</text>
  <text x="155" y="148" text-anchor="middle" fill="#94a3b8" font-size="11">@langchain/langgraph-sdk SSE 流式</text>

  <!-- HTTP Clients (top-center-left) -->
  <rect x="310" y="80" width="190" height="90" rx="10" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="405" y="108" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">🌐 HTTP Clients</text>
  <text x="405" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">REST JSON + SSE</text>
  <text x="405" y="148" text-anchor="middle" fill="#94a3b8" font-size="11">任何语言</text>

  <!-- Python SDK (top-right) -->
  <rect x="820" y="80" width="250" height="90" rx="10" fill="#04332b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="108" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">🐍 Python SDK (嵌入式)</text>
  <text x="945" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">DeerFlowClient.chat() / .stream()</text>
  <text x="945" y="148" text-anchor="middle" fill="#94a3b8" font-size="11">同进程内存调用，无需 HTTP</text>

  <!-- IM Channels (top-center-right) -->
  <rect x="530" y="80" width="260" height="90" rx="10" fill="#3b0a2e" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="108" text-anchor="middle" fill="#f472b6" font-size="14" font-weight="bold">💬 IM Channels</text>
  <text x="660" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">飞书 · Slack · Telegram · WeChat</text>
  <text x="660" y="148" text-anchor="middle" fill="#94a3b8" font-size="11">DingTalk · Discord · WeCom</text>

  <!-- ====== GATEWAY (middle) ====== -->
  <rect x="310" y="210" width="480" height="55" rx="10" fill="url(#gatewayGrad)" filter="url(#shadow)"/>
  <text x="550" y="233" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">Gateway API (FastAPI :8001)</text>
  <text x="550" y="252" text-anchor="middle" fill="#dbeafe" font-size="11">15 Routers · Auth (JWT/OAuth) · CSRF · Internal Auth · CORS</text>

  <!-- Nginx (left of gateway) -->
  <rect x="120" y="220" width="158" height="45" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="199" y="248" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="bold">Nginx :2026</text>

  <!-- ====== arrows: periphery → gateway ====== -->
  <line x1="155" y1="170" x2="155" y2="200" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="155" y1="200" x2="310" y2="237" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="405" y1="170" x2="405" y2="210" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="660" y1="170" x2="660" y2="200" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="200" x2="550" y2="210" stroke="#ec4899" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="278" y1="242" x2="310" y2="242" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SDK direct path -->
  <line x1="945" y1="170" x2="945" y2="200" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <!-- annotation -->
  <text x="960" y="280" fill="#10b981" font-size="10" font-style="italic">SDK 直连 Runtime，绕开 HTTP</text>
  <line x1="950" y1="275" x2="945" y2="200" stroke="#10b981" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- ====== AGENT RUNTIME (bottom-center, big) ====== -->
  <rect x="100" y="310" width="1000" height="490" rx="14" fill="#1a1f2e" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- title strip -->
  <rect x="100" y="310" width="1000" height="42" rx="14" fill="url(#runtimeGrad)"/>
  <rect x="100" y="340" width="1000" height="12" fill="url(#runtimeGrad)"/>
  <text x="600" y="338" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="bold">Agent Runtime (deerflow.harness) — 核心引擎</text>

  <!-- Inside the runtime: 6 core modules arranged in 2 rows x 3 cols -->
  <!-- Row 1 -->

  <!-- lead agent -->
  <rect x="130" y="370" width="290" height="120" rx="8" fill="#2a1a00" stroke="#f59e0b" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="275" y="395" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">🧠 Lead Agent</text>
  <text x="275" y="415" text-anchor="middle" fill="#94a3b8" font-size="11">make_lead_agent() → create_agent()</text>
  <text x="275" y="435" text-anchor="middle" fill="#94a3b8" font-size="11">ThreadState (sandbox, artifacts, todos...)</text>
  <text x="275" y="455" text-anchor="middle" fill="#94a3b8" font-size="11">System Prompt (skills, memory, date)</text>
  <text x="275" y="475" text-anchor="middle" fill="#94a3b8" font-size="11">Model Factory (8+ providers)</text>

  <!-- middleware -->
  <rect x="455" y="370" width="290" height="120" rx="8" fill="#1a1a2e" stroke="#6366f1" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="600" y="395" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="bold">⚙ Middleware Chain (x20)</text>
  <text x="600" y="415" text-anchor="middle" fill="#94a3b8" font-size="11">运行时 (8) | before_model (6)</text>
  <text x="600" y="435" text-anchor="middle" fill="#94a3b8" font-size="11">after_model (4) | after_step (2)</text>
  <text x="600" y="455" text-anchor="middle" fill="#94a3b8" font-size="11">Sandbox · Guardrail · Summarization</text>
  <text x="600" y="475" text-anchor="middle" fill="#94a3b8" font-size="11">Memory · Title · Loop Detection · ...</text>

  <!-- sandbox -->
  <rect x="780" y="370" width="290" height="120" rx="8" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="925" y="395" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="bold">📦 Sandbox</text>
  <text x="925" y="415" text-anchor="middle" fill="#94a3b8" font-size="11">Local (文件系统) / AIO (Docker)</text>
  <text x="925" y="435" text-anchor="middle" fill="#94a3b8" font-size="11">虚拟路径: /mnt/user-data/...</text>
  <text x="925" y="455" text-anchor="middle" fill="#94a3b8" font-size="11">Tools: bash, ls, read_file, write_file</text>
  <text x="925" y="475" text-anchor="middle" fill="#94a3b8" font-size="11">str_replace, glob, grep</text>

  <!-- Row 2 -->

  <!-- subagents -->
  <rect x="130" y="515" width="290" height="120" rx="8" fill="#002a1a" stroke="#10b981" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="275" y="540" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">🤖 Subagents</text>
  <text x="275" y="560" text-anchor="middle" fill="#94a3b8" font-size="11">max 3 concurrent, 15min timeout</text>
  <text x="275" y="580" text-anchor="middle" fill="#94a3b8" font-size="11">builtins: general-purpose · bash</text>
  <text x="275" y="600" text-anchor="middle" fill="#94a3b8" font-size="11">双线程池: scheduler(3) + executor(3)</text>
  <text x="275" y="620" text-anchor="middle" fill="#94a3b8" font-size="11">custom agents via config.yaml</text>

  <!-- tools + MCP + ACP -->
  <rect x="455" y="515" width="290" height="120" rx="8" fill="#1a2a1a" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="600" y="540" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">🔧 Tools &amp; Integrations</text>
  <text x="600" y="560" text-anchor="middle" fill="#94a3b8" font-size="11">get_available_tools() 装配</text>
  <text x="600" y="580" text-anchor="middle" fill="#94a3b8" font-size="11">Config · MCP (stdio/sse/http) · Builtins</text>
  <text x="600" y="600" text-anchor="middle" fill="#94a3b8" font-size="11">Community: Tavily, Jina, Firecrawl, DDG</text>
  <text x="600" y="620" text-anchor="middle" fill="#94a3b8" font-size="11">ACP Agents (Claude Code, Codex CLI)</text>

  <!-- memory + storage -->
  <rect x="780" y="515" width="290" height="120" rx="8" fill="#2a002a" stroke="#ec4899" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="925" y="540" text-anchor="middle" fill="#f472b6" font-size="14" font-weight="bold">💾 Memory &amp; Persistence</text>
  <text x="925" y="560" text-anchor="middle" fill="#94a3b8" font-size="11">Memory: LLM 提取 → debounce → JSON</text>
  <text x="925" y="580" text-anchor="middle" fill="#94a3b8" font-size="11">Per-user 隔离 (memory.json)</text>
  <text x="925" y="600" text-anchor="middle" fill="#94a3b8" font-size="11">DB: memory / sqlite / postgres</text>
  <text x="925" y="620" text-anchor="middle" fill="#94a3b8" font-size="11">Checkpointer · RunEvents · StreamBridge</text>

  <!-- bottom row: skills + models -->
  <rect x="130" y="660" width="290" height="60" rx="8" fill="#1a2a1a" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <text x="275" y="685" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="bold">📋 Skills (19 public)</text>
  <text x="275" y="705" text-anchor="middle" fill="#94a3b8" font-size="11">SKILL.md → LocalStorage → System Prompt</text>

  <rect x="455" y="660" width="290" height="60" rx="8" fill="#1a2a1a" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <text x="600" y="685" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="bold">🔌 MCP + Extensions</text>
  <text x="600" y="705" text-anchor="middle" fill="#94a3b8" font-size="11">extensions_config.json · Tool Search · Interceptors</text>

  <rect x="780" y="660" width="290" height="60" rx="8" fill="#1a2a1a" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <text x="925" y="685" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="bold">🔬 Models + Tracing</text>
  <text x="925" y="705" text-anchor="middle" fill="#94a3b8" font-size="11">8+ Providers · LangSmith · Langfuse · vLLM</text>

  <!-- === connector lines: gateway → lead agent === -->
  <line x1="550" y1="265" x2="550" y2="310" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Label: 所有路径统一入口 -->
  <text x="595" y="295" fill="#f59e0b" font-size="10" font-weight="bold">HTTP/SSE/IM → Gateway → Runtime (统一入口)</text>

  <!-- SDK direct connector -->
  <line x1="845" y1="280" x2="845" y2="310" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="855" y="298" fill="#10b981" font-size="9">SDK 直入</text>

  <!-- === bottom legend === -->
  <rect x="100" y="745" width="1000" height="65" rx="0" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="140" y="770" fill="#64748b" font-size="11">
    <tspan font-weight="bold" fill="#f59e0b">Agent Runtime</tspan> = deerflow.harness (可发布 pip 包)。
    <tspan font-weight="bold" fill="#3b82f6">Gateway</tspan> = app.gateway (FastAPI HTTP 层)。
  </text>
  <text x="140" y="792" fill="#64748b" font-size="11">
    Runtime 不依赖 Gateway — DeerFlowClient 可以跳过 Gateway 直接调用 Runtime。Gateway 通过 REST/SSE 暴露 Runtime 能力。
  </text>
</svg>
