<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#64748b"/>
    </marker>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="1050" rx="12" fill="url(#bg)"/>

  <text x="600" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">Agent Loop 内核：LangGraph 状态机 × 6 Hook 点 × 19 Middleware</text>

  <!-- ===== LEFT COLUMN: State Machine ===== -->
  <text x="50" y="72" fill="#f1f5f9" font-size="14" font-weight="bold">状态机</text>

  <!-- START -->
  <rect x="50" y="82" width="90" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="95" y="102" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="bold">START</text>
  <line x1="140" y1="97" x2="170" y2="97" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowRight)"/>

  <!-- before_agent -->
  <rect x="175" y="72" width="190" height="50" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="270" y="92" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">before_agent</text>
  <text x="270" y="108" text-anchor="middle" fill="#94a3b8" font-size="8">正向 0→N · 5 middleware</text>
  <line x1="365" y1="97" x2="395" y2="97" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowRight)"/>

  <!-- before_model -->
  <rect x="400" y="72" width="190" height="50" rx="6" fill="#0a1a0a" stroke="#22c55e" stroke-width="1.2"/>
  <text x="495" y="92" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">before_model</text>
  <text x="495" y="108" text-anchor="middle" fill="#94a3b8" font-size="8">正向 0→N · 3 middleware</text>
  <line x1="590" y1="97" x2="620" y2="97" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowRight)"/>

  <!-- wrap_model_call -->
  <rect x="625" y="72" width="190" height="50" rx="6" fill="#2a1a00" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="720" y="92" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">wrap_model_call</text>
  <text x="720" y="108" text-anchor="middle" fill="#94a3b8" font-size="8">内联洋葱 · 5 middleware</text>
  <line x1="815" y1="97" x2="840" y2="97" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowRight)"/>

  <!-- LLM -->
  <rect x="845" y="74" width="110" height="46" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="900" y="94" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">LLM Call</text>
  <text x="900" y="110" text-anchor="middle" fill="#94a3b8" font-size="8">model.invoke()</text>

  <line x1="900" y1="120" x2="900" y2="148" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowDown)"/>

  <!-- after_model -->
  <rect x="720" y="152" width="190" height="50" rx="6" fill="#2a0000" stroke="#ef4444" stroke-width="1.2"/>
  <text x="815" y="172" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">after_model</text>
  <text x="815" y="188" text-anchor="middle" fill="#94a3b8" font-size="8">反向 N→0 · 6 middleware</text>

  <line x1="815" y1="202" x2="815" y2="228" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowDown)"/>

  <!-- Decision diamond -->
  <polygon points="815,232 860,255 815,278 770,255" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="815" y="258" text-anchor="middle" fill="#94a3b8" font-size="8" font-weight="bold">tool_calls?</text>

  <!-- YES → wrap_tool_call -->
  <line x1="860" y1="255" x2="900" y2="255" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrowRight)"/>
  <text x="878" y="249" fill="#22c55e" font-size="8">yes</text>

  <rect x="905" y="238" width="190" height="34" rx="6" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="1000" y="254" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">wrap_tool_call</text>
  <text x="1000" y="267" text-anchor="middle" fill="#94a3b8" font-size="8">内联洋葱 · 5 mw · 可短路</text>

  <!-- Tool Execute -->
  <line x1="1000" y1="272" x2="1000" y2="295" stroke="#64748b" stroke-width="1" marker-end="url(#arrowDown)"/>
  <rect x="935" y="299" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="1000" y="318" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="bold">Tool Execute</text>

  <!-- Loop back arrow -->
  <line x1="935" y1="313" x2="50" y2="313" stroke="#22c55e" stroke-width="0.8" stroke-dasharray="5,3"/>
  <line x1="50" y1="313" x2="50" y2="97" stroke="#22c55e" stroke-width="0.8" stroke-dasharray="5,3" marker-end="url(#arrowRight)"/>
  <text x="480" y="308" text-anchor="middle" fill="#4ade80" font-size="8">loop back → before_model（同一 sandbox 实例复用）</text>

  <!-- NO → after_agent -->
  <line x1="770" y1="255" x2="740" y2="255" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arrowRight)"/>
  <text x="748" y="249" fill="#ef4444" font-size="8">no</text>
  <line x1="740" y1="255" x2="740" y2="350" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arrowDown)"/>

  <!-- after_agent -->
  <rect x="610" y="354" width="190" height="50" rx="6" fill="#1a0020" stroke="#ec4899" stroke-width="1.2"/>
  <text x="705" y="374" text-anchor="middle" fill="#f9a8d4" font-size="10" font-weight="bold">after_agent</text>
  <text x="705" y="390" text-anchor="middle" fill="#94a3b8" font-size="8">反向 N→0 · 3 middleware</text>

  <line x1="705" y1="404" x2="705" y2="430" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowDown)"/>

  <!-- END -->
  <rect x="660" y="434" width="90" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="705" y="453" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="bold">END</text>

  <!-- ===== RIGHT: Key insights ===== -->
  <text x="50" y="370" fill="#f1f5f9" font-size="14" font-weight="bold">三件事让 DeerFlow 的 Agent Loop 与众不同</text>

  <!-- Insight 1 -->
  <rect x="50" y="382" width="530" height="115" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <rect x="50" y="382" width="530" height="28" rx="8" fill="#b45309"/>
  <rect x="50" y="396" width="530" height="14" fill="#b45309"/>
  <text x="315" y="401" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1. 内联洋葱 ≠ Graph Node — 两种执行模型各有分工</text>

  <text x="65" y="426" fill="#fbbf24" font-size="9.5" font-weight="600">wrap_model_call / wrap_tool_call 是嵌套 callable，不是 Graph Node</text>
  <text x="65" y="444" fill="#94a3b8" font-size="9">Graph Node (before_*/after_*) 只能往 state 写 dict，看不到后续输出。内联洋葱 (wrap_*) 能：</text>
  <text x="75" y="460" fill="#94a3b8" font-size="9">• 看到内层的返回值 — 比如 LLMErrorHandling 捕获 model 异常后重试</text>
  <text x="75" y="475" fill="#94a3b8" font-size="9">• 短路不调 handler() — Guardrail/Audit 拒绝 tool 后直接返回 error ToolMessage</text>
  <text x="75" y="490" fill="#94a3b8" font-size="9">• 修改 request 后传入 — request.override() → handler(modified)</text>

  <!-- Insight 2 -->
  <rect x="50" y="506" width="530" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <rect x="50" y="506" width="530" height="28" rx="8" fill="#1d4ed8"/>
  <rect x="50" y="520" width="530" height="14" fill="#1d4ed8"/>
  <text x="315" y="525" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2. 正向 Setup · 反向 Teardown — 栈语义保证资源对称</text>

  <text x="65" y="550" fill="#60a5fa" font-size="9.5" font-weight="600">before_* 0→N (正向) / after_* N→0 (反向)</text>
  <text x="65" y="568" fill="#94a3b8" font-size="9">SandboxMiddleware = before_agent[2] (acquire) + after_agent[0] (release)</text>
  <text x="65" y="584" fill="#94a3b8" font-size="9">先分配的资源最后释放 — 保证 sandbox 在整个 agent 生命周期中可用</text>
  <text x="65" y="600" fill="#94a3b8" font-size="9">SafetyFinishReason 在 after_model 中最先执行 — 必须第一个看到原始输出</text>

  <!-- Insight 3 -->
  <rect x="50" y="615" width="530" height="115" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <rect x="50" y="615" width="530" height="28" rx="8" fill="#15803d"/>
  <rect x="50" y="629" width="530" height="14" fill="#15803d"/>
  <text x="315" y="634" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">3. 状态缓存跨迭代复用 — Lazy Init 只在首次 tool_call 触发</text>

  <text x="65" y="658" fill="#4ade80" font-size="9.5" font-weight="600">SandboxMiddleware.after_model 是异步 lazy init 的触发点</text>
  <text x="65" y="676" fill="#94a3b8" font-size="9">agent 启动时无 sandbox → 首次 tool call 前 ensure_sandbox_initialized() 触发 acquire</text>
  <text x="65" y="692" fill="#94a3b8" font-size="9">sandbox_id 写入 runtime.state["sandbox"] → 后续所有 tool call 跳过 acquire，直接 get()</text>
  <text x="65" y="708" fill="#94a3b8" font-size="9">同一个 sandbox 实例复用整个 agent run — agent 结束时 SandboxMiddleware.after_agent 才 release</text>
  <text x="65" y="724" fill="#64748b" font-size="8.5">这意味着 agent 每次 step 循环回 before_model 时，sandbox 状态保持不变（文件、进程、环境变量都在）</text>

  <!-- ===== BOTTOM: Tool execution pipeline ===== -->
  <rect x="50" y="745" width="1100" height="130" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="600" y="770" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold">Tool Call 执行流水线 — 5 阶段纵深</text>

  <!-- Pipeline flow -->
  <rect x="70" y="788" width="180" height="50" rx="6" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1"/>
  <text x="160" y="808" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">① Guardrail</text>
  <text x="160" y="825" text-anchor="middle" fill="#94a3b8" font-size="8.5">Tool 授权 · fail_closed</text>

  <line x1="250" y1="813" x2="275" y2="813" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="280" y="788" width="180" height="50" rx="6" fill="#2a0000" stroke="#ef4444" stroke-width="1"/>
  <text x="370" y="808" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">② SandboxAudit</text>
  <text x="370" y="825" text-anchor="middle" fill="#94a3b8" font-size="8.5">Bash regex · block/warn</text>

  <line x1="460" y1="813" x2="485" y2="813" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="490" y="788" width="180" height="50" rx="6" fill="#1a1a00" stroke="#eab308" stroke-width="1"/>
  <text x="580" y="808" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="bold">③ Path Validation</text>
  <text x="580" y="825" text-anchor="middle" fill="#94a3b8" font-size="8.5">6层路径防穿越</text>

  <line x1="670" y1="813" x2="695" y2="813" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="700" y="788" width="200" height="50" rx="6" fill="#0a1a0a" stroke="#22c55e" stroke-width="1"/>
  <text x="800" y="808" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">④ Sandbox Execute</text>
  <text x="800" y="825" text-anchor="middle" fill="#94a3b8" font-size="8.5">lazy acquire · state cache</text>

  <line x1="900" y1="813" x2="925" y2="813" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="930" y="788" width="200" height="50" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1"/>
  <text x="1030" y="808" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">⑤ Output Processing</text>
  <text x="1030" y="825" text-anchor="middle" fill="#94a3b8" font-size="8.5">脱敏 · 截断 · ToolMessage</text>

  <text x="600" y="862" text-anchor="middle" fill="#64748b" font-size="9">每次 tool_call 都经过这 5 个阶段。Guardrail 和 Audit 可以短路（不调 handler），Path Validation 保证即使绕过 Guardrail 也伤不到系统。</text>

  <!-- ===== BOTTOM: Two assembly paths ===== -->
  <rect x="50" y="890" width="540" height="53" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="320" y="912" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="bold">双路径装配</text>
  <text x="320" y="932" text-anchor="middle" fill="#94a3b8" font-size="9">Lead Agent: 19 middleware (全量生产路径, config.yaml 驱动)</text>
  <text x="100" y="948" fill="#94a3b8" font-size="9">SDK: 13 middleware (精简集成路径, RuntimeFeatures dataclass 三元开关: True/False/custom)</text>

  <rect x="610" y="890" width="540" height="53" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="880" y="912" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="bold">@Next / @Prev 定位系统</text>
  <text x="880" y="932" text-anchor="middle" fill="#94a3b8" font-size="9">自定义 middleware 声明锚点，_insert_extra() 算法解析依赖并插入</text>
  <text x="880" y="948" text-anchor="middle" fill="#94a3b8" font-size="9">环形依赖检测 · 同 anchor 冲突检测 · 默认插在 Clarification 之前</text>

  <!-- ===== LEFT SIDEBAR: State ===== -->
  <rect x="50" y="482" width="260" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="180" y="501" text-anchor="middle" fill="#94a3b8" font-size="9.5">ThreadState 通过 reducer 合并各 middleware 的返回值</text>

  <rect x="50" y="518" width="260" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
  <text x="63" y="538" fill="#94a3b8" font-size="8.5">messages — AgentState 继承</text>
  <text x="63" y="555" fill="#94a3b8" font-size="8.5">sandbox — SandboxMiddleware 写入</text>
  <text x="63" y="572" fill="#94a3b8" font-size="8.5">thread_data — ThreadDataMiddleware</text>
  <text x="63" y="589" fill="#94a3b8" font-size="8.5">title — TitleMiddleware 生成</text>
  <text x="63" y="606" fill="#94a3b8" font-size="8.5">artifacts/todos — merge reducer 去重</text>

</svg>