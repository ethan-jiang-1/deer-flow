<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="runtimeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="beforeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="afterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="12" fill="url(#bg)"/>

  <text x="600" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">20 Middlewares 全景 — 触发点 · 顺序 · 职责</text>

  <!-- Legend -->
  <rect x="30" y="52" width="12" height="12" rx="2" fill="#6366f1"/>
  <text x="48" y="63" fill="#a5b4fc" font-size="10">运行时 (8)</text>
  <rect x="130" y="52" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="148" y="63" fill="#60a5fa" font-size="10">before_model (6)</text>
  <rect x="270" y="52" width="12" height="12" rx="2" fill="#8b5cf6"/>
  <text x="288" y="63" fill="#c4b5fd" font-size="10">after_model (4)</text>
  <rect x="400" y="52" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="418" y="63" fill="#34d399" font-size="10">after_tool (2)</text>
  <rect x="520" y="52" width="12" height="12" rx="2" fill="#ef4444"/>
  <text x="538" y="63" fill="#fca5a5" font-size="10">after_step (2)</text>

  <!-- ====== PHASE 1: 运行时 (8) ====== -->
  <rect x="30" y="85" width="260" height="28" rx="6" fill="url(#runtimeGrad)"/>
  <text x="160" y="104" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Phase 1: 运行时 Middleware (8)</text>

  <!-- Row 1: 运行时 -->
  <rect x="30" y="120" width="265" height="62" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="162" y="142" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">1. DynamicContextMiddleware</text>
  <text x="162" y="158" text-anchor="middle" fill="#94a3b8" font-size="9">动态注入系统上下文</text>
  <text x="162" y="173" text-anchor="middle" fill="#64748b" font-size="8">当前时间 · 用户信息 · 会话ID</text>

  <rect x="310" y="120" width="265" height="62" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="442" y="142" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">2. SandboxMiddleware</text>
  <text x="442" y="158" text-anchor="middle" fill="#94a3b8" font-size="9">沙箱环境管理 (run_id 级别)</text>
  <text x="442" y="173" text-anchor="middle" fill="#64748b" font-size="8">ThreadState.sandbox · ctx.setup/teardown</text>

  <rect x="590" y="120" width="265" height="62" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="722" y="142" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">3. DeferredToolsMiddleware</text>
  <text x="722" y="158" text-anchor="middle" fill="#94a3b8" font-size="9">延迟工具执行确认</text>
  <text x="722" y="173" text-anchor="middle" fill="#64748b" font-size="8">tools marked deferred → prompt user</text>

  <rect x="870" y="120" width="300" height="62" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="1020" y="142" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">4. SummarizationMiddleware</text>
  <text x="1020" y="158" text-anchor="middle" fill="#94a3b8" font-size="9">上下文窗口管理 (token 级别)</text>
  <text x="1020" y="173" text-anchor="middle" fill="#64748b" font-size="8">summarization_threshold · summarization_model</text>

  <!-- Row 2: 运行时 -->
  <rect x="30" y="195" width="265" height="62" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="162" y="217" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">5. ToolSelectionMiddleware</text>
  <text x="162" y="233" text-anchor="middle" fill="#94a3b8" font-size="9">工具白名单并发控制</text>
  <text x="162" y="248" text-anchor="middle" fill="#64748b" font-size="8">max_concurrent_tools · 工具顺序</text>

  <rect x="310" y="195" width="265" height="62" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="442" y="217" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">6. ToolInterruptMiddleware</text>
  <text x="442" y="233" text-anchor="middle" fill="#94a3b8" font-size="9">工具执行可中断条件</text>
  <text x="442" y="248" text-anchor="middle" fill="#64748b" font-size="8">timeout · user_cancel · error</text>

  <rect x="590" y="195" width="265" height="62" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="722" y="217" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">7. ToolBusyMiddleware</text>
  <text x="722" y="233" text-anchor="middle" fill="#94a3b8" font-size="9">工具负载感知与等待</text>
  <text x="722" y="248" text-anchor="middle" fill="#64748b" font-size="8">rate_limit · backpressure</text>

  <rect x="870" y="195" width="300" height="62" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="1020" y="217" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">8. SkillEvolutionMiddleware</text>
  <text x="1020" y="233" text-anchor="middle" fill="#94a3b8" font-size="9">工具使用进化学习 (实验性)</text>
  <text x="1020" y="248" text-anchor="middle" fill="#64748b" font-size="8">track tool success/failure patterns</text>

  <!-- Arrow: Phase 1 → Phase 2 -->
  <line x1="600" y1="265" x2="600" y2="295" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== PHASE 2: before_model (6) ====== -->
  <rect x="30" y="305" width="260" height="28" rx="6" fill="url(#beforeGrad)"/>
  <text x="160" y="324" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Phase 2: before_model (6)</text>

  <rect x="30" y="340" width="180" height="70" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="120" y="362" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">9. ViewImage</text>
  <text x="120" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">图片内容提取注入</text>
  <text x="120" y="393" text-anchor="middle" fill="#94a3b8" font-size="9">seen_images 去重</text>
  <text x="120" y="407" text-anchor="middle" fill="#64748b" font-size="8">条件: 消息含图片 URL</text>

  <rect x="225" y="340" width="180" height="70" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="315" y="362" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">10. SkillsPolicy</text>
  <text x="315" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">System Prompt 注入</text>
  <text x="315" y="393" text-anchor="middle" fill="#94a3b8" font-size="9">匹配 skill → 注入 SKILL.md</text>
  <text x="315" y="407" text-anchor="middle" fill="#64748b" font-size="8">条件: 有匹配的 skill</text>

  <rect x="420" y="340" width="180" height="70" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="510" y="362" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">11. MemoryRead</text>
  <text x="510" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">加载 memory.json</text>
  <text x="510" y="393" text-anchor="middle" fill="#94a3b8" font-size="9">注入关键记忆</text>
  <text x="510" y="407" text-anchor="middle" fill="#64748b" font-size="8">条件: memory_enabled</text>

  <rect x="615" y="340" width="180" height="70" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="705" y="362" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">12. ArtifactInject</text>
  <text x="705" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">产物注入（上传文件等）</text>
  <text x="705" y="393" text-anchor="middle" fill="#94a3b8" font-size="9">ThreadState.artifacts</text>
  <text x="705" y="407" text-anchor="middle" fill="#64748b" font-size="8">条件: artifacts 非空</text>

  <rect x="810" y="340" width="180" height="70" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="900" y="362" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">13. PromptCaching</text>
  <text x="900" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">Anthropic prompt caching</text>
  <text x="900" y="393" text-anchor="middle" fill="#94a3b8" font-size="9">标记 cache_control 断点</text>
  <text x="900" y="407" text-anchor="middle" fill="#64748b" font-size="8">仅 Anthropic 模型</text>

  <rect x="1005" y="340" width="170" height="70" rx="6" fill="#0f2744" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="1090" y="362" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">14. DateContext</text>
  <text x="1090" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">当前日期时间</text>
  <text x="1090" y="393" text-anchor="middle" fill="#94a3b8" font-size="9">时区感知</text>
  <text x="1090" y="407" text-anchor="middle" fill="#64748b" font-size="8">总是激活</text>

  <!-- Arrow: Phase 2 → Phase 3 (LLM Call) -->
  <line x1="600" y1="418" x2="600" y2="448" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM Call Box -->
  <rect x="450" y="455" width="300" height="36" rx="8" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="478" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="bold">🤖 LLM Call: model.invoke(messages)</text>

  <line x1="600" y1="491" x2="600" y2="518" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== PHASE 3: after_model (4) ====== -->
  <rect x="30" y="525" width="260" height="28" rx="6" fill="url(#afterGrad)"/>
  <text x="160" y="544" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Phase 3: after_model (4)</text>

  <rect x="30" y="560" width="270" height="70" rx="6" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)"/>
  <text x="165" y="582" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">15. DanglingToolCall</text>
  <text x="165" y="598" text-anchor="middle" fill="#94a3b8" font-size="9">检测孤立的 tool_call</text>
  <text x="165" y="613" text-anchor="middle" fill="#94a3b8" font-size="9">无对应 tool 定义 → 注入报错</text>
  <text x="165" y="627" text-anchor="middle" fill="#64748b" font-size="8">条件: response 含未知 tool_call</text>

  <rect x="315" y="560" width="270" height="70" rx="6" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)"/>
  <text x="450" y="582" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">16. GuardrailMiddleware</text>
  <text x="450" y="598" text-anchor="middle" fill="#94a3b8" font-size="9">安全检查 + 合规过滤</text>
  <text x="450" y="613" text-anchor="middle" fill="#94a3b8" font-size="9">敏感词 · PII · 越狱检测</text>
  <text x="450" y="627" text-anchor="middle" fill="#64748b" font-size="8">条件: guardrails_enabled</text>

  <rect x="600" y="560" width="270" height="70" rx="6" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)"/>
  <text x="735" y="582" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">17. LoopDetection</text>
  <text x="735" y="598" text-anchor="middle" fill="#94a3b8" font-size="9">死循环检测与熔断</text>
  <text x="735" y="613" text-anchor="middle" fill="#94a3b8" font-size="9">loop_threshold · circuit_breaker</text>
  <text x="735" y="627" text-anchor="middle" fill="#64748b" font-size="8">条件: 重复工具调用超阈值</text>

  <rect x="885" y="560" width="290" height="70" rx="6" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)"/>
  <text x="1030" y="582" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">18. ClarificationMiddleware</text>
  <text x="1030" y="598" text-anchor="middle" fill="#94a3b8" font-size="9">模糊意图澄清追问</text>
  <text x="1030" y="613" text-anchor="middle" fill="#94a3b8" font-size="9">ambiguous → 向用户提问</text>
  <text x="1030" y="627" text-anchor="middle" fill="#64748b" font-size="8">条件: 响应置信度低</text>

  <!-- Arrow to tool execution -->
  <line x1="600" y1="638" x2="600" y2="668" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== PHASE 4: after_tool (2) ====== -->
  <rect x="30" y="675" width="260" height="28" rx="6" fill="url(#toolGrad)"/>
  <text x="160" y="694" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Phase 4: after_tool (2)</text>

  <rect x="30" y="710" width="400" height="55" rx="6" fill="#04332b" stroke="#10b981" stroke-width="1" filter="url(#shadow)"/>
  <text x="230" y="733" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">19. ToolAuthMiddleware</text>
  <text x="230" y="750" text-anchor="middle" fill="#94a3b8" font-size="9">工具执行后权限验证 · 审计日志 · 敏感操作拦截</text>
  <text x="230" y="763" text-anchor="middle" fill="#64748b" font-size="8">条件: tool_auth_enabled</text>

  <rect x="445" y="710" width="400" height="55" rx="6" fill="#04332b" stroke="#10b981" stroke-width="1" filter="url(#shadow)"/>
  <text x="645" y="733" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">20. ToolResultValidationMiddleware</text>
  <text x="645" y="750" text-anchor="middle" fill="#94a3b8" font-size="9">工具结果校验 · 截断超长输出 · 格式规范化</text>
  <text x="645" y="763" text-anchor="middle" fill="#64748b" font-size="8">条件: 总是激活</text>

  <!-- Arrow: after_tool → after_step -->
  <line x1="600" y1="773" x2="600" y2="800" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== PHASE 5: after_step (2) ====== -->
  <rect x="30" y="807" width="260" height="28" rx="6" fill="url(#stepGrad)"/>
  <text x="160" y="826" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Phase 5: after_step (2)</text>

  <rect x="30" y="842" width="400" height="50" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" filter="url(#shadow)"/>
  <text x="230" y="864" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">21. TitleMiddleware</text>
  <text x="230" y="881" text-anchor="middle" fill="#94a3b8" font-size="9">首轮对话自动生成标题 (LLM 摘要)</text>

  <rect x="445" y="842" width="400" height="50" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" filter="url(#shadow)"/>
  <text x="645" y="864" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">22. MemoryWriteMiddleware</text>
  <text x="645" y="881" text-anchor="middle" fill="#94a3b8" font-size="9">LLM 提取事实 → MemoryQueue → 持久化 (debounced)</text>

  <!-- Flow arrows between phases -->
  <text x="600" y="293" text-anchor="middle" fill="#64748b" font-size="8">↓ LLM 调用前触发</text>
  <text x="600" y="516" text-anchor="middle" fill="#64748b" font-size="8">↓ LLM 返回后触发</text>
  <text x="600" y="666" text-anchor="middle" fill="#64748b" font-size="8">↓ 工具执行 (如果有 tool_calls)</text>
  <text x="600" y="798" text-anchor="middle" fill="#64748b" font-size="8">↓ 每个 LangGraph step 结束后触发</text>

  <!-- Loop indicator -->
  <line x1="860" y1="770" x2="860" y2="478" stroke="#64748b" stroke-width="0.8" stroke-dasharray="6,4"/>
  <text x="876" y="630" fill="#64748b" font-size="9">Loop back:</text>
  <text x="876" y="644" fill="#64748b" font-size="9">tool results</text>
  <text x="876" y="658" fill="#64748b" font-size="9">→ LLM → tools</text>
</svg>
