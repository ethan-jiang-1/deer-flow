<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <filter id="shadowLight">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1100" height="780" rx="12" fill="url(#bg)"/>
  <text x="550" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">Agent Loop 三层循环嵌套</text>

  <!-- ============================================================ -->
  <!-- LAYER 0: RunManager (outermost box) -->
  <!-- ============================================================ -->
  <rect x="40" y="56" width="1020" height="700" rx="10" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <rect x="40" y="56" width="1020" height="32" rx="10" fill="#f59e0b" opacity="0.15"/>
  <rect x="40" y="76" width="1020" height="12" fill="#f59e0b" opacity="0.15"/>
  <text x="60" y="77" fill="#fbbf24" font-size="13" font-weight="bold">Layer 0: RunManager — asyncio.create_task(run_agent()) · abort / cancel / rollback 控制平面</text>

  <!-- ── run_agent internal steps ── -->
  <text x="60" y="112" fill="#94a3b8" font-size="9">run_agent() 内部：</text>
  <rect x="60" y="120" width="180" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="150" y="136" text-anchor="middle" fill="#cbd5e1" font-size="8">1. 快照 checkpoint（备用 rollback）</text>
  <line x1="240" y1="132" x2="258" y2="132" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="260" y="120" width="180" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="350" y="136" text-anchor="middle" fill="#cbd5e1" font-size="8">2. 构建 runtime context</text>
  <line x1="440" y1="132" x2="458" y2="132" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="460" y="120" width="220" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="570" y="136" text-anchor="middle" fill="#cbd5e1" font-size="8">3. agent_factory(config) → 构造 graph + 18 middleware</text>
  <line x1="680" y1="132" x2="698" y2="132" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="700" y="120" width="180" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="790" y="136" text-anchor="middle" fill="#cbd5e1" font-size="8">4. 挂载 checkpointer + store</text>
  <line x1="880" y1="132" x2="898" y2="132" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="900" y="120" width="140" height="24" rx="4" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <text x="970" y="136" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="bold">5. agent.astream()</text>

  <!-- arrow from run_agent prep down to Layer 1 -->
  <line x1="550" y1="148" x2="550" y2="170" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- ============================================================ -->
  <!-- LAYER 1: LangGraph compiled graph -->
  <!-- ============================================================ -->
  <rect x="80" y="175" width="940" height="340" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <rect x="80" y="175" width="940" height="28" rx="8" fill="#3b82f6" opacity="0.12"/>
  <rect x="80" y="191" width="940" height="12" fill="#3b82f6" opacity="0.12"/>
  <text x="100" y="194" fill="#60a5fa" font-size="12" font-weight="bold">Layer 1: LangGraph Compiled Graph — agent.astream(stream_mode=["values","messages"])</text>

  <!-- Model Node -->
  <rect x="390" y="225" width="140" height="60" rx="8" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="460" y="253" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="bold">MODEL NODE</text>
  <text x="460" y="273" text-anchor="middle" fill="#94a3b8" font-size="8">LLM 调用</text>

  <!-- Tools Node -->
  <rect x="680" y="225" width="140" height="60" rx="8" fill="#0a1a0a" stroke="#22c55e" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="750" y="253" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="bold">TOOLS NODE</text>
  <text x="750" y="273" text-anchor="middle" fill="#94a3b8" font-size="8">执行 tool_calls</text>

  <!-- Model → Tools (has tool_calls) -->
  <path d="M 530 243 C 580 243, 620 210, 660 240" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="595" y="228" fill="#4ade80" font-size="8">有 tool_calls?</text>

  <!-- Tools → Model (return loop) -->
  <path d="M 740 288 L 740 330 L 460 330 L 460 288" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <text x="600" y="346" text-anchor="middle" fill="#4ade80" font-size="8">ToolMessages → 回到 MODEL（下一圈）</text>

  <!-- Model → END (no tool_calls) -->
  <path d="M 460 285 L 460 410" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="476" y="360" fill="#ef4444" font-size="8">没有 tool_calls → END</text>

  <!-- END node -->
  <rect x="410" y="415" width="100" height="30" rx="15" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="460" y="436" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">END</text>

  <!-- recursion_limit label -->
  <rect x="740" y="400" width="250" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="865" y="416" text-anchor="middle" fill="#94a3b8" font-size="8">recursion_limit = 100 · 循环最多 100 圈</text>

  <!-- Middleware Onion inside Layer 1 -->
  <rect x="120" y="470" width="860" height="34" rx="6" fill="#7c3aed" opacity="0.1" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="140" y="492" fill="#c4b5fd" font-size="9" font-weight="bold">每圈穿过 18 层 middleware → 展开见下方 Layer 2</text>

  <!-- arrow connecting Layer 1 to Layer 2 details -->
  <line x1="550" y1="508" x2="550" y2="530" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- ============================================================ -->
  <!-- LAYER 2: Middleware Onion -->
  <!-- ============================================================ -->
  <rect x="120" y="535" width="860" height="95" rx="8" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="120" y="535" width="860" height="24" rx="8" fill="#a78bfa" opacity="0.1"/>
  <rect x="120" y="547" width="860" height="12" fill="#a78bfa" opacity="0.1"/>
  <text x="140" y="552" fill="#c4b5fd" font-size="11" font-weight="bold">Layer 2: Middleware Onion — 嵌入 MODEL 和 TOOLS 节点内部</text>

  <!-- before_model flow -->
  <text x="140" y="576" fill="#94a3b8" font-size="8">before_model (正向 1→18)：</text>
  <rect x="300" y="562" width="60" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="330" y="576" text-anchor="middle" fill="#cbd5e1" font-size="7">m1</text>
  <text x="368" y="576" fill="#64748b" font-size="8">→</text>
  <rect x="378" y="562" width="60" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="408" y="576" text-anchor="middle" fill="#cbd5e1" font-size="7">m2</text>
  <text x="446" y="576" fill="#64748b" font-size="8">→</text>
  <rect x="456" y="562" width="60" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="486" y="576" text-anchor="middle" fill="#cbd5e1" font-size="7">m3</text>
  <text x="524" y="576" fill="#64748b" font-size="8">→</text>
  <text x="540" y="576" fill="#64748b" font-size="8">...</text>
  <text x="554" y="576" fill="#64748b" font-size="8">→</text>
  <rect x="564" y="562" width="60" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="594" y="576" text-anchor="middle" fill="#cbd5e1" font-size="7">m18</text>

  <!-- wrap_model_call -->
  <text x="140" y="600" fill="#94a3b8" font-size="8">wrap_model_call (洋葱嵌套)：</text>
  <text x="338" y="600" fill="#fbbf24" font-size="8" font-family="monospace">m1( m2( m3(</text>
  <text x="430" y="600" fill="#94a3b8" font-size="8">...</text>
  <text x="454" y="600" fill="#fbbf24" font-size="8" font-family="monospace">m18( LLM.call() )</text>
  <text x="582" y="600" fill="#94a3b8" font-size="8">...</text>
  <text x="610" y="600" fill="#fbbf24" font-size="8" font-family="monospace">) ) )</text>

  <!-- after_model -->
  <text x="140" y="622" fill="#94a3b8" font-size="8">after_model (反向 18→1)：</text>
  <text x="338" y="622" fill="#cbd5e1" font-size="7">m18</text>
  <text x="370" y="622" fill="#64748b" font-size="8">←</text>
  <text x="384" y="622" fill="#cbd5e1" font-size="7">...</text>
  <text x="402" y="622" fill="#64748b" font-size="8">←</text>
  <text x="414" y="622" fill="#cbd5e1" font-size="7">m3</text>
  <text x="436" y="622" fill="#64748b" font-size="8">←</text>
  <rect x="448" y="608" width="60" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="478" y="622" text-anchor="middle" fill="#cbd5e1" font-size="7">m2</text>
  <text x="516" y="622" fill="#64748b" font-size="8">←</text>
  <rect x="528" y="608" width="60" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="558" y="622" text-anchor="middle" fill="#cbd5e1" font-size="7">m1</text>

  <!-- ============================================================ -->
  <!-- LAYER 3: Subagent Loops -->
  <!-- ============================================================ -->
  <rect x="80" y="650" width="940" height="105" rx="8" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="80" y="650" width="940" height="24" rx="8" fill="#ec4899" opacity="0.1"/>
  <rect x="80" y="662" width="940" height="12" fill="#ec4899" opacity="0.1"/>
  <text x="100" y="668" fill="#f472b6" font-size="11" font-weight="bold">Layer 3: Subagent Loops — task() tool 触发 → 独立 daemon 线程 → 自己的 astream（最多 3 个并行）</text>

  <!-- Subagent boxes -->
  <rect x="120" y="690" width="210" height="49" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="225" y="710" text-anchor="middle" fill="#f472b6" font-size="9" font-weight="bold">SubagentExecutor</text>
  <text x="225" y="728" text-anchor="middle" fill="#94a3b8" font-size="7">persistent daemon event loop</text>

  <text x="350" y="718" fill="#64748b" font-size="10">→</text>

  <rect x="380" y="690" width="210" height="49" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="485" y="710" text-anchor="middle" fill="#f472b6" font-size="9" font-weight="bold">_aexecute()</text>
  <text x="485" y="728" text-anchor="middle" fill="#94a3b8" font-size="7">Construct state → create_agent → astream</text>

  <text x="610" y="718" fill="#64748b" font-size="10">→</text>

  <rect x="640" y="690" width="210" height="49" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="745" y="710" text-anchor="middle" fill="#f472b6" font-size="9" font-weight="bold">Subagent Graph</text>
  <text x="745" y="728" text-anchor="middle" fill="#94a3b8" font-size="7">自己的 middleware 链 (6-7 个)</text>

  <!-- parallel indicator -->
  <text x="860" y="718" fill="#94a3b8" font-size="8">×3</text>
  <text x="900" y="718" fill="#64748b" font-size="7">MAX_CONCURRENT</text>

  <!-- ============================================================ -->
  <!-- Layer Summary Table -->
  <!-- ============================================================ -->
  <text x="50" y="775" fill="#94a3b8" font-size="8">三层各司其职 → 详见正文对照表</text>
</svg>
