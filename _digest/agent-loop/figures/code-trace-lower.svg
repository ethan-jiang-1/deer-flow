<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#64748b"/>
    </marker>
    <marker id="arrowDownPurple" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#7c3aed"/>
    </marker>
    <marker id="arrowDownBlue" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#2563eb"/>
    </marker>
    <marker id="arrowDownGreen" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#059669"/>
    </marker>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="720" rx="8" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" fill="#1e293b" font-size="17" font-weight="bold">调用栈（下）— Pregel BSP 超步循环 &amp; middleware 洋葱执行</text>

  <!-- Legend -->
  <rect x="30" y="46" width="12" height="12" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="48" y="57" fill="#64748b" font-size="7">LangGraph</text>
  <rect x="120" y="46" width="12" height="12" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="138" y="57" fill="#64748b" font-size="7">LangChain</text>
  <rect x="210" y="46" width="12" height="12" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="228" y="57" fill="#64748b" font-size="7">DeerFlow middleware</text>

  <!-- ==================== UPPER REFERENCE ==================== -->
  <rect x="30" y="68" width="940" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="500" y="82" text-anchor="middle" fill="#64748b" font-size="7">接上一幅图 — LangGraph Pregel 开始执行 while loop.tick() — 下面展开 tick() 内部和一个 superstep 中 model/tools 节点的执行</text>

  <line x1="500" y1="88" x2="500" y2="106" stroke="#7c3aed" stroke-width="1" marker-end="url(#arrowDownPurple)"/>

  <!-- ==================== PART 1: PregelLoop.tick() ==================== -->
  <rect x="30" y="110" width="940" height="200" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="110" width="400" height="24" rx="6" fill="#ddd6fe"/>
  <text x="50" y="127" fill="#5b21b6" font-size="10" font-weight="bold">LangGraph — PregelLoop.tick() 一个 BSP superstep 的完整周期</text>

  <!-- The while loop -->
  <rect x="50" y="142" width="900" height="30" rx="3" fill="#fff" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="70" y="160" fill="#5b21b6" font-size="8" font-weight="bold" font-family="monospace">while loop.tick():   </text><text x="210" y="160" fill="#64748b" font-size="8">每次 tick() 执行一个 BSP superstep。返回 True（还有 task）→ 继续循环；返回 False → astream() 退出</text>

  <!-- 4 phases in a row -->
  <rect x="50" y="184" width="195" height="52" rx="4" fill="#fff" stroke="#c4b5fd" stroke-width="0.6"/>
  <text x="147" y="200" text-anchor="middle" fill="#5b21b6" font-size="7" font-weight="bold">Phase 1: apply_writes</text>
  <text x="147" y="216" text-anchor="middle" fill="#64748b" font-size="6">上一轮所有 task 的输出</text>
  <text x="147" y="230" text-anchor="middle" fill="#64748b" font-size="6">写入 channels（消息、state）</text>

  <text x="255" y="213" fill="#94a3b8" font-size="8">→</text>

  <rect x="270" y="184" width="195" height="52" rx="4" fill="#fff" stroke="#c4b5fd" stroke-width="0.6"/>
  <text x="367" y="200" text-anchor="middle" fill="#5b21b6" font-size="7" font-weight="bold">Phase 2: emit &amp; checkpoint</text>
  <text x="367" y="216" text-anchor="middle" fill="#64748b" font-size="6">产出 "values" stream event</text>
  <text x="367" y="230" text-anchor="middle" fill="#64748b" font-size="6">checkpointer.put() 保存状态</text>

  <text x="475" y="213" fill="#94a3b8" font-size="8">→</text>

  <rect x="490" y="184" width="195" height="52" rx="4" fill="#fff" stroke="#c4b5fd" stroke-width="0.6"/>
  <text x="587" y="200" text-anchor="middle" fill="#5b21b6" font-size="7" font-weight="bold">Phase 3: prepare_next_tasks</text>
  <text x="587" y="216" text-anchor="middle" fill="#64748b" font-size="6">根据条件边和当前 state</text>
  <text x="587" y="230" text-anchor="middle" fill="#64748b" font-size="6">决定下个 superstep 执行哪些 node</text>

  <text x="695" y="213" fill="#94a3b8" font-size="8">→</text>

  <rect x="710" y="184" width="240" height="52" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="0.6"/>
  <text x="830" y="200" text-anchor="middle" fill="#5b21b6" font-size="7" font-weight="bold">Phase 4: runner.atick(tasks)</text>
  <text x="830" y="216" text-anchor="middle" fill="#64748b" font-size="6">并行执行当前 superstep 的所有 node</text>
  <text x="830" y="230" text-anchor="middle" fill="#64748b" font-size="6">每个 node 产出 writes → 下一轮 tick 消费</text>

  <!-- Example BSP sequence -->
  <text x="50" y="258" fill="#5b21b6" font-size="8" font-weight="bold">一个完整 agent run 的 BSP 超步序列（横轴 = 时间）</text>
  <rect x="50" y="268" width="900" height="34" rx="4" fill="#fff" stroke="#c4b5fd" stroke-width="0.4"/>
  <rect x="58" y="274" width="80" height="22" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.3"/>
  <text x="98" y="289" text-anchor="middle" fill="#64748b" font-size="6">START</text>
  <text x="148" y="289" fill="#c4b5fd" font-size="8">→</text>
  <rect x="160" y="274" width="80" height="22" rx="3" fill="#ede9fe" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="200" y="289" text-anchor="middle" fill="#5b21b6" font-size="6">before_agent</text>
  <text x="250" y="289" fill="#c4b5fd" font-size="8">→</text>
  <rect x="262" y="274" width="80" height="22" rx="3" fill="#ede9fe" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="302" y="289" text-anchor="middle" fill="#5b21b6" font-size="6">before_model</text>
  <text x="352" y="289" fill="#c4b5fd" font-size="8">→</text>
  <rect x="364" y="274" width="100" height="22" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="414" y="289" text-anchor="middle" fill="#1e40af" font-size="7" font-weight="bold">"model"</text>
  <text x="474" y="289" fill="#c4b5fd" font-size="8">→</text>
  <rect x="486" y="274" width="100" height="22" rx="3" fill="#d1fae5" stroke="#34d399" stroke-width="0.8"/>
  <text x="536" y="289" text-anchor="middle" fill="#065f46" font-size="7" font-weight="bold">"tools"</text>
  <text x="596" y="289" fill="#c4b5fd" font-size="8">→</text>
  <text x="608" y="289" fill="#7c3aed" font-size="7" font-weight="bold">"model"</text>
  <text x="658" y="289" fill="#c4b5fd" font-size="8">→</text>
  <text x="670" y="289" fill="#7c3aed" font-size="7">... 循环 ...</text>
  <text x="730" y="289" fill="#c4b5fd" font-size="8">→</text>
  <rect x="742" y="274" width="80" height="22" rx="3" fill="#ede9fe" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="782" y="289" text-anchor="middle" fill="#5b21b6" font-size="6">after_agent</text>
  <text x="832" y="289" fill="#c4b5fd" font-size="8">→</text>
  <rect x="842" y="274" width="80" height="22" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.3"/>
  <text x="882" y="289" text-anchor="middle" fill="#64748b" font-size="6">END</text>

  <line x1="500" y1="310" x2="500" y2="336" stroke="#64748b" stroke-width="1" marker-end="url(#arrowDown)"/>

  <!-- ==================== PART 2: Inside model node ==================== -->
  <text x="30" y="352" fill="#1e293b" font-size="13" font-weight="bold">"model" 节点内部</text>
  <text x="150" y="352" fill="#64748b" font-size="8">— 在单个 superstep 中，这个 node 被调度执行</text>

  <!-- LangChain model_node -->
  <rect x="30" y="364" width="940" height="150" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="30" y="364" width="260" height="22" rx="6" fill="#bfdbfe"/>
  <text x="50" y="380" fill="#1e40af" font-size="9" font-weight="bold">LangChain — factory.py:model_node()</text>

  <!-- Build ModelRequest -->
  <rect x="50" y="394" width="300" height="26" rx="3" fill="#fff" stroke="#93c5fd" stroke-width="0.4"/>
  <text x="200" y="411" text-anchor="middle" fill="#475569" font-size="7">构建 ModelRequest(model, messages, tools, system_message, state, runtime)</text>

  <text x="360" y="410" fill="#93c5fd" font-size="8">→</text>

  <!-- Enter onion -->
  <rect x="375" y="394" width="300" height="26" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="525" y="411" text-anchor="middle" fill="#92400e" font-size="7" font-weight="bold">进入 wrap_model_call 洋葱链 →</text>

  <!-- Onion chain visual -->
  <rect x="50" y="428" width="900" height="78" rx="4" fill="#fff" stroke="#fcd34d" stroke-width="0.5"/>

  <!-- Layer visual -->
  <rect x="65" y="436" width="870" height="16" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.4"/>
  <text x="75" y="448" fill="#b45309" font-size="6" font-family="monospace">[DeerFlow] LLMErrorHandling.wrap_model_call(request, handler)          </text><text x="550" y="448" fill="#92400e" font-size="6">← 捕获模型异常，转为可恢复 error</text>

  <rect x="85" y="454" width="830" height="16" rx="2" fill="#fef3c7" opacity="0.7" stroke="#f59e0b" stroke-width="0.3"/>
  <text x="95" y="466" fill="#b45309" font-size="6" font-family="monospace">  [DeerFlow] DanglingToolCall.wrap_model_call(request, handler)       </text><text x="570" y="466" fill="#92400e" font-size="6">← 修复缺失 ToolMessage 的历史消息</text>

  <rect x="105" y="472" width="790" height="16" rx="2" fill="#fef3c7" opacity="0.5" stroke="#f59e0b" stroke-width="0.3"/>
  <text x="115" y="484" fill="#b45309" font-size="6" font-family="monospace">    [DeerFlow] LoopDetection.wrap_model_call(request, handler)         </text><text x="590" y="484" fill="#92400e" font-size="6">← 注入上一圈排队的 loop 警告</text>

  <rect x="125" y="490" width="750" height="16" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="0.6"/>
  <text x="135" y="502" fill="#1e40af" font-size="6" font-weight="bold" font-family="monospace">      [LangChain] _execute_model_sync(request)                          </text><text x="590" y="502" fill="#1e40af" font-size="6">← model.invoke(messages) 真正调用 LLM</text>

  <line x1="500" y1="514" x2="500" y2="540" stroke="#64748b" stroke-width="0.8" marker-end="url(#arrowDown)"/>

  <!-- ==================== PART 3: Inside tools node ==================== -->
  <text x="30" y="556" fill="#1e293b" font-size="13" font-weight="bold">"tools" 节点内部</text>
  <text x="150" y="556" fill="#64748b" font-size="8">— model 产生 tool_calls 后，条件边路由到 tools node</text>

  <rect x="30" y="568" width="940" height="140" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="30" y="568" width="300" height="22" rx="6" fill="#a7f3d0"/>
  <text x="50" y="584" fill="#065f46" font-size="9" font-weight="bold">LangGraph — ToolNode (langgraph/prebuilt/tool_node.py)</text>

  <!-- Multi-tool parallel -->
  <rect x="50" y="598" width="300" height="26" rx="3" fill="#fff" stroke="#6ee7b7" stroke-width="0.4"/>
  <text x="200" y="615" text-anchor="middle" fill="#475569" font-size="7">多个 tool 可在此 superstep 中并行执行</text>

  <text x="360" y="614" fill="#6ee7b7" font-size="8">→</text>

  <rect x="375" y="598" width="300" height="26" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="525" y="615" text-anchor="middle" fill="#92400e" font-size="7" font-weight="bold">每个 tool 独立穿过 wrap_tool_call 洋葱 →</text>

  <!-- Onion chain -->
  <rect x="50" y="630" width="900" height="68" rx="4" fill="#fff" stroke="#fcd34d" stroke-width="0.5"/>

  <rect x="65" y="638" width="870" height="14" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.4"/>
  <text x="75" y="649" fill="#b45309" font-size="6" font-family="monospace">[DeerFlow] Guardrail.wrap_tool_call(request, handler)              </text><text x="560" y="649" fill="#92400e" font-size="6">← 权限校验，deny → ToolMessage("denied")</text>

  <rect x="85" y="654" width="830" height="14" rx="2" fill="#fef3c7" opacity="0.7" stroke="#f59e0b" stroke-width="0.3"/>
  <text x="95" y="665" fill="#b45309" font-size="6" font-family="monospace">  [DeerFlow] SandboxAudit.wrap_tool_call(request, handler)           </text><text x="560" y="665" fill="#92400e" font-size="6">← 安全审计日志</text>

  <rect x="105" y="670" width="790" height="14" rx="2" fill="#fef3c7" opacity="0.5" stroke="#f59e0b" stroke-width="0.3"/>
  <text x="115" y="681" fill="#b45309" font-size="6" font-family="monospace">    [DeerFlow] ToolErrorHandling.wrap_tool_call(request, handler)     </text><text x="560" y="681" fill="#92400e" font-size="6">← 异常 → ToolMessage(error=...)</text>

  <rect x="125" y="686" width="750" height="14" rx="2" fill="#d1fae5" stroke="#059669" stroke-width="0.6"/>
  <text x="135" y="697" fill="#065f46" font-size="6" font-weight="bold" font-family="monospace">      [LangGraph] tool.invoke(args)                                    </text><text x="560" y="697" fill="#065f46" font-size="6">← 真正执行 tool</text>
</svg>
