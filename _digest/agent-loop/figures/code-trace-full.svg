<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#64748b"/>
    </marker>
    <marker id="arrowDownBlue" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#3b82f6"/>
    </marker>
    <marker id="arrowDownGreen" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#22c55e"/>
    </marker>
    <marker id="arrowDownOrange" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#f59e0b"/>
    </marker>
    <marker id="arrowDownPurple" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#a78bfa"/>
    </marker>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1100" height="980" rx="12" fill="url(#bg)"/>
  <text x="550" y="34" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="bold">完整调用栈：HTTP → run_agent → create_agent → astream → Pregel tick → middleware hooks</text>

  <!-- ============================================================ -->
  <!-- LEFT COLUMN: Ownership labels -->
  <!-- ============================================================ -->
  <text x="30" y="70" fill="#64748b" font-size="9">代码归属：</text>
  <rect x="30" y="78" width="12" height="12" rx="2" fill="#f59e0b" opacity="0.6"/>
  <text x="48" y="89" fill="#94a3b8" font-size="7">DeerFlow</text>
  <rect x="110" y="78" width="12" height="12" rx="2" fill="#3b82f6" opacity="0.6"/>
  <text x="128" y="89" fill="#94a3b8" font-size="7">LangChain</text>
  <rect x="200" y="78" width="12" height="12" rx="2" fill="#a78bfa" opacity="0.6"/>
  <text x="218" y="89" fill="#94a3b8" font-size="7">LangGraph</text>

  <!-- Key insight box -->
  <rect x="340" y="72" width="430" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="555" y="91" text-anchor="middle" fill="#94a3b8" font-size="7">Loop 本身（while / for）在 LangGraph Pregel 里 · DeerFlow 消费 astream() 产出的 chunk</text>

  <!-- ============================================================ -->
  <!-- LAYER A: HTTP → run_agent() -->
  <!-- ============================================================ -->

  <!-- Entry: HTTP -->
  <rect x="380" y="110" width="200" height="26" rx="5" fill="#1e293b" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="480" y="128" text-anchor="middle" fill="#cbd5e1" font-size="8">HTTP POST /threads/{id}/runs/stream</text>
  <line x1="480" y1="136" x2="480" y2="152" stroke="#64748b" stroke-width="1" marker-end="url(#arrowDown)"/>

  <!-- run_agent() box -->
  <rect x="30" y="156" width="900" height="70" rx="6" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="30" y="156" width="300" height="22" rx="6" fill="#f59e0b" opacity="0.15"/>
  <text x="48" y="172" fill="#fbbf24" font-size="9" font-weight="bold">DeerFlow: run_agent() — worker.py:124</text>

  <rect x="50" y="184" width="160" height="18" rx="3" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="0.4"/>
  <text x="130" y="197" text-anchor="middle" fill="#cbd5e1" font-size="6">① 快照 checkpoint</text>
  <text x="220" y="197" fill="#64748b" font-size="7">→</text>
  <rect x="230" y="184" width="160" height="18" rx="3" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="0.4"/>
  <text x="310" y="197" text-anchor="middle" fill="#cbd5e1" font-size="6">② 注入 runtime context</text>
  <text x="400" y="197" fill="#64748b" font-size="7">→</text>
  <rect x="410" y="184" width="160" height="18" rx="3" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="0.4"/>
  <text x="490" y="197" text-anchor="middle" fill="#cbd5e1" font-size="6">③ 注入 RunJournal</text>
  <text x="580" y="197" fill="#64748b" font-size="7">→</text>
  <rect x="590" y="184" width="190" height="18" rx="3" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="0.4"/>
  <text x="685" y="197" text-anchor="middle" fill="#cbd5e1" font-size="6">④ agent_factory(config)</text>
  <text x="790" y="197" fill="#64748b" font-size="7">→</text>
  <text x="808" y="197" fill="#94a3b8" font-size="6">⑤ astream()</text>

  <line x1="480" y1="226" x2="480" y2="246" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrowDownOrange)"/>

  <!-- ============================================================ -->
  <!-- LAYER B: create_agent() -->
  <!-- ============================================================ -->
  <rect x="80" y="250" width="800" height="115" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="80" y="250" width="420" height="22" rx="6" fill="#3b82f6" opacity="0.12"/>
  <text x="98" y="267" fill="#60a5fa" font-size="9" font-weight="bold">LangChain: create_agent() — langchain/agents/factory.py (v1.2.15)</text>

  <text x="100" y="292" fill="#94a3b8" font-size="7">输入: model + tools + middleware 列表 + system_prompt + state_schema</text>

  <rect x="100" y="302" width="230" height="24" rx="3" fill="#3b82f6" opacity="0.08" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="215" y="319" text-anchor="middle" fill="#cbd5e1" font-size="7">遍历 middleware → 收集 hook 方法签名</text>

  <text x="340" y="318" fill="#64748b" font-size="7">→</text>

  <rect x="355" y="302" width="250" height="24" rx="3" fill="#3b82f6" opacity="0.08" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="480" y="319" text-anchor="middle" fill="#cbd5e1" font-size="7">构建 StateGraph → 添加节点 + 条件边</text>

  <text x="615" y="318" fill="#64748b" font-size="7">→</text>

  <rect x="630" y="302" width="235" height="24" rx="3" fill="#3b82f6" opacity="0.08" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="747" y="319" text-anchor="middle" fill="#cbd5e1" font-size="7">compose wrap_model_call / wrap_tool_call 洋葱</text>

  <text x="100" y="340" fill="#94a3b8" font-size="7">输出: CompiledStateGraph（已编译的状态图）</text>
  <text x="400" y="340" fill="#64748b" font-size="7">before_agent / before_model / after_model / after_agent → 独立 graph node  ·  wrap_* → 洋葱链融入 model/tools node 内部</text>

  <line x1="480" y1="365" x2="480" y2="385" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrowDownBlue)"/>

  <!-- ============================================================ -->
  <!-- LAYER C: CompiledStateGraph.astream() -->
  <!-- ============================================================ -->
  <rect x="80" y="390" width="800" height="150" rx="6" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="80" y="390" width="430" height="22" rx="6" fill="#a78bfa" opacity="0.1"/>
  <text x="98" y="407" fill="#c4b5fd" font-size="9" font-weight="bold">LangGraph: CompiledStateGraph.astream() → Pregel.astream()</text>

  <text x="100" y="430" fill="#94a3b8" font-size="7">async with AsyncPregelLoop(input, config, ...) as loop:   ← 初始化 channels、checkpoint、stream 协议</text>

  <!-- while loop highlight -->
  <rect x="100" y="442" width="760" height="65" rx="4" fill="#a78bfa" opacity="0.06" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="480" y="458" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="bold">while loop.tick():   ← 这就是 agent loop 的 while 循环！</text>

  <text x="120" y="476" fill="#94a3b8" font-size="7">每个 tick = 一个 BSP superstep：收集上一轮 writes → apply 到 channels → 保存 checkpoint → 准备下一轮 tasks → 返回 bool</text>
  <text x="120" y="492" fill="#94a3b8" font-size="7">runner.atick(tasks) 并行执行当前 superstep 的所有 node → 有 tasks 返回 True，无 tasks 返回 False → while 退出</text>

  <!-- Stream output -->
  <text x="100" y="528" fill="#94a3b8" font-size="7">for o in output(): yield o   ← 每个 tick 产出 stream event (values / messages / updates 等)</text>

  <line x1="480" y1="540" x2="480" y2="560" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrowDownPurple)"/>

  <!-- ============================================================ -->
  <!-- LAYER D: PregelLoop.tick() internals -->
  <!-- ============================================================ -->
  <rect x="80" y="565" width="800" height="120" rx="6" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="5,3"/>
  <rect x="80" y="565" width="260" height="20" rx="6" fill="#a78bfa" opacity="0.08"/>
  <text x="98" y="579" fill="#c4b5fd" font-size="8" font-weight="bold">PregelLoop.tick() 内部 — 一个 superstep 的完整周期</text>

  <rect x="100" y="594" width="170" height="36" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="185" y="609" text-anchor="middle" fill="#cbd5e1" font-size="7">上一轮 task writes</text>
  <text x="185" y="623" text-anchor="middle" fill="#94a3b8" font-size="6">→ apply_writes(channels)</text>

  <text x="280" y="615" fill="#64748b" font-size="7">→</text>

  <rect x="295" y="594" width="170" height="36" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="380" y="609" text-anchor="middle" fill="#cbd5e1" font-size="7">emit "values" stream event</text>
  <text x="380" y="623" text-anchor="middle" fill="#94a3b8" font-size="6">→ 全量状态快照</text>

  <text x="475" y="615" fill="#64748b" font-size="7">→</text>

  <rect x="490" y="594" width="170" height="36" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="575" y="609" text-anchor="middle" fill="#cbd5e1" font-size="7">save checkpoint</text>
  <text x="575" y="623" text-anchor="middle" fill="#94a3b8" font-size="6">→ checkpointer.put()</text>

  <text x="670" y="615" fill="#64748b" font-size="7">→</text>

  <rect x="685" y="594" width="180" height="36" rx="3" fill="#a78bfa" opacity="0.12" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="775" y="609" text-anchor="middle" fill="#c4b5fd" font-size="7" font-weight="bold">prepare_next_tasks()</text>
  <text x="775" y="623" text-anchor="middle" fill="#94a3b8" font-size="6">→ 返回下个 superstep 的 tasks</text>

  <!-- Example superstep cycle -->
  <text x="100" y="658" fill="#94a3b8" font-size="7">典型 BSP 序列：</text>
  <text x="100" y="673" fill="#94a3b8" font-size="6">Tick1: [m1.before_agent][m2.before_agent] → Tick2: [m1.before_model][m2.before_model] → Tick3: ["model" node] → Tick4: ["tools" node] → Tick5: [m1.before_model] → Tick6: ["model" node] → ...</text>

  <line x1="480" y1="685" x2="480" y2="710" stroke="#a78bfa" stroke-width="1" marker-end="url(#arrowDownPurple)"/>

  <!-- ============================================================ -->
  <!-- LAYER E: Inside model/tools nodes with middleware -->
  <!-- ============================================================ -->
  <rect x="30" y="714" width="1040" height="250" rx="6" fill="none" stroke="#475569" stroke-width="0.8"/>

  <!-- Model node -->
  <rect x="50" y="728" width="490" height="225" rx="5" fill="none" stroke="#3b82f6" stroke-width="0.8"/>
  <rect x="50" y="728" width="200" height="20" rx="5" fill="#3b82f6" opacity="0.1"/>
  <text x="65" y="742" fill="#60a5fa" font-size="8" font-weight="bold">"model" 节点（LangChain）</text>

  <text x="70" y="764" fill="#94a3b8" font-size="7">before_model hooks 执行完之后，进入 model 节点：</text>

  <rect x="70" y="774" width="450" height="80" rx="3" fill="#2a1a00" opacity="0.08" stroke="#f59e0b" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="85" y="790" fill="#fbbf24" font-size="6" font-weight="bold">wrap_model_call 洋葱（LangChain compose + DeerFlow middleware 实现）</text>
  <text x="85" y="804" fill="#cbd5e1" font-size="6">m1.wrap_model_call(request, handler)  ← [DeerFlow] LLMErrorHandling: 捕获异常</text>
  <text x="85" y="818" fill="#cbd5e1" font-size="6">  handler → m2.wrap_model_call(request, handler)  ← [DeerFlow] DanglingToolCall: 修复配对</text>
  <text x="85" y="832" fill="#cbd5e1" font-size="6">    handler → m3.wrap_model_call(...)  ← [DeerFlow] LoopDetection: 注入警告</text>
  <text x="85" y="846" fill="#cbd5e1" font-size="6">      handler → _execute_model_sync(request)  ← [LangChain] model.invoke(messages)</text>

  <text x="70" y="870" fill="#94a3b8" font-size="7">返回 [AIMessage(content, tool_calls)] → 条件边判断 → "tools" 或 END</text>

  <!-- Tools node -->
  <rect x="560" y="728" width="490" height="225" rx="5" fill="none" stroke="#22c55e" stroke-width="0.8"/>
  <rect x="560" y="728" width="240" height="20" rx="5" fill="#22c55e" opacity="0.08"/>
  <text x="575" y="742" fill="#4ade80" font-size="8" font-weight="bold">"tools" 节点（LangGraph ToolNode）</text>

  <text x="580" y="764" fill="#94a3b8" font-size="7">model 输出了 tool_calls → 进入 tools 节点：</text>

  <rect x="580" y="774" width="450" height="80" rx="3" fill="#0a1a0a" opacity="0.08" stroke="#22c55e" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="595" y="790" fill="#4ade80" font-size="6" font-weight="bold">wrap_tool_call 洋葱（LangGraph ToolNode + DeerFlow middleware 实现）</text>
  <text x="595" y="804" fill="#cbd5e1" font-size="6">m1.wrap_tool_call(request, handler)  ← [DeerFlow] Guardrail: 权限校验</text>
  <text x="595" y="818" fill="#cbd5e1" font-size="6">  handler → m2.wrap_tool_call(request, handler)  ← [DeerFlow] SandboxAudit: 审计日志</text>
  <text x="595" y="832" fill="#cbd5e1" font-size="6">    handler → m3.wrap_tool_call(request, handler)  ← [DeerFlow] ToolError: 异常→ToolMessage</text>
  <text x="595" y="846" fill="#cbd5e1" font-size="6">      handler → tool.invoke(args)  ← [LangGraph] 真正执行</text>

  <text x="580" y="870" fill="#94a3b8" font-size="7">返回 ToolMessage(result) → 条件边判断 → 回到 "model" 节点</text>

  <!-- Loop back to consumer -->
  <line x1="480" y1="958" x2="480" y2="974" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrowDownOrange)"/>

  <rect x="330" y="970" width="300" height="18" rx="3" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="480" y="984" text-anchor="middle" fill="#fbbf24" font-size="7">yield chunk → [DeerFlow] bridge.publish() → SSE → 前端</text>
</svg>
