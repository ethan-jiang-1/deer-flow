<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#546E7A"/></marker>
  </defs>

  <text x="425" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#263238">DeerFlow 启动全流程</text>
  <text x="425" y="38" text-anchor="middle" font-size="10" fill="#78909C">make dev · make docker-start · make gateway · DeerFlowClient — 四种入口 · 三种部署模式</text>

  <!-- ===== LOCAL DEV ===== -->
  <rect x="20" y="52" width="390" height="210" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="2"/>
  <text x="215" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#1B5E20">make dev (本地开发)</text>

  <rect x="35" y="88" width="360" height="164" rx="5" fill="#C8E6C9"/>
  <text x="215" y="108" text-anchor="middle" font-size="10" font-weight="600" fill="#2E7D32">scripts/serve.sh --dev</text>
  <text x="215" y="125" text-anchor="middle" font-size="8" fill="#388E3C">1. 加载 .env  ·  2. 清理旧进程</text>
  <text x="215" y="140" text-anchor="middle" font-size="8" fill="#388E3C">3. 检查 config.yaml  ·  4. config-upgrade.sh</text>
  <text x="215" y="155" text-anchor="middle" font-size="8" fill="#388E3C">5. uv sync + pnpm install</text>
  <text x="215" y="175" text-anchor="middle" font-size="8" font-weight="700" fill="#1B5E20">6. Gateway (:8001) — uvicorn --reload</text>
  <text x="215" y="190" text-anchor="middle" font-size="8" font-weight="700" fill="#1B5E20">7. Frontend (:3000) — pnpm run dev</text>
  <text x="215" y="205" text-anchor="middle" font-size="8" font-weight="700" fill="#1B5E20">8. Nginx (:2026) — nginx.local.conf</text>
  <text x="215" y="222" text-anchor="middle" font-size="7" fill="#81C784">→ localhost:2026 (全部服务)</text>
  <text x="215" y="237" text-anchor="middle" font-size="7" fill="#A5D6A7">→ localhost:8001 (仅 Gateway API, 无需前端/Nginx)</text>

  <!-- ===== DOCKER DEV ===== -->
  <rect x="440" y="52" width="390" height="210" rx="8" fill="#E3F2FD" stroke="#42A5F5" stroke-width="2"/>
  <text x="635" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#0D47A1">make docker-start (Docker 开发)</text>

  <rect x="455" y="88" width="360" height="164" rx="5" fill="#BBDEFB"/>
  <text x="635" y="108" text-anchor="middle" font-size="10" font-weight="600" fill="#1565C0">scripts/docker.sh start</text>
  <text x="635" y="125" text-anchor="middle" font-size="8" fill="#1976D2">1. 读取 config.yaml → 判断 sandbox 模式</text>
  <text x="635" y="140" text-anchor="middle" font-size="8" fill="#1976D2">2. docker-compose-dev.yaml up -d</text>
  <text x="635" y="160" text-anchor="middle" font-size="8" font-weight="700" fill="#0D47A1">nginx (:2026) ← nginx:alpine</text>
  <text x="635" y="175" text-anchor="middle" font-size="8" font-weight="700" fill="#0D47A1">frontend (:3000) ← node:22, pnpm run dev</text>
  <text x="635" y="190" text-anchor="middle" font-size="8" font-weight="700" fill="#0D47A1">gateway (:8001) ← python:3.12, uv sync → uvicorn</text>
  <text x="635" y="205" text-anchor="middle" font-size="8" font-weight="700" fill="#0D47A1">provisioner (:8002) ← K3s pod mgr (optional)</text>
  <text x="635" y="222" text-anchor="middle" font-size="7" fill="#64B5F6">挂载: config.yaml · skills/ · backend/ (hot-reload) · Docker socket</text>
  <text x="635" y="237" text-anchor="middle" font-size="7" fill="#90CAF9">Docker DNS: gateway:8001, frontend:3000 (无需 localhost)</text>

  <!-- ===== LIFESPAN ===== -->
  <rect x="20" y="275" width="810" height="100" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="425" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#E65100">Gateway lifespan() — 所有模式共用</text>

  <rect x="35" y="312" width="240" height="48" rx="4" fill="#FFE0B2"/>
  <text x="155" y="332" text-anchor="middle" font-size="10" font-weight="700" fill="#BF360C">1. Config Load</text>
  <text x="155" y="348" text-anchor="middle" font-size="8" fill="#E65100">config.yaml → AppConfig</text>
  <text x="155" y="360" text-anchor="middle" font-size="7" fill="#FFB74D">mtime 热重载 · version check</text>

  <rect x="290" y="312" width="250" height="48" rx="4" fill="#FFE0B2"/>
  <text x="415" y="332" text-anchor="middle" font-size="10" font-weight="700" fill="#BF360C">2. Runtime Init</text>
  <text x="415" y="348" text-anchor="middle" font-size="8" fill="#E65100">StreamBridge · Engine · Checkpointer</text>
  <text x="415" y="360" text-anchor="middle" font-size="7" fill="#FFB74D">Store · RunRepo · RunManager · OrphanRecovery</text>

  <rect x="555" y="312" width="260" height="48" rx="4" fill="#FFE0B2"/>
  <text x="685" y="332" text-anchor="middle" font-size="10" font-weight="700" fill="#BF360C">3. Admin + Channels</text>
  <text x="685" y="348" text-anchor="middle" font-size="8" fill="#E65100">_ensure_admin_user()</text>
  <text x="685" y="360" text-anchor="middle" font-size="7" fill="#FFB74D">start_channel_service() → yield → ready</text>

  <!-- ===== CLIENT ===== -->
  <rect x="20" y="390" width="810" height="100" rx="8" fill="#F3E5F5" stroke="#AB47BC" stroke-width="2"/>
  <text x="425" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#6A1B9A">DeerFlowClient — 进程内嵌入式路径 (零服务)</text>

  <rect x="100" y="428" width="650" height="52" rx="5" fill="#E1BEE7"/>
  <text x="425" y="448" text-anchor="middle" font-size="10" fill="#4A148C">from deerflow.client import DeerFlowClient  →  client = DeerFlowClient()  →  client.chat("hello", thread_id="t1")</text>
  <text x="425" y="466" text-anchor="middle" font-size="8" fill="#6A1B9A">与 Gateway 共享同一套底层: get_app_config() → create_chat_model() → get_available_tools() → _build_middlewares() → create_agent() → agent.astream()</text>
  <text x="425" y="480" text-anchor="middle" font-size="7" fill="#CE93D8">无 HTTP · 无 Nginx · 无 FastAPI · 纯 Python 进程内 · 适合脚本和自动化</text>

  <!-- Config load note at bottom -->
  <rect x="100" y="490" width="650" height="20" rx="3" fill="#ECEFF1"/>
  <text x="425" y="504" text-anchor="middle" font-size="8" fill="#78909C">Config 加载顺序: load_dotenv() → DEER_FLOW_CONFIG_PATH → config.yaml → config.example.yaml (version check) → extensions_config.json → .env</text>
</svg>
