<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 960" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#64748b"/>
    </marker>
    <marker id="arrowDownBlue" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#3b82f6"/>
    </marker>
    <marker id="arrowDownGreen" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#22c55e"/>
    </marker>
    <marker id="arrowDownOrange" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1050" height="960" rx="12" fill="url(#bg)"/>
  <text x="525" y="34" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">Agent Run 的精确时序：从 User Message 到 stream end</text>

  <!-- ============================================================ -->
  <!-- USER INPUT -->
  <!-- ============================================================ -->
  <rect x="370" y="55" width="200" height="32" rx="16" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
  <text x="470" y="76" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">User Message Arrives</text>
  <line x1="470" y1="87" x2="470" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- ============================================================ -->
  <!-- run_agent() SECTION -->
  <!-- ============================================================ -->
  <rect x="40" y="112" width="860" height="188" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="40" y="112" width="270" height="26" rx="8" fill="#f59e0b" opacity="0.15"/>
  <rect x="40" y="128" width="270" height="10" fill="#f59e0b" opacity="0.15"/>
  <text x="55" y="130" fill="#fbbf24" font-size="11" font-weight="bold">run_agent() — 运行前准备</text>

  <!-- Step 1 -->
  <rect x="60" y="150" width="240" height="26" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="180" y="168" text-anchor="middle" fill="#cbd5e1" font-size="8">1. 快照当前 checkpoint（用于 rollback）</text>
  <line x1="300" y1="163" x2="322" y2="163" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <!-- Step 2 -->
  <rect x="325" y="150" width="240" height="26" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="445" y="168" text-anchor="middle" fill="#cbd5e1" font-size="8">2. 构建 runtime context → 注入 __pregel_runtime</text>
  <line x1="565" y1="163" x2="587" y2="163" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <!-- Step 3 -->
  <rect x="590" y="150" width="250" height="26" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="715" y="168" text-anchor="middle" fill="#cbd5e1" font-size="8">3. agent_factory(config) → 构造 graph + 18 middleware</text>

  <!-- Step 4+5 -->
  <rect x="60" y="186" width="200" height="26" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="160" y="204" text-anchor="middle" fill="#cbd5e1" font-size="8">4. agent.checkpointer = checkpointer</text>
  <line x1="260" y1="199" x2="282" y2="199" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="285" y="186" width="220" height="26" rx="4" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <text x="395" y="204" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">5. agent.astream(graph_input, ...)</text>

  <!-- arrow down into graph -->
  <line x1="395" y1="215" x2="395" y2="242" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowDownOrange)"/>

  <!-- checkpoint snapshot -->
  <rect x="600" y="186" width="280" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="740" y="204" text-anchor="middle" fill="#94a3b8" font-size="7">记录 pre_run_checkpoint_id</text>
  <text x="740" y="218" text-anchor="middle" fill="#94a3b8" font-size="7">如果 abort_action == "rollback" 则恢复到此</text>

  <!-- ============================================================ -->
  <!-- LangGraph Graph Internal box -->
  <!-- ============================================================ -->
  <rect x="80" y="248" width="780" height="470" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <rect x="80" y="248" width="780" height="26" rx="8" fill="#3b82f6" opacity="0.12"/>
  <rect x="80" y="264" width="780" height="10" fill="#3b82f6" opacity="0.12"/>
  <text x="100" y="267" fill="#60a5fa" font-size="11" font-weight="bold">LangGraph Compiled Graph 内部 — agent.astream() 迭代</text>

  <!-- before_agent hooks -->
  <rect x="100" y="280" width="740" height="34" rx="5" fill="#0f2744" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="120" y="302" fill="#60a5fa" font-size="9" font-weight="bold">before_agent hooks</text>
  <text x="270" y="302" fill="#94a3b8" font-size="8">18 条 middleware 逐个执行 before_agent (正向 1→18)  ·  每 run 仅一次</text>
  <line x1="470" y1="314" x2="470" y2="332" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrowDownBlue)"/>

  <!-- ========== ONE CYCLE ========== -->
  <rect x="120" y="336" width="700" height="280" rx="6" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="130" y="336" width="320" height="18" rx="6" fill="#22c55e" opacity="0.12"/>
  <text x="142" y="349" fill="#4ade80" font-size="9" font-weight="bold">◄ 每一圈的精确执行顺序（循环直到无 tool_calls）►</text>

  <!-- before_model -->
  <rect x="160" y="362" width="620" height="28" rx="4" fill="#0a1a0a" stroke="#22c55e" stroke-width="0.8"/>
  <text x="180" y="381" fill="#4ade80" font-size="9" font-weight="bold">before_model hooks</text>
  <text x="340" y="381" fill="#94a3b8" font-size="8">正向 1→18  ·  3-5 middleware 在此 hook：DynamicContext 注入日期记忆、Summarization 裁剪历史</text>
  <line x1="470" y1="390" x2="470" y2="406" stroke="#22c55e" stroke-width="1" marker-end="url(#arrowDownGreen)"/>

  <!-- wrap_model_call onion -->
  <rect x="160" y="410" width="620" height="40" rx="4" fill="#2a1a00" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="180" y="428" fill="#fbbf24" font-size="9" font-weight="bold">wrap_model_call 洋葱</text>
  <text x="340" y="428" fill="#94a3b8" font-size="8">m1.wrap(m2.wrap(m3.wrap( ... m18.wrap(</text>
  <text x="642" y="428" fill="#f59e0b" font-size="8" font-weight="bold">LLM.call()</text>
  <text x="730" y="428" fill="#94a3b8" font-size="8">)...)))  内联嵌套，不是 graph node</text>
  <line x1="470" y1="450" x2="470" y2="466" stroke="#f59e0b" stroke-width="1" marker-end="url(#arrowDownOrange)"/>

  <!-- after_model -->
  <rect x="160" y="470" width="620" height="28" rx="4" fill="#2a0010" stroke="#ef4444" stroke-width="0.8"/>
  <text x="180" y="489" fill="#fca5a5" font-size="9" font-weight="bold">after_model hooks</text>
  <text x="340" y="489" fill="#94a3b8" font-size="8">反向 18→1  ·  LoopDetection 检测重复调用、SubagentLimit 截断超限、Safety 处理 provider 拒绝</text>

  <!-- branch point -->
  <line x1="470" y1="498" x2="470" y2="520" stroke="#64748b" stroke-width="1"/>
  <rect x="430" y="515" width="80" height="18" rx="9" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/>
  <text x="470" y="528" text-anchor="middle" fill="#94a3b8" font-size="7">有 tool_calls?</text>

  <!-- YES branch (left) -->
  <line x1="430" y1="524" x2="260" y2="524" stroke="#22c55e" stroke-width="1.2"/>
  <line x1="260" y1="524" x2="260" y2="548" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrowDownGreen)"/>

  <!-- wrap_tool_call onion -->
  <rect x="180" y="552" width="580" height="40" rx="4" fill="#0a1a0a" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="200" y="570" fill="#4ade80" font-size="9" font-weight="bold">wrap_tool_call 洋葱（每个 tool 独立）</text>
  <text x="410" y="570" fill="#94a3b8" font-size="8">m1.wrap(m2.wrap(... tool.invoke(args) ...))  每个 tool_call 都穿一遍</text>
  <line x1="260" y1="592" x2="260" y2="610" stroke="#22c55e" stroke-width="1" marker-end="url(#arrowDownGreen)"/>

  <!-- collect ToolMessages + loop back -->
  <rect x="180" y="614" width="580" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="200" y="633" fill="#cbd5e1" font-size="8">收集 ToolMessage → 检查 abort_event → 回到 before_model（下一圈）</text>

  <!-- loop back arrow (right side) -->
  <path d="M 760 628 L 820 628 L 820 376 L 785 376" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowDownGreen)"/>
  <text x="826" y="500" fill="#4ade80" font-size="7" transform="rotate(-90, 826, 500)">循环回到 before_model</text>

  <!-- NO branch (right) -->
  <line x1="510" y1="524" x2="680" y2="524" stroke="#ef4444" stroke-width="1.2"/>
  <line x1="680" y1="524" x2="680" y2="662" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arrowDownGreen)"/>

  <!-- END state -->
  <rect x="635" y="666" width="90" height="26" rx="13" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
  <text x="680" y="684" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">END</text>

  <!-- ============================================================ -->
  <!-- Cleanup section -->
  <!-- ============================================================ -->
  <line x1="680" y1="718" x2="680" y2="742" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowDown)"/>

  <rect x="40" y="748" width="860" height="90" rx="8" fill="none" stroke="#64748b" stroke-width="1"/>
  <rect x="40" y="748" width="200" height="24" rx="8" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="55" y="764" fill="#94a3b8" font-size="9" font-weight="bold">run_agent() — 运行后清理</text>

  <!-- cleanup steps -->
  <rect x="60" y="782" width="180" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="150" y="798" text-anchor="middle" fill="#cbd5e1" font-size="7">6. Flush journal · 持久化 token</text>
  <line x1="240" y1="794" x2="258" y2="794" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="260" y="782" width="180" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="350" y="798" text-anchor="middle" fill="#cbd5e1" font-size="7">7. Sync thread title → thread_meta</text>
  <line x1="440" y1="794" x2="458" y2="794" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="460" y="782" width="200" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
  <text x="560" y="798" text-anchor="middle" fill="#cbd5e1" font-size="7">8. Update thread status → "idle"</text>
  <line x1="660" y1="794" x2="678" y2="794" stroke="#64748b" stroke-width="1" marker-end="url(#arrowRight)"/>

  <rect x="680" y="782" width="200" height="24" rx="4" fill="#ef4444" opacity="0.12" stroke="#ef4444" stroke-width="0.8"/>
  <text x="780" y="798" text-anchor="middle" fill="#fca5a5" font-size="8">9. bridge.publish_end(run_id)</text>

  <!-- ============================================================ -->
  <!-- Right side annotations -->
  <!-- ============================================================ -->
  <!-- abort detection -->
  <rect x="920" y="360" width="120" height="50" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="0.8"/>
  <text x="980" y="378" text-anchor="middle" fill="#fca5a5" font-size="7" font-weight="bold">abort 检测</text>
  <text x="980" y="392" text-anchor="middle" fill="#94a3b8" font-size="6">每圈 astream 边界</text>
  <text x="980" y="404" text-anchor="middle" fill="#94a3b8" font-size="6">都检查 abort_event</text>

  <line x1="920" y1="380" x2="880" y2="380" stroke="#ef4444" stroke-width="0.6" stroke-dasharray="3,2"/>

  <!-- AE annotation -->
  <text x="920" y="500" fill="#94a3b8" font-size="7">中止策略:</text>
  <text x="920" y="514" fill="#94a3b8" font-size="7">interrupt → 保留 checkpoint</text>
  <text x="920" y="528" fill="#94a3b8" font-size="7">rollback → 恢复 pre-run ckpt</text>
</svg>
