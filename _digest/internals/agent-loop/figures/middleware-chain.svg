<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 7, 5 7, 5 0" fill="#64748b"/>
    </marker>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="1000" rx="12" fill="url(#bg)"/>

  <text x="600" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">Middleware 链：19 个 Middleware × 6 种 Hook 点</text>

  <!-- Legend -->
  <rect x="30" y="52" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text x="50" y="64" fill="#94a3b8" font-size="10">before_agent (5)</text>
  <rect x="155" y="52" width="14" height="14" rx="3" fill="#22c55e"/>
  <text x="175" y="64" fill="#94a3b8" font-size="10">before_model (3)</text>
  <rect x="290" y="52" width="14" height="14" rx="3" fill="#f59e0b"/>
  <text x="310" y="64" fill="#94a3b8" font-size="10">wrap_model_call (5)</text>
  <rect x="450" y="52" width="14" height="14" rx="3" fill="#ef4444"/>
  <text x="470" y="64" fill="#94a3b8" font-size="10">after_model (6)</text>
  <rect x="590" y="52" width="14" height="14" rx="3" fill="#8b5cf6"/>
  <text x="610" y="64" fill="#94a3b8" font-size="10">wrap_tool_call (5)</text>
  <rect x="730" y="52" width="14" height="14" rx="3" fill="#ec4899"/>
  <text x="750" y="64" fill="#94a3b8" font-size="10">after_agent (3)</text>
  <rect x="870" y="52" width="14" height="14" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="890" y="64" fill="#94a3b8" font-size="10">core node</text>

  <!-- ===== LEFT: Agent Loop Flow ===== -->
  <text x="60" y="98" fill="#f1f5f9" font-size="13" font-weight="bold">Agent Loop</text>

  <!-- START -->
  <rect x="60" y="110" width="90" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="105" y="130" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="bold">START</text>
  <line x1="150" y1="125" x2="185" y2="125" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- before_agent node -->
  <rect x="190" y="95" width="200" height="60" rx="8" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="290" y="115" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">before_agent</text>
  <text x="290" y="132" text-anchor="middle" fill="#94a3b8" font-size="9">0→N 正向 · Graph Node</text>
  <text x="290" y="147" text-anchor="middle" fill="#64748b" font-size="8">5 middleware</text>
  <line x1="390" y1="125" x2="425" y2="125" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- before_model node -->
  <rect x="430" y="95" width="200" height="60" rx="8" fill="#0a1a0a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="530" y="115" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="bold">before_model</text>
  <text x="530" y="132" text-anchor="middle" fill="#94a3b8" font-size="9">0→N 正向 · Graph Node</text>
  <text x="530" y="147" text-anchor="middle" fill="#64748b" font-size="8">3 middleware</text>
  <line x1="630" y1="125" x2="665" y2="125" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- wrap_model_call onion -->
  <rect x="670" y="92" width="220" height="66" rx="8" fill="#2a1a00" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="780" y="114" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">wrap_model_call</text>
  <text x="780" y="132" text-anchor="middle" fill="#94a3b8" font-size="9">内联洋葱 · 正向 0→N</text>
  <text x="780" y="148" text-anchor="middle" fill="#64748b" font-size="8">5 middleware</text>
  <line x1="890" y1="125" x2="920" y2="125" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- LLM Call -->
  <rect x="925" y="100" width="140" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="995" y="121" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="bold">LLM Call</text>
  <text x="995" y="140" text-anchor="middle" fill="#94a3b8" font-size="9">model.invoke()</text>

  <!-- Arrow down from LLM -->
  <line x1="995" y1="150" x2="995" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- after_model node (reverse) -->
  <rect x="770" y="185" width="200" height="60" rx="8" fill="#2a0000" stroke="#ef4444" stroke-width="1.5"/>
  <text x="870" y="205" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">after_model</text>
  <text x="870" y="222" text-anchor="middle" fill="#94a3b8" font-size="9">N→0 反向 · Graph Node</text>
  <text x="870" y="237" text-anchor="middle" fill="#64748b" font-size="8">6 middleware</text>

  <!-- Decision -->
  <line x1="870" y1="245" x2="870" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <rect x="800" y="274" width="140" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="870" y="293" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">has tool_calls?</text>

  <!-- YES branch → wrap_tool_call -->
  <line x1="940" y1="288" x2="1000" y2="288" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="965" y="282" fill="#22c55e" font-size="9">yes</text>

  <!-- wrap_tool_call onion -->
  <rect x="1005" y="258" width="170" height="60" rx="8" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="1090" y="280" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">wrap_tool_call</text>
  <text x="1090" y="296" text-anchor="middle" fill="#94a3b8" font-size="9">内联洋葱 · 5 mw</text>
  <text x="1090" y="310" text-anchor="middle" fill="#64748b" font-size="8">可短路不调handler</text>

  <!-- Tool Execute -->
  <line x1="1090" y1="318" x2="1090" y2="345" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <rect x="1020" y="349" width="140" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="1090" y="372" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="bold">Tool Execute</text>

  <!-- Loop back -->
  <line x1="1020" y1="367" x2="60" y2="367" stroke="#22c55e" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="60" y1="367" x2="60" y2="125" stroke="#22c55e" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowRight)"/>
  <text x="540" y="360" text-anchor="middle" fill="#4ade80" font-size="9">loop → before_model</text>

  <!-- NO branch → after_agent -->
  <line x1="800" y1="288" x2="750" y2="288" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="765" y="282" fill="#ef4444" font-size="9">no</text>
  <line x1="750" y1="288" x2="750" y2="395" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- after_agent node (reverse) -->
  <rect x="640" y="399" width="220" height="60" rx="8" fill="#1a0020" stroke="#ec4899" stroke-width="1.5"/>
  <text x="750" y="419" text-anchor="middle" fill="#f9a8d4" font-size="11" font-weight="bold">after_agent</text>
  <text x="750" y="436" text-anchor="middle" fill="#94a3b8" font-size="9">N→0 反向 · Graph Node</text>
  <text x="750" y="451" text-anchor="middle" fill="#64748b" font-size="8">3 middleware</text>

  <!-- END -->
  <line x1="750" y1="459" x2="750" y2="490" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <rect x="700" y="494" width="100" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="750" y="514" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="bold">END</text>

  <!-- Key design notes -->
  <rect x="60" y="170" width="500" height="105" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="75" y="190" fill="#f1f5f9" font-size="11" font-weight="bold">六种 Hook 点设计</text>
  <text x="75" y="210" fill="#94a3b8" font-size="9.5">• before_agent / before_model — 正向 Graph Node，edge 串联，返回 dict 被 reducer 合并</text>
  <text x="75" y="227" fill="#94a3b8" font-size="9.5">• wrap_model_call / wrap_tool_call — 内联洋葱，外层包内层，可短路不调 handler()</text>
  <text x="75" y="244" fill="#94a3b8" font-size="9.5">• after_model / after_agent — 反向 Graph Node（N→0），最后注册的最先执行</text>
  <text x="75" y="261" fill="#64748b" font-size="9">setup/teardown 对称：Sandbox=before_agent(acquire) + after_agent(release)，LoopDetection=before_agent(清理) + after_model(检测) + after_agent(清理)</text>

  <!-- ===== RIGHT: middleware catalog ===== -->
  <rect x="60" y="540" width="1080" height="440" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="600" y="566" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold">Middleware 目录（按编号 × Hook 点）</text>

  <!-- Row 1: 0-4 -->
  <rect x="78" y="580" width="200" height="52" rx="5" fill="#0f2744" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="178" y="598" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">0. ThreadData</text>
  <text x="178" y="614" text-anchor="middle" fill="#94a3b8" font-size="8.5">before_agent</text>
  <text x="178" y="628" text-anchor="middle" fill="#64748b" font-size="8">per-thread 目录 · user_id</text>

  <rect x="285" y="580" width="200" height="52" rx="5" fill="#0f2744" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="385" y="598" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">1. Uploads</text>
  <text x="385" y="614" text-anchor="middle" fill="#94a3b8" font-size="8.5">before_agent</text>
  <text x="385" y="628" text-anchor="middle" fill="#64748b" font-size="8">上传文件注入</text>

  <rect x="492" y="580" width="200" height="52" rx="5" fill="#0f2744" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="592" y="598" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">2. Sandbox</text>
  <text x="592" y="614" text-anchor="middle" fill="#94a3b8" font-size="8.5">before_agent · after_agent</text>
  <text x="592" y="628" text-anchor="middle" fill="#64748b" font-size="8">acquire/release · lazy_init</text>

  <rect x="699" y="580" width="200" height="52" rx="5" fill="#2a1a00" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="799" y="598" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">3. DanglingToolCall</text>
  <text x="799" y="614" text-anchor="middle" fill="#94a3b8" font-size="8.5">wrap_model_call</text>
  <text x="799" y="628" text-anchor="middle" fill="#64748b" font-size="8">修复消息序列</text>

  <rect x="906" y="580" width="200" height="52" rx="5" fill="#2a1a00" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="1006" y="598" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">4. LLMErrorHandling</text>
  <text x="1006" y="614" text-anchor="middle" fill="#94a3b8" font-size="8.5">wrap_model_call</text>
  <text x="1006" y="628" text-anchor="middle" fill="#64748b" font-size="8">重试 · 熔断器</text>

  <!-- Row 2: 5-9 -->
  <rect x="78" y="640" width="200" height="52" rx="5" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="178" y="658" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">5. Guardrail</text>
  <text x="178" y="674" text-anchor="middle" fill="#94a3b8" font-size="8.5">wrap_tool_call</text>
  <text x="178" y="688" text-anchor="middle" fill="#64748b" font-size="8">可插拔授权 · fail_closed</text>

  <rect x="285" y="640" width="200" height="52" rx="5" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="385" y="658" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">6. SandboxAudit</text>
  <text x="385" y="674" text-anchor="middle" fill="#94a3b8" font-size="8.5">wrap_tool_call</text>
  <text x="385" y="688" text-anchor="middle" fill="#64748b" font-size="8">bash regex · block/warn</text>

  <rect x="492" y="640" width="200" height="52" rx="5" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="592" y="658" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">7. ToolErrorHandling</text>
  <text x="592" y="674" text-anchor="middle" fill="#94a3b8" font-size="8.5">wrap_tool_call</text>
  <text x="592" y="688" text-anchor="middle" fill="#64748b" font-size="8">异常→error ToolMessage</text>

  <rect x="699" y="640" width="200" height="52" rx="5" fill="#0f2744" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="799" y="658" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">8. DynamicContext</text>
  <text x="799" y="674" text-anchor="middle" fill="#94a3b8" font-size="8.5">before_agent</text>
  <text x="799" y="688" text-anchor="middle" fill="#64748b" font-size="8">日期 · memory 上下文</text>

  <rect x="906" y="640" width="200" height="52" rx="5" fill="#0a1a0a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="1006" y="658" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">9. Summarization</text>
  <text x="1006" y="674" text-anchor="middle" fill="#94a3b8" font-size="8.5">before_model</text>
  <text x="1006" y="688" text-anchor="middle" fill="#64748b" font-size="8">压缩 · skill rescue</text>

  <!-- Row 3: 10-14 -->
  <rect x="78" y="700" width="200" height="52" rx="5" fill="#0a1a0a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="178" y="718" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">10. Todo</text>
  <text x="178" y="734" text-anchor="middle" fill="#94a3b8" font-size="8.5">before_model · after_model · wrap_model_call</text>
  <text x="178" y="748" text-anchor="middle" fill="#64748b" font-size="8">plan mode · 防提前退出</text>

  <rect x="285" y="700" width="200" height="52" rx="5" fill="#2a0000" stroke="#ef4444" stroke-width="0.5"/>
  <text x="385" y="718" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">11. TokenUsage</text>
  <text x="385" y="734" text-anchor="middle" fill="#94a3b8" font-size="8.5">after_model</text>
  <text x="385" y="748" text-anchor="middle" fill="#64748b" font-size="8">token 统计 · todo diff</text>

  <rect x="492" y="700" width="200" height="52" rx="5" fill="#2a0000" stroke="#ef4444" stroke-width="0.5"/>
  <text x="592" y="718" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">12. Title</text>
  <text x="592" y="734" text-anchor="middle" fill="#94a3b8" font-size="8.5">after_model</text>
  <text x="592" y="748" text-anchor="middle" fill="#64748b" font-size="8">自动标题</text>

  <rect x="699" y="700" width="200" height="52" rx="5" fill="#1a0020" stroke="#ec4899" stroke-width="0.5"/>
  <text x="799" y="718" text-anchor="middle" fill="#f9a8d4" font-size="10" font-weight="bold">13. Memory</text>
  <text x="799" y="734" text-anchor="middle" fill="#94a3b8" font-size="8.5">after_agent</text>
  <text x="799" y="748" text-anchor="middle" fill="#64748b" font-size="8">异步 memory update</text>

  <rect x="906" y="700" width="200" height="52" rx="5" fill="#0a1a0a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="1006" y="718" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">14. ViewImage</text>
  <text x="1006" y="734" text-anchor="middle" fill="#94a3b8" font-size="8.5">before_model</text>
  <text x="1006" y="748" text-anchor="middle" fill="#64748b" font-size="8">vision 自动注入</text>

  <!-- Row 4: 15-19 -->
  <rect x="78" y="760" width="200" height="52" rx="5" fill="#2a1a00" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="178" y="778" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">15. DeferredToolFilter</text>
  <text x="178" y="794" text-anchor="middle" fill="#94a3b8" font-size="8.5">wrap_model_call · wrap_tool_call</text>
  <text x="178" y="808" text-anchor="middle" fill="#64748b" font-size="8">MCP deferred tools</text>

  <rect x="285" y="760" width="200" height="52" rx="5" fill="#2a0000" stroke="#ef4444" stroke-width="0.5"/>
  <text x="385" y="778" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">16. SubagentLimit</text>
  <text x="385" y="794" text-anchor="middle" fill="#94a3b8" font-size="8.5">after_model</text>
  <text x="385" y="808" text-anchor="middle" fill="#64748b" font-size="8">截断过多 task 调用</text>

  <rect x="492" y="760" width="200" height="52" rx="5" fill="#2a0000" stroke="#ef4444" stroke-width="0.5"/>
  <text x="592" y="778" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">17. LoopDetection</text>
  <text x="592" y="794" text-anchor="middle" fill="#94a3b8" font-size="8.5">before_agent · after_model · wrap_model_call · after_agent</text>
  <text x="592" y="808" text-anchor="middle" fill="#64748b" font-size="8">hash+频率 · 延迟警告</text>

  <rect x="699" y="760" width="200" height="52" rx="5" fill="#2a0000" stroke="#ef4444" stroke-width="0.5"/>
  <text x="799" y="778" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">18. SafetyFinishReason</text>
  <text x="799" y="794" text-anchor="middle" fill="#94a3b8" font-size="8.5">after_model（最先）</text>
  <text x="799" y="808" text-anchor="middle" fill="#64748b" font-size="8">检测 safety 终止</text>

  <rect x="906" y="760" width="200" height="52" rx="5" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="1006" y="778" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">19. Clarification</text>
  <text x="1006" y="794" text-anchor="middle" fill="#94a3b8" font-size="8.5">wrap_tool_call（永远最后）</text>
  <text x="1006" y="808" text-anchor="middle" fill="#64748b" font-size="8">Command(goto=END)</text>

  <!-- Summary bar -->
  <rect x="78" y="825" width="1045" height="72" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
  <text x="600" y="848" text-anchor="middle" fill="#94a3b8" font-size="9.5">5 个条件性 middleware: Guardrail · Summarization · TokenUsage · LoopDetection · SafetyFinishReason（由 config.yaml 开关）</text>
  <text x="600" y="866" text-anchor="middle" fill="#94a3b8" font-size="9.5">2 个运行时决定: TodoMiddleware(is_plan_mode) · SubagentLimitMiddleware(subagent_enabled)</text>
  <text x="600" y="884" text-anchor="middle" fill="#64748b" font-size="9">ClarificationMiddleware 强制最后 · extra_middleware 在 Clarification 之前插入 · @Next/@Prev 定位系统控制自定义 middleware 位置</text>

  <!-- Hook point summary -->
  <rect x="78" y="905" width="1045" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
  <text x="600" y="922" text-anchor="middle" fill="#64748b" font-size="9.5">Hook 点分布: before_agent=5 · before_model=3 · wrap_model_call=5 · after_model=6(反向) · wrap_tool_call=5 · after_agent=3(反向)</text>
  <text x="600" y="936" text-anchor="middle" fill="#64748b" font-size="9">注: 部分 middleware 注册在多个 hook 点 (Sandbox=2, Todo=3, DeferredToolFilter=2, LoopDetection=4)</text>

</svg>