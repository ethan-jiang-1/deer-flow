<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#555"/>
    </marker>
    <linearGradient id="headerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="channel1Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe0e0"/>
    </linearGradient>
    <linearGradient id="channel2Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7ff"/>
      <stop offset="100%" stop-color="#e0e5ff"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <rect x="0" y="0" width="1200" height="56" fill="url(#headerBg)" rx="8"/>
  <rect x="0" y="40" width="1200" height="16" fill="url(#headerBg)"/>
  <text x="600" y="36" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">LLM 怎么知道 subagent 类型？ — 两个信息源</text>

  <!-- ===== CHANNEL 1: Tool Schema (left) ===== -->
  <rect x="30" y="76" width="480" height="530" rx="10" fill="url(#channel1Bg)" stroke="#e57373" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="76" width="480" height="38" rx="10" fill="#e57373"/>
  <rect x="30" y="100" width="480" height="14" fill="#e57373"/>
  <text x="270" y="100" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Channel 1: Tool Schema（工具描述）</text>

  <!-- Step 1: Decorator -->
  <text x="50" y="142" fill="#c62828" font-size="13" font-weight="700">① @tool 装饰器提取 docstring</text>
  <rect x="50" y="152" width="440" height="62" rx="6" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="65" y="172" font-size="11" font-family="monospace" fill="#555">@tool("task", parse_docstring=True)</text>
  <text x="65" y="190" font-size="11" font-family="monospace" fill="#555">async def task_tool(description, prompt, subagent_type, ...):</text>
  <text x="65" y="207" font-size="11" fill="#888">task_tool.py:186</text>

  <!-- Arrow 1→2 -->
  <line x1="270" y1="214" x2="270" y2="232" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- Step 2: Docstring content -->
  <text x="50" y="252" fill="#c62828" font-size="13" font-weight="700">② docstring = 工具的 description 字段</text>
  <rect x="50" y="262" width="440" height="132" rx="6" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="65" y="282" font-size="11" font-family="monospace" fill="#333">"""Delegate a task to a specialized subagent...</text>
  <text x="65" y="300" font-size="11" font-family="monospace" fill="#444">Built-in subagent types:</text>
  <text x="65" y="316" font-size="11" font-family="monospace" fill="#c62828">  - general-purpose: A capable agent for complex,</text>
  <text x="65" y="332" font-size="11" font-family="monospace" fill="#c62828">    multi-step tasks that require both exploration</text>
  <text x="65" y="348" font-size="11" font-family="monospace" fill="#c62828">    and action...</text>
  <text x="65" y="364" font-size="11" font-family="monospace" fill="#c62828">  - bash: Command execution specialist...</text>
  <text x="65" y="380" font-size="11" font-family="monospace" fill="#999">  Additional custom subagent types may be defined</text>
  <text x="65" y="396" font-size="11" font-family="monospace" fill="#999">  in config.yaml...</text>

  <!-- Arrow 2→3 -->
  <line x1="270" y1="394" x2="270" y2="412" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- Step 3: Bound to model -->
  <text x="50" y="432" fill="#c62828" font-size="13" font-weight="700">③ 绑定到 model 的 function-calling schema</text>
  <rect x="50" y="442" width="440" height="34" rx="6" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="65" y="464" font-size="11" fill="#555">create_agent(model, tools=[..., task_tool, ...]) → LLM 在 function-calling 参数里看到它</text>

  <!-- Arrow to center -->
  <line x1="510" y1="341" x2="570" y2="341" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRight)" stroke-dasharray="6,3"/>

  <!-- Key callout -->
  <rect x="50" y="492" width="440" height="100" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="65" y="514" font-size="12" font-weight="700" fill="#e65100">⚠ 硬编码</text>
  <text x="65" y="534" font-size="11" fill="#555">builtins (general-purpose, bash) 的描述写死在 docstring。</text>
  <text x="65" y="554" font-size="11" fill="#555">自定义 agent 只提了一句 "may be defined in config.yaml" — 不列出名字。</text>
  <text x="65" y="574" font-size="11" fill="#e65100" font-weight="600">→ LLM 仅通过 Channel 1 不知道有哪些自定义 subagent。</text>

  <!-- ===== CHANNEL 2: System Prompt (right) ===== -->
  <rect x="690" y="76" width="480" height="530" rx="10" fill="url(#channel2Bg)" stroke="#5c6bc0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="690" y="76" width="480" height="38" rx="10" fill="#5c6bc0"/>
  <rect x="690" y="100" width="480" height="14" fill="#5c6bc0"/>
  <text x="930" y="100" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Channel 2: System Prompt（系统提示词）</text>

  <!-- Step 1: Placeholder -->
  <text x="710" y="142" fill="#283593" font-size="13" font-weight="700">① prompt 模板中有 {subagent_section} 占位符</text>
  <rect x="710" y="152" width="440" height="40" rx="6" fill="#fff" stroke="#9fa8da" stroke-width="1"/>
  <text x="725" y="170" font-size="11" font-family="monospace" fill="#555">apply_prompt_template() 在 graph 构建时填充 →</text>
  <text x="725" y="187" font-size="11" font-family="monospace" fill="#555">调用 _build_subagent_section()</text>

  <!-- Arrow 1→2 -->
  <line x1="930" y1="192" x2="930" y2="210" stroke="#283593" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- Step 2: Dynamic resolution -->
  <text x="710" y="230" fill="#283593" font-size="13" font-weight="700">② _build_available_subagents_description() 动态解析</text>
  <rect x="710" y="240" width="440" height="100" rx="6" fill="#fff" stroke="#9fa8da" stroke-width="1"/>
  <text x="725" y="260" font-size="11" font-family="monospace" fill="#333">for name in get_available_subagent_names():</text>
  <text x="725" y="278" font-size="11" font-family="monospace" fill="#283593">    if name in builtin_descriptions:         ← 内置用hardcoded dict</text>
  <text x="725" y="296" font-size="11" font-family="monospace" fill="#2e7d32">    else:</text>
  <text x="725" y="314" font-size="11" font-family="monospace" fill="#2e7d32">        config = get_subagent_config(name)    ← 自定义读 SubagentConfig</text>
  <text x="725" y="332" font-size="11" font-family="monospace" fill="#2e7d32">        desc = config.description.split("\n")[0]  ← 只取第一行</text>

  <!-- Arrow 2→3 -->
  <line x1="930" y1="340" x2="930" y2="358" stroke="#283593" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- Step 3: Prompt content -->
  <text x="710" y="378" fill="#283593" font-size="13" font-weight="700">③ 注入 system prompt 的 &lt;subagent_system&gt; 块</text>
  <rect x="710" y="388" width="440" height="64" rx="6" fill="#fff" stroke="#9fa8da" stroke-width="1"/>
  <text x="725" y="408" font-size="11" font-family="monospace" fill="#555">&lt;subagent_system&gt;</text>
  <text x="725" y="426" font-size="11" font-family="monospace" fill="#333">Available Subagents:</text>
  <text x="725" y="444" font-size="11" font-family="monospace" fill="#283593">- general-purpose: For ANY non-trivial task —</text>
  <text x="725" y="444" font-size="11" font-family="monospace" fill="#283593" dx="30" dy="16">web research, code exploration, file operations,</text>
  <text x="725" y="444" font-size="11" font-family="monospace" fill="#283593" dx="30" dy="32">analysis, etc.</text>

  <!-- Arrow to center -->
  <line x1="690" y1="341" x2="630" y2="341" stroke="#283593" stroke-width="2" marker-end="url(#arrowLeft)" stroke-dasharray="6,3"/>

  <!-- Key callout -->
  <rect x="710" y="468" width="440" height="124" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1"/>
  <text x="725" y="490" font-size="12" font-weight="700" fill="#2e7d32">✓ 动态解析</text>
  <text x="725" y="510" font-size="11" fill="#555">builtins: 从 builtin_descriptions 字典取（prompt.py:190）</text>
  <text x="725" y="530" font-size="11" fill="#555">自定义: 从 registry 取 SubagentConfig，只展示 description 第一行</text>
  <text x="725" y="555" font-size="11" fill="#2e7d32" font-weight="600">→ LLM 通过 Channel 2 看到所有可用 subagent 类型及描述。</text>
  <text x="725" y="580" font-size="11" fill="#888">另外 system prompt 还教 LLM 何时用/不用 task、并发限制、分批策略。</text>

  <!-- ===== CENTER: LLM ===== -->
  <rect x="540" y="310" width="120" height="62" rx="31" fill="#1a1a2e" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="336" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">LLM</text>
  <text x="600" y="356" text-anchor="middle" fill="#aaa" font-size="10">两个来源合并</text>

  <!-- ===== BOTTOM: Three Descriptions Comparison ===== -->
  <rect x="30" y="626" width="1140" height="254" rx="10" fill="#fff" stroke="#ddd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="652" text-anchor="middle" fill="#333" font-size="15" font-weight="700">三套描述对比 — 同一个 subagent (general-purpose)，三个地方写了三套文字</text>

  <!-- Column headers -->
  <rect x="50" y="666" width="350" height="30" rx="5" fill="#ffcdd2"/>
  <text x="225" y="686" text-anchor="middle" fill="#c62828" font-size="12" font-weight="700">Tool Docstring (task_tool.py:201)</text>

  <rect x="425" y="666" width="350" height="30" rx="5" fill="#c5cae9"/>
  <text x="600" y="686" text-anchor="middle" fill="#283593" font-size="12" font-weight="700">System Prompt Dict (prompt.py:191)</text>

  <rect x="800" y="666" width="350" height="30" rx="5" fill="#e0e0e0"/>
  <text x="975" y="686" text-anchor="middle" fill="#616161" font-size="12" font-weight="700">SubagentConfig.description (general_purpose.py:7)</text>

  <!-- Column 1: Tool Docstring -->
  <rect x="50" y="700" width="350" height="90" rx="5" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="65" y="720" font-size="10.5" fill="#555">A capable agent for complex, multi-step tasks</text>
  <text x="65" y="738" font-size="10.5" fill="#555">that require both exploration and action. Use</text>
  <text x="65" y="756" font-size="10.5" fill="#555">when the task requires complex reasoning,</text>
  <text x="65" y="774" font-size="10.5" fill="#555">multiple dependent steps, or would benefit</text>
  <text x="65" y="792" font-size="10.5" fill="#555">from isolated context.</text>

  <!-- Column 2: System Prompt Dict -->
  <rect x="425" y="700" width="350" height="90" rx="5" fill="#fff" stroke="#9fa8da" stroke-width="1"/>
  <text x="440" y="720" font-size="10.5" fill="#555">For ANY non-trivial task — web research,</text>
  <text x="440" y="738" font-size="10.5" fill="#555">code exploration, file operations, analysis,</text>
  <text x="440" y="756" font-size="10.5" fill="#555">etc.</text>

  <!-- Column 3: SubagentConfig.description -->
  <rect x="800" y="700" width="350" height="90" rx="5" fill="#fff" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="815" y="720" font-size="10.5" fill="#999">A capable agent for complex, multi-step</text>
  <text x="815" y="738" font-size="10.5" fill="#999">tasks that require both exploration and</text>
  <text x="815" y="756" font-size="10.5" fill="#999">action. Use when: complex reasoning,</text>
  <text x="815" y="774" font-size="10.5" fill="#999">multiple dependent steps, isolated context.</text>

  <!-- Row annotations -->
  <text x="225" y="807" text-anchor="middle" font-size="10" fill="#c62828">✓ 绑定到 model tools schema</text>
  <text x="600" y="807" text-anchor="middle" font-size="10" fill="#283593">✓ 注入 system prompt</text>
  <text x="975" y="807" text-anchor="middle" font-size="10" fill="#999">✗ builtins 永远读不到这里</text>

  <!-- Bottom annotation -->
  <rect x="50" y="822" width="1100" height="44" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="600" y="842" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e65100">为什么 SubagentConfig.description 对 builtins 无效？</text>
  <text x="600" y="860" text-anchor="middle" font-size="11" fill="#555">_build_available_subagents_description() 对 builtins 用 builtin_descriptions 字典, 跳过 SubagentConfig.description。</text>
  <text x="600" y="842" text-anchor="middle" font-size="11" fill="#555" dx="0" dy="18">仅自定义 agent （不在 builtin_descriptions 里的 name） 才会读 SubagentConfig.description 的第一行。</text>

  <!-- ===== subagent_enabled master switch ===== -->
  <rect x="360" y="574" width="480" height="34" rx="17" fill="#333" stroke="#555" stroke-width="1"/>
  <text x="600" y="596" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">subagent_enabled=false → 两端同时切断：tool 不绑定 + prompt 不注入</text>

</svg>
