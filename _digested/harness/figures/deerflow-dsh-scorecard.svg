    <rect x="630" y="360" width="530" height="23" fill="#fff3f3"/><text x="636" y="376" fill="#333">RT11 客户端组装纪律（React Query 派生、无边界检查）</text><text x="740" y="376" fill="#555">覆2 · 约1</text><rect x="1120" y="363" width="38" height="17" rx="8.5" fill="#c62828"/><text x="1139" y="376" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">红</text>
