  <text x="315" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">开发 Harness（评仓库）：KN 知识归位 · CP 变更路径 · EV 证据与交付 · ST 状态与上下文 · MT 维护与发布</text>
  <text x="46" y="102" font-size="10" fill="#888">[覆盖 n][约束 n] 红 = 任一轴 ≤ 1</text>

