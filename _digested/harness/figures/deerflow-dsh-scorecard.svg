  <!-- ============ 右面板：运行时侧 11 维 ============ -->
  <rect x="620" y="62" width="550" height="478" rx="8" fill="#fff" stroke="#ad1457" stroke-width="1.4"/>
  <text x="895" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#880e4f">运行时 Harness（评 agent 产品）：AQ1-3 全是 → 形态 = 产品 + 平台 + 多入口</text>
  <text x="636" y="102" font-size="10" fill="#888">静态证据下的预判档（LX1-LX5 未亲跑 → 证据受限）</text>

  <g font-size="11.5">
    <rect x="630" y="110" width="530" height="23" fill="#fff3f3"/><text x="636" y="126" fill="#333">RT1 组合与启动（坏组合拒绝启动；无 dump）</text><text x="740" y="126" fill="#555">覆1 · 约2</text><rect x="1120" y="113" width="38" height="17" rx="8.5" fill="#c62828"/><text x="1139" y="126" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">红</text>
    <rect x="630" y="135" width="530" height="23" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/><text x="636" y="151" fill="#b71c1c" font-weight="700">RT2 会话事实源（system prompt/工具清单不进记录 — 最痛）</text><text x="740" y="151" fill="#555">覆1 · 约1</text><rect x="1120" y="138" width="38" height="17" rx="8.5" fill="#c62828"/><text x="1139" y="151" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">红</text>
    <rect x="630" y="160" width="530" height="23" fill="#f2fff2"/><text x="636" y="176" fill="#333">RT3 格式世代（版本过新 = 拒绝启动，非报损坏）</text><text x="740" y="176" fill="#555">覆2 · 约2</text><rect x="1120" y="163" width="38" height="17" rx="8.5" fill="#2e7d32"/><text x="1139" y="176" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">绿</text>
    <rect x="630" y="185" width="530" height="23" fill="#f2fff2"/><text x="636" y="201" fill="#333">RT4 循环与终结边界（终态封闭集合 + durable 取消）</text><text x="740" y="201" fill="#555">覆3 · 约2</text><rect x="1120" y="188" width="38" height="17" rx="8.5" fill="#2e7d32"/><text x="1139" y="201" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">绿</text>
    <rect x="630" y="210" width="530" height="23" fill="#f2fff2"/><text x="636" y="226" fill="#333">RT5 能力 seam（多后端纯配置切换 — 全卡最强）</text><text x="740" y="226" fill="#555">覆3 · 约2</text><rect x="1120" y="213" width="38" height="17" rx="8.5" fill="#2e7d32"/><text x="1139" y="226" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">绿</text>
