  <!-- 右面板下方的红绿分簇说明 -->
  <rect x="630" y="395" width="530" height="132" rx="8" fill="#fce4ec" stroke="#ad1457" stroke-width="1"/>
  <text x="895" y="416" text-anchor="middle" font-size="12" font-weight="700" fill="#880e4f">运行时侧的红聚成两类</text>
  <text x="644" y="438" font-size="11" fill="#444">「说不清」排障面（3 维）：RT1 生效配置 · RT2 请求重建 · RT7 可见面落盘</text>
  <text x="644" y="458" font-size="11" fill="#444">　→ 共同后果：出问题时无法只靠记录说清「它当时看到了什么、做了什么」</text>
  <text x="644" y="481" font-size="11" fill="#444">「边界靠约定」治理面（3 维）：RT6 扩展点 · RT10 治理 · RT11 客户端边界</text>
  <text x="644" y="501" font-size="11" fill="#444">　→ 共同后果：绕过声明的边界没有东西会拦</text>
  <text x="644" y="522" font-size="11" fill="#1b5e20">绿的五维是架构底子：状态机封闭 · 后端可换 · 入口共语义 · fail-closed · 世代单向</text>

  <!-- ============ 底部结论带 ============ -->
  <rect x="30" y="552" width="1140" height="92" rx="8" fill="#1a1a2e"/>
  <text x="46" y="576" font-size="12" font-weight="700" fill="#fff">开发侧 = MG1 有文档（距 MG2 差一维：快诊六维中约束力 ≥2 的只有 KN1/EV1/ST1 三个）</text>
  <text x="46" y="598" font-size="12" font-weight="700" fill="#fff">运行时侧 = MG1（MG2 被 RT2+RT7 卡住 — 同一缺口的两半）　两侧达标线均未达</text>
  <text x="46" y="622" font-size="11" fill="#b0bec5">最痛三维：开发侧 EV2 负例控制 / KN2 归属 / CP2 正确路径　·　运行时侧 RT2 会话事实源 / RT7 模型可见面 / RT1 组合与启动</text>
  <text x="46" y="640" font-size="11" fill="#b0bec5">一句话诊断：机制覆盖面是范本级、约束力普遍停在「写下来了但拦不住」；EV2 = 0/0 是全卡的根</text>
</svg>
