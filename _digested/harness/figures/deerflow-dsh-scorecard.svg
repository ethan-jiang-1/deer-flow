  <text x="600" y="31" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">DSH 镜片下的 deer-flow（v2.1.0）：28 维红绿结果 — 开发侧 10 红 / 7 绿 · MG1；运行时侧 6 红 / 5 绿 · MG1</text>

