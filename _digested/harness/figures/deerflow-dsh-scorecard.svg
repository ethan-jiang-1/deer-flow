    <rect x="40" y="435" width="550" height="23" fill="#f2fff2"/><text x="46" y="451" fill="#333">ST2 披露与隔离（KiB 预算门禁）</text><text x="150" y="451" fill="#555">覆2 · 约2</text><rect x="545" y="438" width="38" height="17" rx="8.5" fill="#2e7d32"/><text x="564" y="451" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">绿</text>
