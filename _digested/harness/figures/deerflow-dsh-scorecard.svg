    <rect x="630" y="260" width="530" height="23" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/><text x="636" y="276" fill="#b71c1c" font-weight="700">RT7 模型可见面（组装结果只存哈希、不落盘 — 最痛）</text><text x="740" y="276" fill="#555">覆1 · 约1</text><rect x="1120" y="263" width="38" height="17" rx="8.5" fill="#c62828"/><text x="1139" y="276" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">红</text>
