<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 322" font-family="PingFang SC, sans-serif" data-house="v1">
  <title>确定性 LLM 替身谱系</title>
  <desc>同一条断言尽量在更便宜、更确定的一层证明。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker></defs>
  <rect width="1000" height="322" fill="#ffffff"/>
  <text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">确定性 LLM 替身谱系</text>
  <text x="500.0" y="52" text-anchor="middle" font-size="12" fill="#475569">同一条断言尽量在更便宜、更确定的一层证明。</text>
<rect x="30.0" y="104" width="173.6" height="158" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="116.8" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">FakeToolCallingModel</text>
<text x="116.8" y="157" text-anchor="middle" font-size="9.5" fill="#075985">脚本化 tool_calls；零</text>
<text x="116.8" y="172" text-anchor="middle" font-size="9.5" fill="#075985">I/O</text>
<rect x="221.6" y="104" width="173.6" height="158" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="308.4" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">ReplayChatModel</text>
<text x="308.4" y="157" text-anchor="middle" font-size="9.5" fill="#166534">归一化输入哈希 +</text>
<text x="308.4" y="172" text-anchor="middle" font-size="9.5" fill="#166534">caller-aware key</text>
<rect x="413.2" y="104" width="173.6" height="158" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="500.0" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Monocle traces</text>
<text x="500.0" y="157" text-anchor="middle" font-size="9.5" fill="#854d0e">真实 trace 的行为断言</text>
<rect x="604.8" y="104" width="173.6" height="158" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="691.6" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">手动录制</text>
<text x="691.6" y="157" text-anchor="middle" font-size="9.5" fill="#5b21b6">golden JSON；形状断言</text>
<rect x="796.4" y="104" width="173.6" height="158" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="883.2" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">CI 分片</text>
<text x="883.2" y="157" text-anchor="middle" font-size="9.5" fill="#475569">offline-first；</text>
<text x="883.2" y="172" text-anchor="middle" font-size="9.5" fill="#475569">live 仅显式 opt-in</text>
<line x1="205.6" y1="183.0" x2="217.6" y2="183.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="397.2" y1="183.0" x2="409.2" y2="183.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="588.8" y1="183.0" x2="600.8" y2="183.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="780.4" y1="183.0" x2="792.4" y2="183.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="30" y="304" font-size="10" fill="#475569">读法：从左到右是主路径；分支与失败语义回到正文，不在图里堆细节。</text>
</svg>
