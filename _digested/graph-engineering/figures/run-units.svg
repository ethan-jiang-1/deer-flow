<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1100" height="640" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">运行单位状态契约 — 语境规定了 harness 的运行状态</text>
  <text x="24" y="56" font-size="12" fill="#64748b">对应 06-langgraph-capability-surface.md §4 · 每个单位的持久化/隔离/身份/恢复契约由 harness 层决定，LangGraph 被降级为 thread 单位的执行引擎</text>

  <!-- column headers -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="150" y="76" width="220" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="260" y="98" fill="#1e40af">thread（对话）</text>
    <rect x="386" y="76" width="220" height="34" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="496" y="98" fill="#3730a3">run（执行）</text>
    <rect x="622" y="76" width="220" height="34" rx="6" fill="#f0fdf4" stroke="#059669"/>
    <text x="732" y="98" fill="#065f46">subagent execution</text>
    <rect x="858" y="76" width="220" height="34" rx="6" fill="#fffbeb" stroke="#d97706"/>
    <text x="968" y="98" fill="#92400e">batch item</text>
  </g>

  <!-- row labels -->
  <g font-size="12.5" font-weight="700" fill="#475569" text-anchor="end">
    <text x="140" y="152">持久化</text>
    <text x="140" y="262">隔离</text>
    <text x="140" y="372">身份</text>
    <text x="140" y="482">恢复语义</text>
  </g>

  <!-- cells -->
  <g font-size="11" fill="#334155">
    <!-- row 1: persistence -->
    <rect x="150" y="118" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="162" y="140">checkpoint（sqlite/pg）</text>
    <text x="162" y="158">delta O(N) / full 双模式</text>
    <text x="162" y="176">模式标记进 checkpoint 元数据</text>
    <text x="162" y="194">手术必须走变异图（单 no-op 节点）</text>
    <text x="162" y="212" fill="#2563eb">对话是唯一全量持久化单位</text>

    <rect x="386" y="118" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="398" y="140">RunStore 行 + lease</text>
    <text x="398" y="158">RunEventStore 事件流（append-only）</text>
    <text x="398" y="176">durability 指纹 + 交付回执</text>
    <text x="398" y="194">change_seq 变更时钟（全局 SQL 单例）</text>
    <text x="398" y="212" fill="#6366f1">心跳/进度快照不推进时钟</text>

    <rect x="622" y="118" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="634" y="140">无独立 checkpoint</text>
    <text x="634" y="158">结果信封（additional_kwargs）</text>
    <text x="634" y="176">delegations 台账 + step 事件</text>
    <text x="634" y="194">（start/step/end 可分页回放）</text>
    <text x="634" y="212" fill="#059669">checkpointer=False：一次性</text>

    <rect x="858" y="118" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="870" y="140">持久行 + 租约（DB 真相源）</text>
    <text x="870" y="158">结果截断存储 + preview</text>
    <text x="870" y="176">验收 verdict 持久（nullable）</text>
    <text x="870" y="194">JSONL 导出（owner-scoped）</text>
    <text x="870" y="212" fill="#b45309">durable 取消跨 worker 生效</text>

    <!-- row 2: isolation -->
    <rect x="150" y="228" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="162" y="250">独立沙箱 + 数据目录</text>
    <text x="162" y="268">uploads / workspace / outputs</text>
    <text x="162" y="286">网络策略 + 挂载预算</text>
    <text x="162" y="304">（子代理共享本线程沙箱）</text>
    <text x="162" y="322" fill="#2563eb">隔离单位 = thread</text>

    <rect x="386" y="228" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="398" y="250">run_id 划界委托预算</text>
    <text x="398" y="268">（同线程历史 run 不占新预算）</text>
    <text x="398" y="286">同线程并发：reject/rollback/</text>
    <text x="398" y="304">interrupt（multitask_strategy）</text>
    <text x="398" y="322" fill="#6366f1">checkpoint_write 互斥预留</text>

    <rect x="622" y="228" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="634" y="250">持久隔离事件环</text>
    <text x="634" y="268">ContextVar 边界（回调标记摘除）</text>
    <text x="634" y="286">共享沙箱 lease（#5128）</text>
    <text x="634" y="304">AIO：独立 shell session scope</text>
    <text x="634" y="322" fill="#059669">FIFO 准入（默认 3）</text>

    <rect x="858" y="228" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="870" y="250">owner-scoped 线程路径</text>
    <text x="870" y="268">沙箱授权 + 客户端租约</text>
    <text x="870" y="286">检查期间租约持续续期</text>
    <text x="870" y="304">阻塞读 drain 后才释放</text>
    <text x="870" y="322" fill="#b45309">取消立即栅栏 stale 完成</text>

    <!-- row 3: identity -->
    <rect x="150" y="338" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="162" y="360">thread_id（校验规则）</text>
    <text x="162" y="378">+ 通道模式标记</text>
    <text x="162" y="396">assistant 绑定（服务端盖戳）</text>
    <text x="162" y="414">conversation_references</text>
    <text x="162" y="432" fill="#2563eb">≤3 跨线程只读授权（run 级）</text>

    <rect x="386" y="338" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="398" y="360">trace_id（X-Trace-Id 全链）</text>
    <text x="398" y="378">+ run_id（服务端盖戳，</text>
    <text x="398" y="396">caller-supplied 被替换）</text>
    <text x="398" y="414">幂等键复用（崩溃恢复）</text>
    <text x="398" y="432" fill="#6366f1">双 id：关联键 vs 所有权键分离</text>

    <rect x="622" y="338" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="634" y="360">execution_id（进程注册表、</text>
    <text x="634" y="378">轮询/取消/超时/清理）</text>
    <text x="634" y="396">vs tool_call_id（ToolMessage、</text>
    <text x="634" y="414">事件、卡片、契约关联）</text>
    <text x="634" y="432" fill="#059669">双身份刻意分离，永不混用</text>

    <rect x="858" y="338" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="870" y="360">batch_id + 稳定 item key</text>
    <text x="870" y="378">（幂等身份，崩溃认领同 key）</text>
    <text x="870" y="396">submission_key 防重复提交</text>
    <text x="870" y="414">lease_owner（host:uuid）</text>
    <text x="870" y="432" fill="#b45309">提示词显式要求幂等副作用</text>

    <!-- row 4: recovery -->
    <rect x="150" y="448" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="162" y="470">对话级续跑（input=None 或</text>
    <text x="162" y="488">Command(resume)）</text>
    <text x="162" y="506">checkpoint_id 续跑：delta 下被</text>
    <text x="162" y="524">线性化（禁 fork），full 保留分支</text>
    <text x="162" y="542" fill="#2563eb">压缩/回滚保留全部通道</text>

    <rect x="386" y="448" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="398" y="470">事务级：开跑前捕获</text>
    <text x="398" y="488">RollbackPoint（全量状态+pending_writes）</text>
    <text x="398" y="506">取消回滚 / 编辑重放失败恢复 pre-run</text>
    <text x="398" y="524">孤儿恢复：过期租约原子接管</text>
    <text x="398" y="542" fill="#6366f1">提交或整体回滚，无中间态</text>

    <rect x="622" y="448" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="634" y="470">一次性：无执行位恢复</text>
    <text x="634" y="488">超时/取消靠信封部分结果兜底</text>
    <text x="634" y="506">（capped 但 completed 的部分成果</text>
    <text x="634" y="524">照常走 wire）</text>
    <text x="634" y="542" fill="#059669">失败判定只认 fallback 标记</text>

    <rect x="858" y="448" width="220" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="870" y="470">durable：租约到期他机认领</text>
    <text x="870" y="488">重试预算：admission 失败不耗尝试</text>
    <text x="870" y="506">（真实失败/租约过期才耗）</text>
    <text x="870" y="524">暂停/恢复/单 item 重试 API</text>
    <text x="870" y="542" fill="#b45309">最接近工作流引擎的单位</text>
  </g>

  <!-- bottom -->
  <rect x="24" y="566" width="1054" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="551" y="590" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">判读：这张表就是「DeerFlow 语境」的实体 — 每个单位的契约由 harness 决定；</text>
  <text x="551" y="610" font-size="12.5" fill="#334155" text-anchor="middle">LangGraph 的图能力（fork、Send、interrupt、动态构图）被上层契约分配为：暴露未消费 / 封在工具层下 / delta 结构性禁用</text>
</svg>
