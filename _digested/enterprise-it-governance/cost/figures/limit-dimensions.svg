<svg data-house="v1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="PingFang SC, sans-serif">
  <title>四个限额维度 —— 没有一个以「元」为单位</title>
  <desc>DeerFlow 治理卷示意图</desc>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">四个限额维度 —— 没有一个以「元」为单位</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#475569">能限住 token、步数、并发；限不住钱。框架不知道模型单价</text>

  <!-- 4 dimension bars -->
  <g font-size="12">
    <!-- token -->
    <rect x="60" y="86" width="880" height="72" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="80" y="112" font-weight="700" fill="#0c4a6e">① token 预算 · token_budget</text>
    <text x="80" y="134" fill="#075985" font-size="11">max_tokens 200000 · warn 0.8 · hard_stop 1.0 · 可拆 input/output 单独限</text>
    <rect x="700" y="98" width="220" height="26" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="810" y="116" text-anchor="middle" font-weight="700" font-size="11" fill="#991b1b">默认 enabled: false</text>
    <text x="700" y="142" font-size="10" fill="#b45309">出厂不生效，需显式开启</text>

    <!-- recursion -->
    <rect x="60" y="172" width="880" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="80" y="198" font-weight="700" fill="#14532d">② 递归步数 · recursion_limit</text>
    <text x="80" y="220" fill="#166534" font-size="11">默认 100 超级步（每步至少一次 LLM 调用）· 客户端可 per-request 覆盖</text>
    <rect x="700" y="184" width="220" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="810" y="202" text-anchor="middle" font-weight="700" font-size="11" fill="#14532d">max_recursion_limit 1000</text>
    <text x="700" y="228" font-size="10" fill="#15803d">服务端天花板，客户端突破不了</text>

    <!-- subagent -->
    <rect x="60" y="258" width="880" height="72" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="80" y="284" font-weight="700" fill="#713f12">③ 子代理并发与总量</text>
    <text x="80" y="306" fill="#854d0e" font-size="11">MAX_CONCURRENT_SUBAGENT_CALLS = 64 · max_total_per_run 可配</text>
    <rect x="700" y="270" width="220" height="26" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="810" y="288" text-anchor="middle" font-weight="700" font-size="11" fill="#713f12">64 是默认上限</text>
    <text x="700" y="314" font-size="10" fill="#b45309">单 run 可同时派 64 个子代理</text>

    <!-- money: absent -->
    <rect x="60" y="344" width="880" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6"/>
    <text x="80" y="370" font-weight="700" fill="#991b1b">④ 货币预算 · 不存在</text>
    <text x="80" y="392" fill="#7f1d1d" font-size="11">没有价格表，没有单价字段，没有「每 run 最多 X 元」的表达方式</text>
    <text x="700" y="378" font-weight="700" font-size="11" fill="#991b1b">✗ 无法表达</text>
    <text x="700" y="398" font-size="10" fill="#7f1d1d">只能用「便宜模型 + 限 token」间接近似</text>
  </g>

  <!-- hard stop detail -->
  <rect x="60" y="436" width="430" height="86" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="80" y="458" font-weight="700" font-size="12" fill="#0c4a6e">warn 与 hard_stop 的区别</text>
  <text x="80" y="478" font-size="10" fill="#075985">warn（0.8）：给 agent 一条上下文警告，继续跑</text>
  <text x="80" y="496" font-size="10" fill="#075985">hard_stop（1.0）：剥离 tool_calls，强制收尾</text>
  <text x="80" y="514" font-size="10" font-weight="700" fill="#b45309">是软着陆 —— 用户仍拿到答案，不是报错</text>

  <rect x="510" y="436" width="430" height="86" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="530" y="458" font-weight="700" font-size="12" fill="#991b1b">限不到的开销场景</text>
  <text x="530" y="478" font-size="10" fill="#7f1d1d">· 同一用户开 100 个 thread 并行跑（无 per-user 配额）</text>
  <text x="530" y="496" font-size="10" fill="#7f1d1d">· 用最贵模型跑满 200k token（token 限得住，钱限不住）</text>
  <text x="530" y="514" font-size="10" fill="#7f1d1d">· 跨 run 累计消费（每个 run 独立计数）</text>
</svg>
