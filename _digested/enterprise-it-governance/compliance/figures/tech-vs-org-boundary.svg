<svg data-house="v1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="PingFang SC, sans-serif">
  <title>合规要求的分界：软件能给的 vs 只能靠组织的</title>
  <desc>DeerFlow 治理卷示意图</desc>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">合规要求的分界：软件能给的 vs 只能靠组织的</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#475569">把两侧分开是本卷的基本纪律 —— 混淆两侧会得出错误的「已合规」结论</text>

  <!-- left: software -->
  <rect x="40" y="76" width="430" height="330" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="255" y="102" text-anchor="middle" font-weight="700" font-size="15" fill="#14532d">软件机制能给</text>
  <text x="255" y="122" text-anchor="middle" font-size="10" fill="#15803d">可验证、可在代码或日志里指出</text>

  <g font-size="11">
    <rect x="60" y="136" width="390" height="46" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="76" y="155" font-weight="700" fill="#14532d">访问控制</text>
    <text x="76" y="172" fill="#166534" font-size="10">13 个权限、4 条认证路径、PAT 路由白名单</text>

    <rect x="60" y="190" width="390" height="46" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="76" y="209" font-weight="700" fill="#14532d">数据隔离</text>
    <text x="76" y="226" fill="#166534" font-size="10">users/{user_id}/ 目录布局 + 路径穿越拒绝</text>

    <rect x="60" y="244" width="390" height="46" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="76" y="263" font-weight="700" fill="#14532d">操作拦截</text>
    <text x="76" y="280" fill="#166534" font-size="10">Guardrail deny + SandboxAudit block</text>

    <rect x="60" y="298" width="390" height="46" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="76" y="317" font-weight="700" fill="#14532d">技术性删除</text>
    <text x="76" y="334" fill="#166534" font-size="10">delete_thread_data + 用户删除使 PAT 失效</text>

    <rect x="60" y="352" width="390" height="44" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="76" y="370" font-weight="700" fill="#14532d">数据传输保护</text>
    <text x="76" y="387" fill="#166534" font-size="10">凭据 Fernet 加密、口令 PBKDF2、令牌只存摘要</text>
  </g>

  <!-- right: org -->
  <rect x="530" y="76" width="430" height="330" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="745" y="102" text-anchor="middle" font-weight="700" font-size="15" fill="#991b1b">软件给不了（组织责任）</text>
  <text x="745" y="122" text-anchor="middle" font-size="10" fill="#b91c1c">有机制 ≠ 有制度；有日志 ≠ 有流程</text>

  <g font-size="11">
    <rect x="550" y="136" width="390" height="46" rx="6" fill="#ffffff" stroke="#dc2626"/>
    <text x="566" y="155" font-weight="700" fill="#991b1b">处理活动记录（GDPR Art.30）</text>
    <text x="566" y="172" fill="#7f1d1d" font-size="10">RunJournal 是运行事件，不是处理活动登记册</text>

    <rect x="550" y="190" width="390" height="46" rx="6" fill="#ffffff" stroke="#dc2626"/>
    <text x="566" y="209" font-weight="700" fill="#991b1b">合法性与目的限定</text>
    <text x="566" y="226" fill="#7f1d1d" font-size="10">存了什么、为什么存、存多久，需自行界定</text>

    <rect x="550" y="244" width="390" height="46" rx="6" fill="#ffffff" stroke="#dc2626"/>
    <text x="566" y="263" font-weight="700" fill="#991b1b">人为监督（EU AI Act）</text>
    <text x="566" y="280" fill="#7f1d1d" font-size="10">无强制审批闸门，clarification 不是审批</text>

    <rect x="550" y="298" width="390" height="46" rx="6" fill="#ffffff" stroke="#dc2626"/>
    <text x="566" y="317" font-weight="700" fill="#991b1b">访问评审与权限回收</text>
    <text x="566" y="334" fill="#7f1d1d" font-size="10">能撤销，但谁定期审、按什么标准审，是流程</text>

    <rect x="550" y="352" width="390" height="44" rx="6" fill="#ffffff" stroke="#dc2626"/>
    <text x="566" y="370" font-weight="700" fill="#991b1b">供应商评估与合同</text>
    <text x="566" y="387" fill="#7f1d1d" font-size="10">DPA、备案、跨境传输的法律依据</text>
  </g>

  <!-- arrows between -->
  <path d="M470,240 h60" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5"/>
  <text x="500" y="232" text-anchor="middle" font-size="9" fill="#64748b">支撑</text>
  <text x="500" y="256" text-anchor="middle" font-size="9" fill="#64748b">≠ 替代</text>

  <!-- bottom disclaimer -->
  <rect x="40" y="436" width="920" height="112" rx="10" fill="#fffbeb" stroke="#ca8a04" stroke-width="2"/>
  <text x="60" y="462" font-weight="700" font-size="14" fill="#713f12">⚠ 本卷不构成合规结论</text>
  <text x="60" y="486" font-size="11" fill="#854d0e">本卷只描述 DeerFlow v2.2.0 的技术机制与缺口，不对任何法规的符合性作出判断，也不构成法律意见。</text>
  <text x="60" y="508" font-size="11" fill="#854d0e">左列「能给」指的是机制存在且可在源码中指出，不代表它满足某项法规的具体条款 —— 条款解读取决于适用场景与法律判断。</text>
  <text x="60" y="530" font-size="11" fill="#854d0e">右列「给不了」不代表 DeerFlow 有缺陷：这些本就是部署方的制度责任，任何软件都不提供。</text>
</svg>
