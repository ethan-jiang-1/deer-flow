<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="PingFang SC, sans-serif">
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">PAT 的双层过滤：路由白名单 + scope</text>
  <text x="490" y="52" text-anchor="middle" font-size="12" fill="#475569">请求必须同时通过两层；任一层拒绝即 403 —— 白名单在前，scope 在后</text>
  <defs><marker id="p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker></defs>

  <!-- request -->
  <rect x="340" y="76" width="300" height="48" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="490" y="99" text-anchor="middle" font-weight="700" font-size="12" fill="#0f172a">Authorization: Bearer dfp_…</text>
  <text x="490" y="116" text-anchor="middle" font-size="10" fill="#475569">authenticate_pat · SHA-256 查库</text>
  <path d="M490,124 v22" stroke="#64748b" stroke-width="1.5" marker-end="url(#p)"/>

  <!-- layer 1 -->
  <rect x="120" y="150" width="740" height="112" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="490" y="174" text-anchor="middle" font-weight="700" font-size="13" fill="#713f12">第一层 · 路由白名单 _PAT_ROUTE_RULES（默认拒绝）</text>
  <text x="490" y="195" text-anchor="middle" font-size="11" fill="#854d0e">不在表内的路径 → 直接拒绝，与 scope 无关</text>

  <g font-size="10">
    <rect x="140" y="208" width="170" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="225" y="226" text-anchor="middle" font-weight="700" fill="#14532d">✓ 允许</text>
    <text x="225" y="243" text-anchor="middle" fill="#166534">threads / runs 生命周期</text>

    <rect x="325" y="208" width="170" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="410" y="226" text-anchor="middle" font-weight="700" fill="#14532d">✓ 允许</text>
    <text x="410" y="243" text-anchor="middle" fill="#166534">projects / trash（同 scope）</text>

    <rect x="510" y="208" width="170" height="44" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="595" y="226" text-anchor="middle" font-weight="700" fill="#991b1b">✗ 不在表内</text>
    <text x="595" y="243" text-anchor="middle" fill="#7f1d1d">/api/plugins/* 管理面</text>

    <rect x="695" y="208" width="145" height="44" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="767" y="226" text-anchor="middle" font-weight="700" fill="#991b1b">✗ 不在表内</text>
    <text x="767" y="243" text-anchor="middle" fill="#7f1d1d">/api/v1/admin/*</text>
  </g>
  <path d="M490,262 v24" stroke="#64748b" stroke-width="1.5" marker-end="url(#p)"/>

  <!-- layer 2 -->
  <rect x="200" y="290" width="580" height="98" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="490" y="314" text-anchor="middle" font-weight="700" font-size="13" fill="#0c4a6e">第二层 · Scope 校验（9 个可选 scope）</text>
  <text x="490" y="335" text-anchor="middle" font-size="11" fill="#075985">validate_scopes · 路由要求的 scope 必须在令牌的 scope 集合里</text>
  <g font-size="10" fill="#075985">
    <text x="215" y="358">threads:read / write / delete</text>
    <text x="215" y="374">runs:create / read / cancel</text>
    <text x="500" y="358">projects:read / write / delete</text>
    <text x="500" y="374">9 个，与 authz 的 resource:action 同名</text>
  </g>
  <path d="M490,388 v24" stroke="#64748b" stroke-width="1.5" marker-end="url(#p)"/>

  <!-- result -->
  <rect x="360" y="416" width="260" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="490" y="438" text-anchor="middle" font-weight="700" font-size="12" fill="#14532d">两层都通过 → 执行</text>
  <text x="490" y="454" text-anchor="middle" font-size="10" fill="#166534">停用用户 / 已删除用户 → 401</text>

  <!-- side notes -->
  <g font-size="10" fill="#64748b">
    <text x="30" y="500">深思点 1</text>
    <text x="30" y="516">PAT 永不带 admin：即使属主是 admin，</text>
    <text x="30" y="530">is_admin=False 且 roles 元组被清空</text>

    <text x="380" y="500">深思点 2</text>
    <text x="380" y="516">agent run 句柄只接受 session / auth-disabled</text>
    <text x="380" y="530">两种来源；PAT 撤销不会收回已发出句柄</text>

    <text x="740" y="500">深思点 3</text>
    <text x="740" y="516">last_used_at 写入有 300s 节流</text>
    <text x="740" y="530">避免每请求一次写库</text>
  </g>
</svg>
