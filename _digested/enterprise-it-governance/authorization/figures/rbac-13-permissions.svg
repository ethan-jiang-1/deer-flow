<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="PingFang SC, sans-serif">
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">RBAC：13 个权限 × 授权默认关闭</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#475569">authorization.enabled 不为 True 时，resolve 直接返回全部 13 个权限（legacy 行为）</text>
  <defs><marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker></defs>

  <!-- entry -->
  <rect x="330" y="74" width="340" height="58" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="500" y="97" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">resolve_route_permissions(request)</text>
  <text x="500" y="117" text-anchor="middle" font-size="11" fill="#475569">每次请求解析所需权限</text>

  <path d="M500,132 v26" stroke="#64748b" stroke-width="1.5" marker-end="url(#r)"/>
  <polygon points="500,158 660,206 500,254 340,206" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="500" y="200" text-anchor="middle" font-weight="700" font-size="12" fill="#713f12">config.enabled</text>
  <text x="500" y="218" text-anchor="middle" font-weight="700" font-size="12" fill="#713f12">is True ?</text>

  <!-- NO -->
  <path d="M340,206 H180 v40" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <text x="255" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">否（出厂默认）</text>
  <rect x="60" y="252" width="240" height="86" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="276" text-anchor="middle" font-weight="700" font-size="12" fill="#991b1b">返回全部 13 个权限</text>
  <text x="180" y="297" text-anchor="middle" font-size="10" fill="#7f1d1d">"preserves the legacy</text>
  <text x="180" y="312" text-anchor="middle" font-size="10" fill="#7f1d1d">all-permissions behavior"</text>
  <text x="180" y="330" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">→ 最小权限不成立</text>

  <!-- YES -->
  <path d="M660,206 H820 v40" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <text x="745" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">是</text>
  <rect x="700" y="252" width="240" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="820" y="276" text-anchor="middle" font-weight="700" font-size="12" fill="#14532d">provider 查授权</text>
  <text x="820" y="297" text-anchor="middle" font-size="10" fill="#166534">asyncio.gather 并发查</text>
  <text x="820" y="312" text-anchor="middle" font-size="10" fill="#166534">internal 角色被剥离</text>
  <text x="820" y="330" text-anchor="middle" font-size="10" fill="#166534">fail_closed 语义</text>

  <!-- 13 permissions -->
  <path d="M500,254 v26" stroke="#64748b" stroke-width="1.5" marker-end="url(#r)"/>
  <rect x="40" y="288" width="920" height="196" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="500" y="314" text-anchor="middle" font-weight="700" font-size="14" fill="#0c4a6e">_ALL_PERMISSIONS · 13 项（此前文档误记为 11 项）</text>

  <g font-size="11">
    <!-- Thread: 3 -->
    <rect x="60" y="330" width="210" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="165" y="350" text-anchor="middle" font-weight="700" fill="#0c4a6e">Thread · 3</text>
    <text x="165" y="370" text-anchor="middle" fill="#075985" font-size="10">threads:read</text>
    <text x="165" y="386" text-anchor="middle" fill="#075985" font-size="10">threads:write · threads:delete</text>

    <!-- Run: 3 -->
    <rect x="285" y="330" width="210" height="70" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="390" y="350" text-anchor="middle" font-weight="700" fill="#14532d">Run · 3</text>
    <text x="390" y="370" text-anchor="middle" fill="#166534" font-size="10">runs:create</text>
    <text x="390" y="386" text-anchor="middle" fill="#166534" font-size="10">runs:read · runs:cancel</text>

    <!-- Memory: 2 -->
    <rect x="510" y="330" width="210" height="70" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="615" y="350" text-anchor="middle" font-weight="700" fill="#713f12">Memory · 2</text>
    <text x="615" y="370" text-anchor="middle" fill="#854d0e" font-size="10">memory:read</text>
    <text x="615" y="386" text-anchor="middle" fill="#854d0e" font-size="10">memory:write</text>

    <!-- Agent: 2 -->
    <rect x="735" y="330" width="210" height="70" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="840" y="350" text-anchor="middle" font-weight="700" fill="#4c1d95">Agent · 2</text>
    <text x="840" y="370" text-anchor="middle" fill="#5b21b6" font-size="10">agents:read</text>
    <text x="840" y="386" text-anchor="middle" fill="#5b21b6" font-size="10">agents:write</text>

    <!-- Project: 3 highlight -->
    <rect x="60" y="406" width="435" height="64" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="277" y="428" text-anchor="middle" font-weight="700" fill="#9a3412">Project · 3 ← 此前漏算的那三项</text>
    <text x="277" y="452" text-anchor="middle" fill="#c2410c" font-size="10">projects:read · projects:write · projects:delete</text>

    <text x="740" y="428" text-anchor="middle" fill="#475569" font-size="10">合计 3+3+2+2+3 = 13</text>
    <text x="740" y="448" text-anchor="middle" fill="#475569" font-size="10">（无 skill / mcp / admin 类权限）</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="506" width="920" height="76" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="60" y="528" font-size="12" font-weight="700" fill="#991b1b">运维要点</text>
  <text x="60" y="548" font-size="11" fill="#7f1d1d">· 「最小权限」必须显式设置 authorization.enabled=True —— 出厂状态下所有登录用户拥有全部 13 个权限</text>
  <text x="60" y="568" font-size="11" fill="#7f1d1d">· 内部调用者（internal 角色）即使开启授权也会被剥离，不会继承 admin 的全部权限</text>
</svg>
