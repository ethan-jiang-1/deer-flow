<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="PingFang SC, sans-serif">
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">数据存放：文件系统与关系库两处</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#475569">备份、导出、删除都必须同时覆盖两处 —— 只处理一处就是数据缺口</text>

  <!-- two columns -->
  <rect x="40" y="72" width="430" height="360" rx="12" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <text x="255" y="98" text-anchor="middle" font-weight="700" font-size="14" fill="#0c4a6e">① 文件系统 · {base_dir}</text>

  <g font-size="11">
    <text x="70" y="128" font-family="monospace" fill="#075985">.deer-flow/</text>
    <text x="90" y="150" font-family="monospace" fill="#075985">users/</text>

    <!-- user1 -->
    <rect x="110" y="160" width="330" height="130" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="125" y="180" font-family="monospace" font-weight="700" fill="#0c4a6e">{user_id}/</text>
    <text x="145" y="200" font-family="monospace" fill="#075985" font-size="10">memory.json</text>
    <text x="270" y="200" fill="#475569" font-size="9">← 用户记忆</text>
    <text x="145" y="218" font-family="monospace" fill="#075985" font-size="10">threads/{thread_id}/</text>
    <text x="145" y="236" font-family="monospace" fill="#075985" font-size="10">├ user-data/workspace/</text>
    <text x="145" y="252" font-family="monospace" fill="#075985" font-size="10">├ user-data/uploads/</text>
    <text x="145" y="268" font-family="monospace" fill="#075985" font-size="10">└ user-data/outputs/</text>
    <text x="145" y="285" font-family="monospace" fill="#075985" font-size="10">agents/{name}/</text>

    <!-- legacy -->
    <rect x="110" y="300" width="330" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="5"/>
    <text x="125" y="320" font-family="monospace" font-weight="700" fill="#991b1b">threads/{thread_id}/</text>
    <text x="125" y="340" fill="#7f1d1d" font-size="10">legacy 布局 —— 路径里没有 user_id，不做隔离</text>

    <text x="70" y="382" font-family="monospace" fill="#64748b" font-size="10">.credentials_key（0600）</text>
    <text x="70" y="400" font-family="monospace" fill="#64748b" font-size="10">integrations/skills/{provider}/</text>
  </g>

  <rect x="530" y="72" width="430" height="360" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="745" y="98" text-anchor="middle" font-weight="700" font-size="14" fill="#14532d">② 关系库 · sqlite / postgres</text>

  <g font-size="11">
    <rect x="560" y="118" width="370" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="745" y="139" text-anchor="middle" fill="#14532d">users · 账号、角色、token_version、disabled</text>

    <rect x="560" y="160" width="370" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="745" y="181" text-anchor="middle" fill="#14532d">threads · thread 元数据</text>

    <rect x="560" y="202" width="370" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="745" y="223" text-anchor="middle" fill="#14532d">runs / run_events · 运行与事件</text>

    <rect x="560" y="244" width="370" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="745" y="265" text-anchor="middle" fill="#14532d">pat_tokens · 只存 SHA-256 摘要</text>

    <rect x="560" y="286" width="370" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="745" y="307" text-anchor="middle" fill="#14532d">mcp_oauth_tokens · Fernet 密文</text>

    <rect x="560" y="328" width="370" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="745" y="349" text-anchor="middle" fill="#14532d">project_documents · 含回收站</text>

    <text x="560" y="392" fill="#475569" font-size="10">→ 按用户删除时，这两处都要处理</text>
  </g>

  <!-- gaps -->
  <rect x="40" y="456" width="920" height="90" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="60" y="480" font-weight="700" font-size="13" fill="#991b1b">两处带来的三个缺口</text>
  <text x="60" y="502" font-size="11" fill="#7f1d1d">· 一致性备份：没有跨文件系统与数据库的快照机制，分开备份会产生时间差</text>
  <text x="60" y="520" font-size="11" fill="#7f1d1d">· 用户级导出：目录可打包，但库内数据（PAT、thread 记录）需另行查询合并</text>
  <text x="60" y="538" font-size="11" fill="#7f1d1d">· 用户级删除：删用户会让 PAT 立即失效，但 users/{id}/ 目录需要手工清理</text>
</svg>
