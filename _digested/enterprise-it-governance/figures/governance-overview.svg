<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 852" font-family="PingFang SC, sans-serif" data-house="v1">
  <title>12 个管理维度 × DeerFlow 能力映射</title>
  <desc>每一维只回答：有什么机制、缺什么；具体证据回正文。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker></defs>
  <rect width="1000" height="852" fill="#ffffff"/>
  <text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">12 个管理维度 × DeerFlow 能力映射</text>
  <text x="500.0" y="52" text-anchor="middle" font-size="12" fill="#475569">每一维只回答：有什么机制、缺什么；具体证据回正文。</text>
<rect x="30" y="96" width="940" height="40" rx="8" fill="#334155"/>
<text x="186.7" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">维度</text>
<text x="500.0" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">DeerFlow 能力</text>
<text x="813.3" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">缺口</text>
<rect x="30" y="136" width="940" height="58" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40.0" y="158" font-size="9.5" font-weight="700" fill="#0f172a">身份与访问</text>
<text x="353.3" y="158" font-size="9.5" font-weight="700" fill="#0f172a">JWT / CSRF / internal / PAT / per-user 隔离</text>
<line x1="343.3" y1="136" x2="343.3" y2="194" stroke="#e2e8f0"/>
<text x="666.7" y="158" font-size="9.5" font-weight="700" fill="#0f172a">无 Agent 独立身份</text>
<line x1="656.7" y1="136" x2="656.7" y2="194" stroke="#e2e8f0"/>
<rect x="30" y="194" width="940" height="58" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40.0" y="216" font-size="9.5" font-weight="700" fill="#0f172a">沙箱隔离</text>
<text x="353.3" y="216" font-size="9.5" font-weight="700" fill="#0f172a">7 模式 / 路径防穿透 / per-thread</text>
<line x1="343.3" y1="194" x2="343.3" y2="252" stroke="#e2e8f0"/>
<text x="666.7" y="216" font-size="9.5" font-weight="700" fill="#0f172a">Local 共享宿主内核</text>
<line x1="656.7" y1="194" x2="656.7" y2="252" stroke="#e2e8f0"/>
<rect x="30" y="252" width="940" height="58" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40.0" y="274" font-size="9.5" font-weight="700" fill="#0f172a">工具授权</text>
<text x="353.3" y="274" font-size="9.5" font-weight="700" fill="#0f172a">Guardrail + 三道门</text>
<line x1="343.3" y1="252" x2="343.3" y2="310" stroke="#e2e8f0"/>
<text x="666.7" y="274" font-size="9.5" font-weight="700" fill="#0f172a">无 per-thread 配置</text>
<line x1="656.7" y1="252" x2="656.7" y2="310" stroke="#e2e8f0"/>
<rect x="30" y="310" width="940" height="58" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40.0" y="332" font-size="9.5" font-weight="700" fill="#0f172a">命令审计</text>
<text x="353.3" y="332" font-size="9.5" font-weight="700" fill="#0f172a">SandboxAudit 高危 block / 中危 warn</text>
<line x1="343.3" y1="310" x2="343.3" y2="368" stroke="#e2e8f0"/>
<text x="666.7" y="332" font-size="9.5" font-weight="700" fill="#0f172a">规则硬编码；只写日志</text>
<line x1="656.7" y1="310" x2="656.7" y2="368" stroke="#e2e8f0"/>
<rect x="30" y="368" width="940" height="58" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40.0" y="390" font-size="9.5" font-weight="700" fill="#0f172a">执行限额</text>
<text x="353.3" y="390" font-size="9.5" font-weight="700" fill="#0f172a">循环检测 / 并发 / token_budget / recursion</text>
<line x1="343.3" y1="368" x2="343.3" y2="426" stroke="#e2e8f0"/>
<text x="666.7" y="390" font-size="9.5" font-weight="700" fill="#0f172a">无货币预算；顶层预算默认关</text>
<line x1="656.7" y1="368" x2="656.7" y2="426" stroke="#e2e8f0"/>
<rect x="30" y="426" width="940" height="58" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40.0" y="448" font-size="9.5" font-weight="700" fill="#0f172a">内容安全</text>
<text x="353.3" y="448" font-size="9.5" font-weight="700" fill="#0f172a">SafetyFinishReason 被动清除</text>
<line x1="343.3" y1="426" x2="343.3" y2="484" stroke="#e2e8f0"/>
<text x="666.7" y="448" font-size="9.5" font-weight="700" fill="#0f172a">无主动输出扫描</text>
<line x1="656.7" y1="426" x2="656.7" y2="484" stroke="#e2e8f0"/>
<rect x="30" y="484" width="940" height="58" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40.0" y="506" font-size="9.5" font-weight="700" fill="#0f172a">审计追溯</text>
<text x="353.3" y="506" font-size="9.5" font-weight="700" fill="#0f172a">SandboxAudit + RunJournal + tracing</text>
<line x1="343.3" y1="484" x2="343.3" y2="542" stroke="#e2e8f0"/>
<text x="666.7" y="506" font-size="9.5" font-weight="700" fill="#0f172a">allow 决策不留痕</text>
<line x1="656.7" y1="484" x2="656.7" y2="542" stroke="#e2e8f0"/>
<rect x="30" y="542" width="940" height="58" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40.0" y="564" font-size="9.5" font-weight="700" fill="#0f172a">成本归属</text>
<text x="353.3" y="564" font-size="9.5" font-weight="700" fill="#0f172a">usage + subagent 合并 + Console 计价</text>
<line x1="343.3" y1="542" x2="343.3" y2="600" stroke="#e2e8f0"/>
<text x="666.7" y="564" font-size="9.5" font-weight="700" fill="#0f172a">无实时告警/跨用户视图</text>
<line x1="656.7" y1="542" x2="656.7" y2="600" stroke="#e2e8f0"/>
<rect x="30" y="600" width="940" height="58" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40.0" y="622" font-size="9.5" font-weight="700" fill="#0f172a">可观测性</text>
<text x="353.3" y="622" font-size="9.5" font-weight="700" fill="#0f172a">SSE + heartbeat + tracing</text>
<line x1="343.3" y1="600" x2="343.3" y2="658" stroke="#e2e8f0"/>
<text x="666.7" y="622" font-size="9.5" font-weight="700" fill="#0f172a">无集群仪表盘/异常检测</text>
<line x1="656.7" y1="600" x2="656.7" y2="658" stroke="#e2e8f0"/>
<rect x="30" y="658" width="940" height="58" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40.0" y="680" font-size="9.5" font-weight="700" fill="#0f172a">数据治理</text>
<text x="353.3" y="680" font-size="9.5" font-weight="700" fill="#0f172a">per-user 存储 / 脱敏 / 配额 / PII</text>
<line x1="343.3" y1="658" x2="343.3" y2="716" stroke="#e2e8f0"/>
<text x="666.7" y="680" font-size="9.5" font-weight="700" fill="#0f172a">PII 默认关；无分类标签</text>
<line x1="656.7" y1="658" x2="656.7" y2="716" stroke="#e2e8f0"/>
<rect x="30" y="716" width="940" height="58" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40.0" y="738" font-size="9.5" font-weight="700" fill="#0f172a">可靠性</text>
<text x="353.3" y="738" font-size="9.5" font-weight="700" fill="#0f172a">LLM/Tool error handling</text>
<line x1="343.3" y1="716" x2="343.3" y2="774" stroke="#e2e8f0"/>
<text x="666.7" y="738" font-size="9.5" font-weight="700" fill="#0f172a">无 SLO / error budget</text>
<line x1="656.7" y1="716" x2="656.7" y2="774" stroke="#e2e8f0"/>
<rect x="30" y="774" width="940" height="58" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40.0" y="796" font-size="9.5" font-weight="700" fill="#0f172a">生命周期</text>
<text x="353.3" y="796" font-size="9.5" font-weight="700" fill="#0f172a">热加载 / skills 生命周期 / grant</text>
<line x1="343.3" y1="774" x2="343.3" y2="832" stroke="#e2e8f0"/>
<text x="666.7" y="796" font-size="9.5" font-weight="700" fill="#0f172a">无灰度 / 无 kill switch</text>
<line x1="656.7" y1="774" x2="656.7" y2="832" stroke="#e2e8f0"/>
</svg>
