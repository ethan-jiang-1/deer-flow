<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, sans-serif" data-house="v1">
  <title>纵深防线：从请求到 Tool 执行的七层</title>
  <desc>自上而下是防线顺序；每层只回答“拦什么、失败怎么办”。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker></defs>
  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">纵深防线：从请求到 Tool 执行的七层</text>
  <text x="500.0" y="52" text-anchor="middle" font-size="12" fill="#475569">自上而下是防线顺序；每层只回答“拦什么、失败怎么办”。</text>
<rect x="150" y="96" width="700" height="64" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="168" y="122" font-size="13" font-weight="700" fill="#0c4a6e">Edge / Nginx</text>
<text x="168" y="143" font-size="10" fill="#075985">入口限速、TLS、SSE 反代；不是身份边界</text>
<line x1="500.0" y1="161" x2="500.0" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="150" y="178" width="700" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="168" y="204" font-size="13" font-weight="700" fill="#14532d">Auth / CSRF</text>
<text x="168" y="225" font-size="10" fill="#166534">JWT / PAT / internal token / IM；失败 401/403</text>
<line x1="500.0" y1="243" x2="500.0" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="150" y="260" width="700" height="64" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="168" y="286" font-size="13" font-weight="700" fill="#713f12">Authorization</text>
<text x="168" y="307" font-size="10" fill="#854d0e">RBAC / Guardrail / MCP scope；fail-closed 可配</text>
<line x1="500.0" y1="325" x2="500.0" y2="338" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="150" y="342" width="700" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="168" y="368" font-size="13" font-weight="700" fill="#4c1d95">Tool mediation</text>
<text x="168" y="389" font-size="10" fill="#5b21b6">receipt / read-before-write / artifact resolve</text>
<line x1="500.0" y1="407" x2="500.0" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="150" y="424" width="700" height="64" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="168" y="450" font-size="13" font-weight="700" fill="#0f172a">Sandbox isolation</text>
<text x="168" y="471" font-size="10" fill="#475569">sandbox mode + 路径检查 + per-thread</text>
<line x1="500.0" y1="489" x2="500.0" y2="502" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="150" y="506" width="700" height="64" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="168" y="532" font-size="13" font-weight="700" fill="#0c4a6e">OS / egress</text>
<text x="168" y="553" font-size="10" fill="#075985">网络策略、受控出口、资源限额</text>
<line x1="500.0" y1="571" x2="500.0" y2="584" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="150" y="588" width="700" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="168" y="614" font-size="13" font-weight="700" fill="#14532d">Audit / evidence</text>
<text x="168" y="635" font-size="10" fill="#166534">RunEvent + Journal + SandboxAudit；可回放</text>
</svg>
