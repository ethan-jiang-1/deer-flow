<rect x="592.0" y="352.0" width="156.0" height="42.0" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1"/>
<text x="604.0" y="369.0" font-size="9.2" fill="#15803d" font-weight="400" text-anchor="start">Local = 零隔离</text>
