<text x="248.0" y="239.0" font-size="8.8" fill="#1e3a8a" font-weight="400" text-anchor="start">13 个路由权限 + thread 归属；默认全放行</text>
<rect x="236.0" y="262.0" width="298.0" height="44.0" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
<text x="248.0" y="280.0" font-size="10" fill="#1d4ed8" font-weight="700" text-anchor="start">Agent loop</text>
<text x="248.0" y="295.0" font-size="8.8" fill="#1e3a8a" font-weight="400" text-anchor="start">输入 → Guardrail → SandboxAudit → 结果转义</text>
<rect x="236.0" y="352.0" width="298.0" height="44.0" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
<text x="248.0" y="370.0" font-size="10" fill="#1d4ed8" font-weight="700" text-anchor="start">Plugin authz / grants</text>
<text x="248.0" y="385.0" font-size="8.8" fill="#1e3a8a" font-weight="400" text-anchor="start">action/management；读 body 前鉴权</text>
<rect x="236.0" y="408.0" width="298.0" height="44.0" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
<text x="248.0" y="426.0" font-size="10" fill="#1d4ed8" font-weight="700" text-anchor="start">Output / secrets</text>
<text x="248.0" y="441.0" font-size="8.8" fill="#1e3a8a" font-weight="400" text-anchor="start">HTML 转义；trace/checkpoint 脱敏；LLM 出网</text>
