<rect x="220" y="118" width="330" height="12" fill="#1d4ed8"/>
<text x="232.0" y="120.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start">Gateway / 控制面（可信）</text>
<rect x="236.0" y="150.0" width="298.0" height="44.0" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
<text x="248.0" y="168.0" font-size="10" fill="#1d4ed8" font-weight="700" text-anchor="start">AuthMiddleware / CSRF</text>
<text x="248.0" y="183.0" font-size="8.8" fill="#1e3a8a" font-weight="400" text-anchor="start">JWT、PAT、internal、IM；失败 401/403</text>
