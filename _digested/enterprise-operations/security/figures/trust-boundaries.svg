<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 688" font-family="PingFang SC, sans-serif" data-house="v1">
  <title>信任边界：谁在边界内，数据从哪里出去</title>
  <desc>operator 可信、内容不可信、agent 继承用户身份——三条假设决定了所有控制的落点。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1000" height="688" fill="#ffffff"/>
  <text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">信任边界：谁在边界内，数据从哪里出去</text>
  <text x="500.0" y="52" text-anchor="middle" font-size="12" fill="#475569">operator 可信、内容不可信、agent 继承用户身份——三条假设决定了所有控制的落点。</text>
