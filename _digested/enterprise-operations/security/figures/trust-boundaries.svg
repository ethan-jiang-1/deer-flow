<path d="M786 566 L558 566 L558 554" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowRed)"/>
<text x="672" y="582" font-size="8.5" fill="#b91c1c" text-anchor="middle">tool result（不可信，需中性化）</text>
<rect x="30.0" y="600.0" width="940.0" height="66.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="46.0" y="623.0" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="start">三条信任假设</text>
<text x="46.0" y="643.0" font-size="9.2" fill="#475569" font-weight="400" text-anchor="start">① operator 可信：能写 config、装插件、注册 stdio MCP ≈ 代码执行  ② web/MCP/上传内容不可信：结果要中性化  ③ agent 没有独立身份：继承触发它的用户</text>
</svg>
