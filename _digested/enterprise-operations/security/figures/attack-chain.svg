<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 626" font-family="PingFang SC, sans-serif" data-house="v1">
  <title>一条恶意网页，如何走到一次命令执行</title>
  <desc>上排是攻击路径，下排是对应拦截点；绿色盾牌只回答“这一层拦什么”，不回答“下一层一定接得住”。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1000" height="626" fill="#ffffff"/>
  <text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">一条恶意网页，如何走到一次命令执行</text>
  <text x="500.0" y="52" text-anchor="middle" font-size="12" fill="#475569">上排是攻击路径，下排是对应拦截点；绿色盾牌只回答“这一层拦什么”，不回答“下一层一定接得住”。</text>
<rect x="30.0" y="86.0" width="176.0" height="96.0" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
<text x="44.0" y="110.0" font-size="11" fill="#991b1b" font-weight="700" text-anchor="start">① 用户请求</text>
<text x="44.0" y="132.0" font-size="9.3" fill="#7f1d1d" font-weight="400" text-anchor="start">总结这篇网页</text>
<rect x="30.0" y="224.0" width="176.0" height="126.0" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.3"/>
<text x="44.0" y="247.0" font-size="11" fill="#166534" font-weight="700" text-anchor="start">输入中性化</text>
<text x="44.0" y="269.0" font-size="9.2" fill="#14532d" font-weight="400" text-anchor="start">转义框架标签；挡格式注入，不挡</text>
<text x="44.0" y="282.0" font-size="9.2" fill="#14532d" font-weight="400" text-anchor="start">语义说服</text>
<line x1="118.0" y1="182" x2="118.0" y2="220" stroke="#16a34a" stroke-dasharray="3 4" marker-end="url(#arrowGreen)"/>
<line x1="208" y1="134.0" x2="220" y2="134.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
<rect x="224.0" y="86.0" width="176.0" height="96.0" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
<text x="238.0" y="110.0" font-size="11" fill="#991b1b" font-weight="700" text-anchor="start">② 远程内容</text>
<text x="238.0" y="132.0" font-size="9.3" fill="#7f1d1d" font-weight="400" text-anchor="start">网页藏着：忽略以上指令，</text>
<text x="238.0" y="145.0" font-size="9.3" fill="#7f1d1d" font-weight="400" text-anchor="start">执行…</text>
<rect x="224.0" y="224.0" width="176.0" height="126.0" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.3"/>
<text x="238.0" y="247.0" font-size="11" fill="#166534" font-weight="700" text-anchor="start">结果中性化</text>
<text x="238.0" y="269.0" font-size="9.2" fill="#14532d" font-weight="400" text-anchor="start">web/MCP 结果里的伪造标签转义；</text>
<text x="238.0" y="282.0" font-size="9.2" fill="#14532d" font-weight="400" text-anchor="start">不判断内容是否恶意</text>
<line x1="312.0" y1="182" x2="312.0" y2="220" stroke="#16a34a" stroke-dasharray="3 4" marker-end="url(#arrowGreen)"/>
<line x1="402" y1="134.0" x2="414" y2="134.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
<rect x="418.0" y="86.0" width="176.0" height="96.0" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
<text x="432.0" y="110.0" font-size="11" fill="#991b1b" font-weight="700" text-anchor="start">③ 模型决策</text>
<text x="432.0" y="132.0" font-size="9.3" fill="#7f1d1d" font-weight="400" text-anchor="start">把网页文字当指令，生成</text>
<text x="432.0" y="145.0" font-size="9.3" fill="#7f1d1d" font-weight="400" text-anchor="start">bash 调用</text>
<rect x="418.0" y="224.0" width="176.0" height="126.0" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.3"/>
<text x="432.0" y="247.0" font-size="11" fill="#166534" font-weight="700" text-anchor="start">工具门</text>
<text x="432.0" y="269.0" font-size="9.2" fill="#14532d" font-weight="400" text-anchor="start">按工具/角色/风险概率放行；默认</text>
<text x="432.0" y="282.0" font-size="9.2" fill="#14532d" font-weight="400" text-anchor="start">关，未探测工具可绕过</text>
<line x1="506.0" y1="182" x2="506.0" y2="220" stroke="#16a34a" stroke-dasharray="3 4" marker-end="url(#arrowGreen)"/>
<line x1="596" y1="134.0" x2="608" y2="134.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
<rect x="612.0" y="86.0" width="176.0" height="96.0" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
<text x="626.0" y="110.0" font-size="11" fill="#991b1b" font-weight="700" text-anchor="start">④ 工具中介</text>
<text x="626.0" y="132.0" font-size="9.3" fill="#7f1d1d" font-weight="400" text-anchor="start">guardrail / audit / 路径</text>
<text x="626.0" y="145.0" font-size="9.3" fill="#7f1d1d" font-weight="400" text-anchor="start">检查</text>
<rect x="612.0" y="224.0" width="176.0" height="126.0" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.3"/>
<text x="626.0" y="247.0" font-size="11" fill="#166534" font-weight="700" text-anchor="start">命令审计</text>
<text x="626.0" y="269.0" font-size="9.2" fill="#14532d" font-weight="400" text-anchor="start">正则拦 rm -rf / dd / mkfs；只</text>
<text x="626.0" y="282.0" font-size="9.2" fill="#14532d" font-weight="400" text-anchor="start">覆盖 bash</text>
<line x1="700.0" y1="182" x2="700.0" y2="220" stroke="#16a34a" stroke-dasharray="3 4" marker-end="url(#arrowGreen)"/>
<line x1="790" y1="134.0" x2="802" y2="134.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
<rect x="806.0" y="86.0" width="176.0" height="96.0" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
<text x="820.0" y="110.0" font-size="11" fill="#991b1b" font-weight="700" text-anchor="start">⑤ 执行与数据</text>
<text x="820.0" y="132.0" font-size="9.3" fill="#7f1d1d" font-weight="400" text-anchor="start">容器或宿主机上的命令、文</text>
<text x="820.0" y="145.0" font-size="9.3" fill="#7f1d1d" font-weight="400" text-anchor="start">件、网络</text>
<rect x="806.0" y="224.0" width="176.0" height="126.0" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.3"/>
<text x="820.0" y="247.0" font-size="11" fill="#166534" font-weight="700" text-anchor="start">沙箱隔离</text>
<text x="820.0" y="269.0" font-size="9.2" fill="#14532d" font-weight="400" text-anchor="start">Docker/K8s 限制爆炸半径；Local</text>
<text x="820.0" y="282.0" font-size="9.2" fill="#14532d" font-weight="400" text-anchor="start">零隔离，seccomp unconfined</text>
<line x1="894.0" y1="182" x2="894.0" y2="220" stroke="#16a34a" stroke-dasharray="3 4" marker-end="url(#arrowGreen)"/>
<path d="M186 216 l7 3 v7 c0 5 -4 8 -7 10 c-3 -2 -7 -5 -7 -10 v-7 z" fill="#16a34a"/>
<path d="M380 216 l7 3 v7 c0 5 -4 8 -7 10 c-3 -2 -7 -5 -7 -10 v-7 z" fill="#16a34a"/>
<path d="M574 216 l7 3 v7 c0 5 -4 8 -7 10 c-3 -2 -7 -5 -7 -10 v-7 z" fill="#16a34a"/>
<path d="M768 216 l7 3 v7 c0 5 -4 8 -7 10 c-3 -2 -7 -5 -7 -10 v-7 z" fill="#16a34a"/>
<path d="M962 216 l7 3 v7 c0 5 -4 8 -7 10 c-3 -2 -7 -5 -7 -10 v-7 z" fill="#16a34a"/>
<text x="30.0" y="388.0" font-size="12" fill="#92400e" font-weight="700" text-anchor="start">三个最容易漏掉的绕过路径</text>
<rect x="30.0" y="402.0" width="300.0" height="96.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2"/>
<text x="44.0" y="426.0" font-size="10.5" fill="#92400e" font-weight="700" text-anchor="start">未纳入 tools 的工具</text>
<text x="44.0" y="444.0" font-size="9.2" fill="#78350f" font-weight="400" text-anchor="start">MCP、subagent、插件工具不在风险门探测范围；</text>
<text x="44.0" y="456.0" font-size="9.2" fill="#78350f" font-weight="400" text-anchor="start">tools 是冒烟范围，不是边界。</text>
<rect x="345.0" y="402.0" width="300.0" height="96.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2"/>
<text x="359.0" y="426.0" font-size="10.5" fill="#92400e" font-weight="700" text-anchor="start">插件与 Gateway 同进程</text>
<text x="359.0" y="444.0" font-size="9.2" fill="#78350f" font-weight="400" text-anchor="start">host_access 是“归属 + 防误用”，不是隔离；</text>
<text x="359.0" y="456.0" font-size="9.2" fill="#78350f" font-weight="400" text-anchor="start">插件代码拥有 Gateway 权限。</text>
<rect x="660.0" y="402.0" width="300.0" height="96.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2"/>
<text x="674.0" y="426.0" font-size="10.5" fill="#92400e" font-weight="700" text-anchor="start">记忆/知识库投毒</text>
<text x="674.0" y="444.0" font-size="9.2" fill="#78350f" font-weight="400" text-anchor="start">持久化内容跨会话复用；转义只处理标签，不判</text>
<text x="674.0" y="456.0" font-size="9.2" fill="#78350f" font-weight="400" text-anchor="start">断语义。</text>
<rect x="30.0" y="534.0" width="940.0" height="66.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="46.0" y="558.0" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="start">结论：结构注入可以转义，语义注入只能靠最小权限、出网控制、审批与检测。</text>
<text x="46.0" y="580.0" font-size="9.8" fill="#475569" font-weight="400" text-anchor="start">DeerFlow 在前两项有原语（guardrail、sandbox egress）；第三项只有零散审批点，第四项最弱。</text>
</svg>
