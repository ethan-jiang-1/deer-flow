<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 698" font-family="PingFang SC, sans-serif" data-house="v1">
  <title>纵深防御：8 道关口，各自拦什么</title>
  <desc>每一层都假设前一层已被绕过；右侧写的是这一层失效后的后果。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1000" height="698" fill="#ffffff"/>
  <text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">纵深防御：8 道关口，各自拦什么</text>
  <text x="500.0" y="52" text-anchor="middle" font-size="12" fill="#475569">每一层都假设前一层已被绕过；右侧写的是这一层失效后的后果。</text>
<text x="60.0" y="92.0" font-size="10.5" fill="#475569" font-weight="700" text-anchor="start">关口</text>
<text x="676.0" y="92.0" font-size="10.5" fill="#b91c1c" font-weight="700" text-anchor="start">失效后果</text>
<line x1="60" y1="98" x2="960" y2="98" stroke="#e2e8f0"/>
<rect x="60.0" y="108.0" width="580.0" height="56.0" rx="9" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
<circle cx="84" cy="136" r="12" fill="#b91c1c"/>
<text x="84.0" y="140.0" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="106.0" y="130.0" font-size="11.5" fill="#7f1d1d" font-weight="700" text-anchor="start">Auth / CSRF</text>
<text x="106.0" y="146.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">无凭据请求、跨站伪造</text>
<rect x="520.0" y="126.0" width="56.0" height="20.0" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
<text x="548.0" y="140.0" font-size="8.5" fill="#b91c1c" font-weight="700" text-anchor="middle">默认开</text>
<text x="676.0" y="132.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">任何人都能调 API</text>
<rect x="60.0" y="174.0" width="580.0" height="56.0" rx="9" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
<circle cx="84" cy="202" r="12" fill="#b91c1c"/>
<text x="84.0" y="206.0" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="106.0" y="196.0" font-size="11.5" fill="#7f1d1d" font-weight="700" text-anchor="start">Permission</text>
<text x="106.0" y="212.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">越权访问别人的 thread / run</text>
<rect x="520.0" y="192.0" width="56.0" height="20.0" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
<text x="548.0" y="206.0" font-size="8.5" fill="#b91c1c" font-weight="700" text-anchor="middle">默认开</text>
<text x="676.0" y="198.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">用户间数据泄露</text>
<rect x="60.0" y="240.0" width="580.0" height="56.0" rx="9" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2"/>
<circle cx="84" cy="268" r="12" fill="#b45309"/>
<text x="84.0" y="272.0" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="106.0" y="262.0" font-size="11.5" fill="#78350f" font-weight="700" text-anchor="start">Guardrail</text>
<text x="106.0" y="278.0" font-size="9.5" fill="#b45309" font-weight="400" text-anchor="start">未授权的 tool 调用</text>
<rect x="520.0" y="258.0" width="56.0" height="20.0" rx="10" fill="#ffffff" stroke="#fbbf24" stroke-width="1"/>
<text x="548.0" y="272.0" font-size="8.5" fill="#b45309" font-weight="700" text-anchor="middle">默认关</text>
<text x="676.0" y="264.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">LLM 可以调任意 tool</text>
<rect x="60.0" y="306.0" width="580.0" height="56.0" rx="9" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2"/>
<circle cx="84" cy="334" r="12" fill="#b45309"/>
<text x="84.0" y="338.0" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="106.0" y="328.0" font-size="11.5" fill="#78350f" font-weight="700" text-anchor="start">Plugin authz</text>
<text x="106.0" y="344.0" font-size="9.5" fill="#b45309" font-weight="400" text-anchor="start">越权的插件 action / 管理路由</text>
<rect x="520.0" y="324.0" width="56.0" height="20.0" rx="10" fill="#ffffff" stroke="#fbbf24" stroke-width="1"/>
<text x="548.0" y="338.0" font-size="8.5" fill="#b45309" font-weight="700" text-anchor="middle">看授权</text>
<text x="676.0" y="330.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">以他人身份触发插件</text>
<rect x="60.0" y="372.0" width="580.0" height="56.0" rx="9" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
<circle cx="84" cy="400" r="12" fill="#b91c1c"/>
<text x="84.0" y="404.0" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="106.0" y="394.0" font-size="11.5" fill="#7f1d1d" font-weight="700" text-anchor="start">SandboxAudit</text>
<text x="106.0" y="410.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">高危 bash：rm -rf /、dd、mkfs…</text>
<rect x="520.0" y="390.0" width="56.0" height="20.0" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
<text x="548.0" y="404.0" font-size="8.5" fill="#b91c1c" font-weight="700" text-anchor="middle">默认开</text>
<text x="676.0" y="396.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">rm -rf / 被执行</text>
<rect x="60.0" y="438.0" width="580.0" height="56.0" rx="9" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
<circle cx="84" cy="466" r="12" fill="#b91c1c"/>
<text x="84.0" y="470.0" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<text x="106.0" y="460.0" font-size="11.5" fill="#7f1d1d" font-weight="700" text-anchor="start">Path containment</text>
<text x="106.0" y="476.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">路径穿越、越界 symlink</text>
<rect x="520.0" y="456.0" width="56.0" height="20.0" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
<text x="548.0" y="470.0" font-size="8.5" fill="#b91c1c" font-weight="700" text-anchor="middle">默认开</text>
<text x="676.0" y="462.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">读越界文件、污染共享目录</text>
<rect x="60.0" y="504.0" width="580.0" height="56.0" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
<circle cx="84" cy="532" r="12" fill="#1d4ed8"/>
<text x="84.0" y="536.0" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
<text x="106.0" y="526.0" font-size="11.5" fill="#1e3a8a" font-weight="700" text-anchor="start">Sandbox isolation</text>
<text x="106.0" y="542.0" font-size="9.5" fill="#1d4ed8" font-weight="400" text-anchor="start">逃逸到宿主 / 横向移动</text>
<rect x="520.0" y="522.0" width="56.0" height="20.0" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
<text x="548.0" y="536.0" font-size="8.5" fill="#1d4ed8" font-weight="700" text-anchor="middle">看模式</text>
<text x="676.0" y="528.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">host 被控制</text>
<rect x="60.0" y="570.0" width="580.0" height="56.0" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
<circle cx="84" cy="598" r="12" fill="#1d4ed8"/>
<text x="84.0" y="602.0" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">8</text>
<text x="106.0" y="592.0" font-size="11.5" fill="#1e3a8a" font-weight="700" text-anchor="start">OS / Kernel</text>
<text x="106.0" y="608.0" font-size="9.5" fill="#1d4ed8" font-weight="400" text-anchor="start">内核漏洞、提权、无限制出网</text>
<rect x="520.0" y="588.0" width="56.0" height="20.0" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
<text x="548.0" y="602.0" font-size="8.5" fill="#1d4ed8" font-weight="700" text-anchor="middle">看部署</text>
<text x="676.0" y="594.0" font-size="9.5" fill="#b91c1c" font-weight="400" text-anchor="start">整机沦陷</text>
<line x1="38" y1="108" x2="38" y2="614" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
<text x="38.0" y="100.0" font-size="8.5" fill="#b91c1c" font-weight="700" text-anchor="middle">输入</text>
<text x="38.0" y="632.0" font-size="8.5" fill="#b91c1c" font-weight="700" text-anchor="middle">执行</text>
<line x1="60" y1="640" x2="960" y2="640" stroke="#e2e8f0"/>
<text x="60.0" y="662.0" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">默认开 = 代码内建且默认生效；默认关 = 需要显式配置；看模式/看部署 = 取决于 sandbox provider 与集群策略。</text>
<text x="60.0" y="682.0" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">粗粒度 7 层见 00-overview；16 层细粒度与端到端执行流见 04-trust-boundary。</text>
<text x="960.0" y="662.0" font-size="9" fill="#94a3b8" font-weight="400" text-anchor="end">* 仅 authorization.enabled=true 时生效；依赖插件安装与声明</text>
</svg>
