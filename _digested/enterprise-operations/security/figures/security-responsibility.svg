    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1000" height="612" fill="#ffffff"/>
  <text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">安全能力的责任边界：运行时、平台、组织</text>
  <text x="500.0" y="52" text-anchor="middle" font-size="12" fill="#475569">DeerFlow 的重心在底层运行时；企业评审的重心在中层平台与上层组织。</text>
