<text x="78" y="459" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 78 459)">运行时</text>
<text x="128.0" y="420.0" font-size="9.5" fill="#14532d" font-weight="700" text-anchor="start">DeerFlow 自带</text>
<rect x="128.0" y="434.0" width="264.0" height="32.0" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1"/>
<text x="142.0" y="455.0" font-size="9.5" fill="#15803d" font-weight="600" text-anchor="start">认证 / CSRF / PAT</text>
<rect x="408.0" y="434.0" width="264.0" height="32.0" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1"/>
<text x="422.0" y="455.0" font-size="9.5" fill="#15803d" font-weight="600" text-anchor="start">RBAC / Guardrail</text>
<rect x="688.0" y="434.0" width="264.0" height="32.0" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1"/>
<text x="702.0" y="455.0" font-size="9.5" fill="#15803d" font-weight="600" text-anchor="start">沙箱 / 路径防护</text>
<rect x="128.0" y="474.0" width="264.0" height="32.0" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1"/>
<text x="142.0" y="495.0" font-size="9.5" fill="#15803d" font-weight="600" text-anchor="start">密钥脱敏</text>
<rect x="408.0" y="474.0" width="264.0" height="32.0" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1"/>
<text x="422.0" y="495.0" font-size="9.5" fill="#15803d" font-weight="600" text-anchor="start">RunJournal / 审计</text>
<rect x="688.0" y="474.0" width="264.0" height="32.0" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1"/>
<text x="702.0" y="495.0" font-size="9.5" fill="#15803d" font-weight="600" text-anchor="start">SkillScan / 插件 grant</text>
<rect x="700.0" y="524.0" width="270.0" height="46.0" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1"/>
<text x="716.0" y="543.0" font-size="10" fill="#166534" font-weight="700" text-anchor="start">DeerFlow 的重心</text>
<text x="716.0" y="560.0" font-size="9.3" fill="#14532d" font-weight="400" text-anchor="start">把“执行时不出事”做深</text>
<rect x="30.0" y="524.0" width="300.0" height="46.0" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1"/>
<text x="46.0" y="543.0" font-size="10" fill="#1d4ed8" font-weight="700" text-anchor="start">企业评审的重心</text>
<text x="46.0" y="560.0" font-size="9.3" fill="#1e3a8a" font-weight="400" text-anchor="start">身份、数据、审计、审批、合规证据</text>
<text x="30.0" y="590.0" font-size="9.8" fill="#475569" font-weight="400" text-anchor="start">责任自下而上：运行时 → 平台 → 组织。正确姿势：把运行时嵌进企业边界；错误姿势：把运行时当平台卖。</text>
</svg>
