<rect x="688.0" y="322.0" width="264.0" height="32.0" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
<text x="702.0" y="343.0" font-size="9.5" fill="#1d4ed8" font-weight="600" text-anchor="start">网络策略 / 审批流</text>
