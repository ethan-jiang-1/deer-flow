<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" font-family="PingFang SC, sans-serif" data-house="v1">
  <title>安全能力的责任边界：运行时、平台、组织</title>
  <desc>DeerFlow 的重心在底层运行时；企业评审的重心在中层平台与上层组织。</desc>
