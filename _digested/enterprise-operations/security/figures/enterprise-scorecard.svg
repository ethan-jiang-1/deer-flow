  <text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">企业安全就绪度：10 个维度，DeerFlow 答到哪</text>
  <text x="500.0" y="52" text-anchor="middle" font-size="12" fill="#475569">●○○ = 只有原语，企业要自建；●●○ = 有可执行控制，但默认关或不完整；●●● = 默认安全、可审计、可集成。</text>
