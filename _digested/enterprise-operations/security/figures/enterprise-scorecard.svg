<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 834" font-family="PingFang SC, sans-serif" data-house="v1">
  <title>企业安全就绪度：10 个维度，DeerFlow 答到哪</title>
  <desc>●○○ = 只有原语，企业要自建；●●○ = 有可执行控制，但默认关或不完整；●●● = 默认安全、可审计、可集成。</desc>
