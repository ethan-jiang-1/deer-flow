<circle cx="452" cy="653" r="5.5" fill="#b45309" stroke="#b45309" stroke-width="1.2"/>
<circle cx="470" cy="653" r="5.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="50.0" y="682.0" font-size="9" fill="#15803d" font-weight="700" text-anchor="start">有</text>
<text x="74.0" y="682.0" font-size="9.3" fill="#475569" font-weight="400" text-anchor="start">Docker/K8s + cap-drop + no-new-privileges</text>
<text x="50.0" y="720.0" font-size="9" fill="#b91c1c" font-weight="700" text-anchor="start">缺</text>
