<line x1="30" y1="776" x2="970" y2="776" stroke="#e2e8f0"/>
<text x="30.0" y="798.0" font-size="10" fill="#0f172a" font-weight="700" text-anchor="start">整体：运行时约 L2，企业治理约 L1；10 个维度中没有一项达到 L3。</text>
<text x="30.0" y="818.0" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">L3 不是“代码更多”，而是“默认安全 + 可审计 + 可集成”——需要产品化，不是加一个 middleware。</text>
