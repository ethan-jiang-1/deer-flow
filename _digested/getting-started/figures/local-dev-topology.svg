<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="PingFang SC, sans-serif" data-house="v1">
  <title>本地拓扑：一个入口，两个并列上游</title>
  <desc>浏览器只认 2026；Nginx 把 /api 转给 Gateway、其余转给 Frontend；Redis 按需。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker></defs>
  <rect width="1000" height="450" fill="#ffffff"/>
  <text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">本地拓扑：一个入口，两个并列上游</text>
  <text x="500.0" y="52" text-anchor="middle" font-size="12" fill="#475569">浏览器只认 2026；Nginx 把 /api 转给 Gateway、其余转给 Frontend；Redis 按需。</text>
<rect x="370" y="150" width="260" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="500.0" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Nginx :2026</text>
<text x="500.0" y="202" text-anchor="middle" font-size="9.5" fill="#854d0e">静态前端 + /api 反代 + SSE</text>
<rect x="50" y="150" width="240" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="170.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">Browser</text>
<text x="170.0" y="204" text-anchor="middle" font-size="9.5" fill="#075985">localhost:2026</text>
<line x1="294" y1="195.0" x2="366" y2="195.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="710" y="105" width="240" height="82" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="830.0" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">Gateway :8001</text>
<text x="830.0" y="153" text-anchor="middle" font-size="9" fill="#075985">/api/* 与</text>
<text x="830.0" y="167" text-anchor="middle" font-size="9" fill="#075985">api/langgraph/*</text>
<line x1="634" y1="195.0" x2="706" y2="146.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="710" y="225" width="240" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="830.0" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Frontend :3000</text>
<text x="830.0" y="273" text-anchor="middle" font-size="9" fill="#166534">Next.js 静态/SSR</text>
<line x1="634" y1="195.0" x2="706" y2="266.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="370" y="330" width="260" height="72" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="500.0" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Redis（可选）</text>
<text x="500.0" y="378" text-anchor="middle" font-size="9" fill="#64748b">多 worker / stream bridge</text>
<text x="500.0" y="392" text-anchor="middle" font-size="9" fill="#64748b">才需要</text>
<line x1="500.0" y1="242" x2="500.0" y2="326" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
</svg>
