<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="t d">
  <title id="t">五种接入形态的选择：你要改变的是什么</title>
  <desc id="d">决策图：从问题"你要改变的是什么"出发，分四路——改变宿主进程的组合选 extension 包，改变模型的工作方法选 skill，接入现成外部工具选 MCP server，以 agent 为核心构建整个应用选内嵌 harness；另有第五种接入面（配置面）：改变 task 委派目录选 custom agent 定义（config.yaml 的 custom_agents、Settings 托管定义或 ACP 外部进程 agent），不写代码。每路标注入口与分发形态。依据 bytedance/deer-flow v2.1.0 一手证据绘制。</desc>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#ffffff"/>

  <rect x="260" y="20" width="400" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="53" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">你要改变的是什么？</text>

  <line x1="330" y1="74" x2="140" y2="118" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="410" y1="74" x2="365" y2="118" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="510" y1="74" x2="590" y2="118" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="590" y1="74" x2="815" y2="118" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="25" y="122" width="230" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151">宿主进程的组合</text>
  <text x="140" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111827">extension 包</text>

  <rect x="275" y="122" width="230" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151">模型的工作方法</text>
  <text x="390" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111827">skill</text>

  <rect x="525" y="122" width="230" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151">现成外部工具</text>
  <text x="640" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111827">MCP server</text>

  <rect x="775" y="122" width="120" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="835" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151">整个应用</text>
  <text x="835" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111827">内嵌 harness</text>

  <rect x="25" y="210" width="230" height="160" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="40" y="236" font-family="sans-serif" font-size="12" fill="#111827">入口：PEP 621 入口点</text>
  <text x="40" y="256" font-family="sans-serif" font-size="12" fill="#111827">（deerflow.extensions 组）</text>
  <text x="40" y="284" font-family="sans-serif" font-size="12" fill="#111827">分发：extension manager</text>
  <text x="40" y="304" font-family="sans-serif" font-size="12" fill="#111827">安装事务（快照→依赖组</text>
  <text x="40" y="324" font-family="sans-serif" font-size="12" fill="#111827">→lock→plugins 条目）</text>
  <text x="40" y="352" font-family="sans-serif" font-size="11" fill="#2563eb">适合：中间件/观察者/服务/路由</text>

  <rect x="275" y="210" width="230" height="160" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="290" y="236" font-family="sans-serif" font-size="12" fill="#111827">入口：SKILL.md（权威定义）</text>
  <text x="290" y="260" font-family="sans-serif" font-size="12" fill="#111827">分发：技能目录（public/ 随仓、</text>
  <text x="290" y="278" font-family="sans-serif" font-size="12" fill="#111827">custom/ 自建）＋ 运行时归档安装</text>
  <text x="290" y="296" font-family="sans-serif" font-size="12" fill="#111827">（Gateway API，过安全扫描，</text>
  <text x="290" y="314" font-family="sans-serif" font-size="12" fill="#111827">无需重启，不动 plugins/lock）</text>
  <text x="290" y="338" font-family="sans-serif" font-size="12" fill="#111827">按需加载，不占常驻上下文</text>
  <text x="290" y="356" font-family="sans-serif" font-size="11" fill="#2563eb">适合：方法与资料，不改运行时</text>

  <rect x="525" y="210" width="230" height="160" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="540" y="236" font-family="sans-serif" font-size="12" fill="#111827">入口：extensions_config.json</text>
  <text x="540" y="256" font-family="sans-serif" font-size="12" fill="#111827">的 mcpServers 配置</text>
  <text x="540" y="284" font-family="sans-serif" font-size="12" fill="#111827">分发：配置声明</text>
  <text x="540" y="312" font-family="sans-serif" font-size="12" fill="#111827">routing 仅软性偏好提示，</text>
  <text x="540" y="332" font-family="sans-serif" font-size="12" fill="#111827">不构成硬性强制</text>
  <text x="540" y="352" font-family="sans-serif" font-size="11" fill="#2563eb">适合：工具面，不在 DeerFlow 侧写代码</text>

  <rect x="775" y="210" width="120" height="160" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="790" y="236" font-family="sans-serif" font-size="12" fill="#111827">入口：</text>
  <text x="790" y="256" font-family="sans-serif" font-size="11" fill="#111827">create_deerflow</text>
  <text x="790" y="272" font-family="sans-serif" font-size="11" fill="#111827">_agent /</text>
  <text x="790" y="288" font-family="sans-serif" font-size="11" fill="#111827">DeerFlowClient</text>
  <text x="790" y="312" font-family="sans-serif" font-size="12" fill="#111827">分发：依赖引入</text>
  <text x="790" y="330" font-family="sans-serif" font-size="12" fill="#111827">你的应用本身</text>
  <text x="790" y="352" font-family="sans-serif" font-size="11" fill="#2563eb">适合：嵌入你的进程</text>

  <rect x="25" y="385" width="870" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="460" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">第五种接入面（配置面）：custom agent 定义 —— 改变的是 task 委派目录里有什么</text>
  <text x="460" y="432" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">config.yaml subagents.custom_agents（重启生效）· Settings→Subagents（即时生效）· acp_agents:（外部进程 agent）</text>

  <text x="460" y="478" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">五者不互斥（可同时内嵌并贡献 skill）· 详见 01-new-application-repository.md · 依据 bytedance/deer-flow v2.1.0</text>
</svg>
