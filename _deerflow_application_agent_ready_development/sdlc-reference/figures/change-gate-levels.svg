<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="t d">
  <title id="t">DeerFlow 主仓变更主线与每阶段的门禁等级</title>
  <desc id="d">两行图：上行是变更主线的八个阶段（意图对齐、spec 与 plan、实现、PR、CI、发版、数据迁移、运维反馈）；下行标注每个阶段的门禁等级——成文标准、自我声明、机器门禁或文化惯性，其中发版的版本门最强、运维反馈的失败回写无门禁仅靠文化惯性。图例解释这四个等级，另注"仓库外不可核实"一类（不在阶段行中）。依据 bytedance/deer-flow v2.1.0 一手证据绘制。</desc>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="920" height="470" fill="#ffffff"/>

  <text x="20" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">变更主线</text>
  <rect x="20" y="52" width="100" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="70" y="83" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">意图对齐</text>
  <rect x="132" y="52" width="100" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="182" y="83" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">spec·plan</text>
  <rect x="244" y="52" width="100" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="294" y="83" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">实现·TDD</text>
  <rect x="356" y="52" width="100" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="406" y="83" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">PR 表面</text>
  <rect x="468" y="52" width="100" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="518" y="83" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">CI 门禁</text>
  <rect x="580" y="52" width="100" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="630" y="83" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">发版</text>
  <rect x="692" y="52" width="100" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="742" y="83" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">数据迁移</text>
  <rect x="804" y="52" width="100" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="854" y="83" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">运维反馈</text>
  <line x1="120" y1="78" x2="130" y2="78" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="232" y1="78" x2="242" y2="78" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="344" y1="78" x2="354" y2="78" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="456" y1="78" x2="466" y2="78" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="568" y1="78" x2="578" y2="78" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="680" y1="78" x2="690" y2="78" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="792" y1="78" x2="802" y2="78" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr4)"/>

  <text x="20" y="140" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">门禁等级</text>
  <rect x="20" y="150" width="100" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="70" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#065f46">成文标准</text>
  <rect x="132" y="150" width="100" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="182" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#065f46">成文标准</text>
  <rect x="244" y="150" width="100" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="294" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#065f46">成文标准</text>
  <text x="294" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#065f46">（red 靠自报）</text>
  <rect x="356" y="150" width="100" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="406" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#92400e">成文标准</text>
  <text x="406" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">＋自我声明</text>
  <rect x="468" y="150" width="100" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="518" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e40af">机器门禁</text>
  <rect x="580" y="150" width="100" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="630" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">机器门禁</text>
  <text x="630" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">（版本门·最强）</text>
  <rect x="692" y="150" width="100" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="742" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e40af">成文标准</text>
  <text x="742" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">＋随单测执行</text>
  <rect x="804" y="150" width="100" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="854" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#92400e">文化惯性</text>
  <text x="854" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">（失败回写）</text>

  <text x="20" y="240" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">图例</text>
  <rect x="20" y="252" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="42" y="264" font-family="sans-serif" font-size="12" fill="#374151">成文标准——指南/模板写明的要求，不自动执行</text>
  <rect x="20" y="278" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="42" y="290" font-family="sans-serif" font-size="12" fill="#374151">自我声明——PR 表单自报（验证命令、red-green、AI 披露）</text>
  <rect x="20" y="304" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="42" y="316" font-family="sans-serif" font-size="12" fill="#374151">机器门禁——CI workflow/测试自动执行，能挡住合并或发布</text>
  <rect x="20" y="330" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="42" y="342" font-family="sans-serif" font-size="12" fill="#374151">文化惯性——无门禁，靠习惯维持（虚线框；失败回写即此类）</text>
  <text x="20" y="366" font-family="sans-serif" font-size="12" fill="#6b7280">注：仓库外不可核实——分支保护、required checks、人工批准——不在阶段行中，各页单独标注。</text>

  <text x="460" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">读任何一条规则先问它在哪一层——把指南要求当作已被 CI 强制，是读主仓制度最易犯的过度概括。</text>
  <text x="460" y="455" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">依据 bytedance/deer-flow v2.1.0 的 PR 模板与 CI workflows 绘制 · 逐阶段条款见 sdlc-reference/01–10 各页</text>
</svg>
